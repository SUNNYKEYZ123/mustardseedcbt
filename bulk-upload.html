<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="https://sunnykeyz123.github.io/mustardseedschl/images/Logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mustard Seed CBT - Secure Bulk Upload</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div id="root" class="w-full max-w-2xl"></div>

    <!-- React Framework Engines -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Firebase System -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDOO3uHmzOuAxJcdLxu-OImzlH12A6FpeY",
            authDomain: "my-project-a6208.firebaseapp.com",
            projectId: "my-project-a6208",
            storageBucket: "my-project-a6208.firebasestorage.app",
            messagingSenderId: "784486701962",
            appId: "1:784486701962:web:0d3cd002bbfd647e944673"
        };

        const app = initializeApp(firebaseConfig);
        window.fb = { db: getFirestore(app), collection, addDoc };
    </script>

    <!-- App Engine Execution -->
    <script>
        const e = React.createElement;
        const ADMIN_PASSWORD = 'SUNNYKEYZ2025@';
        const CLASSES = ['SSS 1', 'SSS 2', 'SSS 3', 'JSS 1', 'JSS 2', 'JSS 3'];

        const BulkUploadApp = () => {
            const [isAuthorized, setIsAuthorized] = React.useState(null);
            const [selectedClass, setSelectedClass] = React.useState('SSS 1');
            const [batchText, setBatchText] = React.useState('');
            const [uploading, setUploading] = React.useState(false);

            // Instant Security Gate
            React.useEffect(() => {
                const urlParams = new URLSearchParams(window.location.search);
                const token = urlParams.get('token');

                if (token === ADMIN_PASSWORD) {
                    setIsAuthorized(true);
                } else {
                    setIsAuthorized(false);
                    setTimeout(() => {
                        window.location.href = "CBT (7).html"; 
                    }, 2500);
                }
            }, []);

            // Parser core for a, b, d, e formats
            const parseRawText = (text) => {
                if (!text.trim()) return [];
                const structuralBlocks = text.split(/\n(?=\d+[\)\.]\s*)/);
                const formattedQuestions = [];

                structuralBlocks.forEach(block => {
                    const lines = block.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                    if (lines.length < 3) return;

                    let questionText = "";
                    let options = [];
                    let correctLetter = "";

                    lines.forEach(line => {
                        if (/^\d+[\)\.]/.test(line)) {
                            questionText = line.replace(/^\d+[\)\.]\s*/, '');
                        } else if (/^[aAbBdDeE][\)\.]/.test(line)) {
                            options.push(line.replace(/^[aAbBdDeE][\)\.]\s*/, ''));
                        } else if (/^Correct:\s*/i.test(line)) {
                            correctLetter = line.replace(/^Correct:\s*/i, '').trim().toLowerCase();
                        }
                    });

                    if (questionText && options.length > 0) {
                        let correctIndex = 0;
                        if (correctLetter === 'b') correctIndex = 1;
                        if (correctLetter === 'd') correctIndex = 2;
                        if (correctLetter === 'e') correctIndex = 3;

                        formattedQuestions.push({
                            questionText: questionText,
                            options: options,
                            correctOptionIndex: correctIndex
                        });
                    }
                });
                return formattedQuestions;
            };

            if (isAuthorized === null) {
                return e('div', { className: 'text-center font-black tracking-widest text-xs text-blue-400 animate-pulse' }, 'VERIFYING SECURITY CREDENTIALS...');
            }

            if (isAuthorized === false) {
                return e('div', { className: 'bg-red-950 border border-red-500 text-red-200 p-8 rounded-3xl text-center shadow-2xl max-w-sm mx-auto' },
                    e('h1', { className: 'text-xl font-black mb-2' }, '⛔ ACCESS DENIED'),
                    e('p', { className: 'text-[10px] font-black opacity-80 uppercase tracking-wider' }, 'Invalid Token. Kicking back to safe zone...')
                );
            }

            const parsedCount = parseRawText(batchText).length;

            return e('div', { className: 'bg-white text-slate-900 p-8 rounded-[2.5rem] shadow-2xl border w-full' },
                e('div', { className: 'flex items-center justify-between mb-6 border-b pb-4' },
                    e('div', null,
                        e('h2', { className: 'text-xl font-black uppercase tracking-tight text-emerald-600' }, 'Secure Bulk Parser'),
                        e('p', { className: 'text-[10px] font-bold text-gray-400 uppercase tracking-wider' }, 'Authenticated Session')
                    ),
                    e('img', { src: 'https://sunnykeyz123.github.io/mustardseedschl/images/Logo.png', className: 'w-12' })
                ),

                e('div', { className: 'mb-5' },
                    e('label', { className: 'text-[10px] font-black uppercase tracking-wider text-slate-400 block mb-2' }, 'Target Class Channel'),
                    e('select', { 
                        className: 'w-full p-4 border rounded-2xl font-black text-xs uppercase bg-emerald-50 outline-none', 
                        value: selectedClass, 
                        onChange: img => setSelectedClass(img.target.value) 
                    }, CLASSES.map(c => e('option', { key: c, value: c }, c)))
                ),

                e('div', { className: 'mb-5' },
                    e('label', { className: 'text-[10px] font-black uppercase tracking-wider text-slate-400 block mb-2' }, 'Raw Question Data Pasteboard'),
                    e('textarea', {
                        className: 'w-full p-4 border rounded-2xl bg-slate-50 font-mono text-xs h-64 outline-none focus:border-emerald-500 transition leading-relaxed',
                        placeholder: "1. Computer part used to type is?\na) Monitor\nb) Keyboard\nd) Mouse\ne) Printer\nCorrect: b",
                        value: batchText,
                        onChange: img => setBatchText(img.target.value)
                    })
                ),

                e('div', { className: 'bg-slate-50 p-4 rounded-2xl border border-dashed text-center' },
                    e('p', { className: 'text-xs font-black text-slate-600 uppercase mb-3' }, `${parsedCount} questions identified in current matrix frame.`),
                    e('button', {
                        disabled: uploading || parsedCount === 0,
                        className: 'w-full bg-emerald-600 hover:bg-emerald-700 disabled:opacity-40 text-white py-4 rounded-xl font-black uppercase text-xs tracking-wider transition shadow-lg',
                        onClick: async () => {
                            const parsed = parseRawText(batchText);
                            if (parsed.length === 0) return alert("No valid schemas extracted.");
                            if (!confirm(`Commit ${parsed.length} items directly to database questions for ${selectedClass}?`)) return;

                            setUploading(true);
                            try {
                                for (let q of parsed) {
                                    await window.fb.addDoc(window.fb.collection(window.fb.db, "artifacts/my-project-a6208/public/data/questions"), {
                                        className: selectedClass,
                                        questionText: q.questionText,
                                        options: q.options,
                                        correctOptionIndex: q.correctOptionIndex,
                                        type: 'obj',
                                        keywords: [],
                                        points: 2
                                    });
                                }
                                alert(`Successfully uploaded all ${parsed.length} items to database!`);
                                setBatchText('');
                            } catch (err) {
                                alert("Database write error: " + err.message);
                            }
                            setUploading(false);
                        }
                    }, uploading ? "Executing Data Deployment..." : `Deploy Bulk Upload to ${selectedClass}`)
                )
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(e(BulkUploadApp));
    </script>
</body>
</html>
