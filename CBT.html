<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="https://sunnykeyz123.github.io/mustardseedschl/images/Logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mustard Seed CBT - Pro Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, onSnapshot, query, where, setDoc, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDOO3uHmzOuAxJcdLxu-OImzlH12A6FpeY",
            authDomain: "my-project-a6208.firebaseapp.com",
            projectId: "my-project-a6208",
            storageBucket: "my-project-a6208.firebasestorage.app",
            messagingSenderId: "784486701962",
            appId: "1:784486701962:web:0d3cd002bbfd647e944673"
        };

        const app = initializeApp(firebaseConfig);
        window.fb = {
            db: getFirestore(app),
            auth: getAuth(app),
            collection, addDoc, getDocs, doc, deleteDoc, onSnapshot, query, where, signInAnonymously, onAuthStateChanged, setDoc, writeBatch
        };
    </script>

    <script type="text/babel">
        const { createClient } = window.supabase;
        const SB_URL = 'https://jqrcoqslmylmubxwfgyt.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxcmNvcXNsbXlsbXVieHdmZ3l0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ2ODc2NzgsImV4cCI6MjA4MDI2MzY3OH0.4bXOY35R3eGYZjPxtuJzvwifPEfHXr5UEdzFbB-caKU';
        const _supabase = createClient(SB_URL, SB_KEY);

        const AppContext = React.createContext(null);
        const ADMIN_PASSWORD = 'SUNNYKEYZ2025@';
        const optionLetters = ['A', 'B', 'C', 'D'];
        const GRADE_LEVELS = ['JSS 1', 'JSS 2', 'JSS 3', 'SSS 1', 'SSS 2', 'SSS 3'];

        // --- ADMIN PAGE ---
        const AdminPage = () => {
            const { setPage } = React.useContext(AppContext);
            const [auth, setAuth] = React.useState(false);
            const [pass, setPass] = React.useState('');
            const [activeTab, setActiveTab] = React.useState('dashboard'); 
            const [scores, setScores] = React.useState([]);
            const [questions, setQuestions] = React.useState([]);
            const [examLive, setExamLive] = React.useState(false);
            const [newQ, setNewQ] = React.useState({ text: '', options: ['', '', '', ''], correct: 0, gradeLevel: 'SSS 1' });

            React.useEffect(() => {
                if (!auth) return;
                const unsub1 = fb.onSnapshot(fb.collection(fb.db, "artifacts/my-project-a6208/scores"), (s) => {
                    setScores(s.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => (b.date?.seconds || 0) - (a.date?.seconds || 0)));
                });
                const unsub2 = fb.onSnapshot(fb.collection(fb.db, "artifacts/my-project-a6208/public/data/questions"), (s) => {
                    setQuestions(s.docs.map(d => ({id: d.id, ...d.data()})));
                });
                const unsub3 = fb.onSnapshot(fb.doc(fb.db, "artifacts/my-project-a6208/settings/examControl"), (doc) => {
                    if (doc.exists()) setExamLive(doc.data().isLive);
                });
                return () => { unsub1(); unsub2(); unsub3(); };
            }, [auth]);

            const toggleExam = async () => await fb.setDoc(fb.doc(fb.db, "artifacts/my-project-a6208/settings/examControl"), { isLive: !examLive });

            const addQuestion = async () => {
                if(!newQ.text) return alert("Enter Question!");
                await fb.addDoc(fb.collection(fb.db, "artifacts/my-project-a6208/public/data/questions"), {
                    questionText: newQ.text, options: newQ.options, correctOptionIndex: parseInt(newQ.correct), gradeLevel: newQ.gradeLevel
                });
                setNewQ({ ...newQ, text: '', options: ['', '', '', ''] });
                alert("Question Saved!");
            };

            const deleteAllResults = async () => {
                if(!confirm("WIPE ALL RESULTS?")) return;
                const batch = fb.writeBatch(fb.db);
                scores.forEach(s => batch.delete(fb.doc(fb.db, "artifacts/my-project-a6208/scores", s.id)));
                await batch.commit();
            };

            if (!auth) return (
                <div className="flex items-center justify-center min-h-screen bg-gray-100">
                    <div className="bg-white p-8 rounded-2xl shadow-xl border w-80">
                        <h2 className="text-xl font-black mb-4">ADMIN LOGIN</h2>
                        <input type="password" border rounded-lg mb-4 p-3 w-full outline-none focus:border-blue-500" onChange={e => setPass(e.target.value)} />
                        <button onClick={() => pass === ADMIN_PASSWORD ? setAuth(true) : alert("Denied")} className="w-full bg-blue-600 text-white py-3 rounded-lg font-bold">Access Panel</button>
                    </div>
                </div>
            );

            return (
                <div className="flex min-h-screen bg-gray-50">
                    <aside className="w-64 bg-slate-900 text-white flex flex-col p-6 fixed h-full">
                        <h1 className="text-xl font-black mb-10 text-blue-400">MUSTARD ADMIN</h1>
                        <nav className="space-y-2 flex-1">
                            <button onClick={()=>setActiveTab('dashboard')} className={`w-full text-left p-3 rounded-lg font-bold transition ${activeTab==='dashboard'?'bg-blue-600':'hover:bg-slate-800 text-gray-400'}`}>📊 Dashboard</button>
                            <button onClick={()=>setActiveTab('questions')} className={`w-full text-left p-3 rounded-lg font-bold transition ${activeTab==='questions'?'bg-blue-600':'hover:bg-slate-800 text-gray-400'}`}>📝 Question Bank</button>
                            <button onClick={()=>setActiveTab('results')} className={`w-full text-left p-3 rounded-lg font-bold transition ${activeTab==='results'?'bg-blue-600':'hover:bg-slate-800 text-gray-400'}`}>🏆 Exam Results</button>
                        </nav>
                        <button onClick={()=>setPage('home')} className="mt-10 text-gray-400 text-sm">← Logout</button>
                    </aside>

                    <main className="flex-1 ml-64 p-10">
                        {activeTab === 'dashboard' && (
                            <div className="space-y-6">
                                <h2 className="text-3xl font-black">System Overview</h2>
                                <div className="grid grid-cols-3 gap-6">
                                    <div className="bg-white p-6 rounded-2xl shadow border">
                                        <p className="text-gray-400 font-bold text-xs uppercase">Exam Status</p>
                                        <h3 className={`text-2xl font-black ${examLive?'text-green-500':'text-red-500'}`}>{examLive?'LIVE':'OFFLINE'}</h3>
                                        <button onClick={toggleExam} className="mt-4 w-full py-2 bg-slate-900 text-white rounded-lg font-bold">{examLive?'Stop Exam':'Start Exam'}</button>
                                    </div>
                                    <div className="bg-white p-6 rounded-2xl shadow border text-center">
                                        <p className="text-gray-400 font-bold text-xs uppercase">Questions</p>
                                        <h3 className="text-4xl font-black">{questions.length}</h3>
                                    </div>
                                    <div className="bg-white p-6 rounded-2xl shadow border text-center">
                                        <p className="text-gray-400 font-bold text-xs uppercase">Submissions</p>
                                        <h3 className="text-4xl font-black text-blue-600">{scores.length}</h3>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'questions' && (
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-10">
                                <section className="bg-white p-6 rounded-2xl shadow border h-fit sticky top-10">
                                    <h2 className="text-xl font-black mb-4">Add New Question</h2>
                                    <textarea className="w-full p-4 border rounded-xl mb-4 bg-gray-50" value={newQ.text} onChange={e=>setNewQ({...newQ, text:e.target.value})} />
                                    <div className="grid grid-cols-2 gap-2 mb-4">
                                        {newQ.options.map((o,i)=>(<input key={i} className="p-2 border rounded" placeholder={`Option ${optionLetters[i]}`} value={o} onChange={e=>{let c=[...newQ.options];c[i]=e.target.value;setNewQ({...newQ,options:c})}} />))}
                                    </div>
                                    <div className="flex gap-2 mb-4">
                                        <select className="flex-1 p-2 border rounded font-bold" value={newQ.correct} onChange={e=>setNewQ({...newQ,correct:e.target.value})}>{optionLetters.map((l,i)=><option key={i} value={i}>Ans: {l}</option>)}</select>
                                        <select className="flex-1 p-2 border rounded font-bold bg-blue-50" value={newQ.gradeLevel} onChange={e=>setNewQ({...newQ, gradeLevel: e.target.value})}>{GRADE_LEVELS.map(g => <option key={g} value={g}>{g}</option>)}</select>
                                    </div>
                                    <button onClick={addQuestion} className="w-full bg-blue-600 text-white py-3 rounded-xl font-bold">Add to Bank</button>
                                </section>

                                <section className="space-y-3">
                                    <h2 className="text-xl font-black">Bank ({questions.length})</h2>
                                    {questions.map((q,i)=>(
                                        <div key={q.id} className="bg-white p-4 rounded-xl border flex justify-between items-center shadow-sm">
                                            <div className="text-xs">
                                                <span className="bg-blue-100 text-blue-600 px-2 rounded mr-2 font-black">{q.gradeLevel}</span>
                                                <span className="font-bold">{q.questionText}</span>
                                            </div>
                                            <button onClick={async()=>await fb.deleteDoc(fb.doc(fb.db,"artifacts/my-project-a6208/public/data/questions",q.id))} className="text-red-400 font-bold">Del</button>
                                        </div>
                                    ))}
                                </section>
                            </div>
                        )}

                        {activeTab === 'results' && (
                            <div className="space-y-4">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-2xl font-black">Student Results</h2>
                                    <button onClick={deleteAllResults} className="bg-red-500 text-white px-4 py-2 rounded-lg text-xs font-bold">WIPE ALL</button>
                                </div>
                                <div className="bg-white rounded-2xl shadow border overflow-hidden">
                                    <table className="w-full text-left">
                                        <thead className="bg-slate-50 border-b font-black text-[10px] uppercase text-gray-400">
                                            <tr><th className="p-4">Student</th><th>Class</th><th>Raw Score</th><th>Grade</th><th>Time</th><th>Action</th></tr>
                                        </thead>
                                        <tbody>
                                            {scores.map(s => (
                                                <tr key={s.id} className="border-b text-sm font-bold">
                                                    <td className="p-4">{s.studentName}<br/><span className="text-[10px] text-gray-400">{s.studentId}</span></td>
                                                    <td>{s.gradeLevel}</td>
                                                    <td>{s.correctAnswers} / {s.totalQuestions}</td>
                                                    <td><span className={`px-2 py-1 rounded text-xs ${s.score >= 50 ? 'bg-green-100 text-green-700':'bg-red-100 text-red-700'}`}>{s.score}%</span></td>
                                                    <td className="text-[10px] text-gray-400">{s.date?.toDate ? s.date.toDate().toLocaleString() : 'N/A'}</td>
                                                    <td><button onClick={async()=>await fb.deleteDoc(fb.doc(fb.db,"artifacts/my-project-a6208/scores",s.id))} className="text-red-500">Delete</button></td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        // --- STUDENT PAGE ---
        const StudentExamPage = () => {
            const { setPage } = React.useContext(AppContext);
            const [isLive, setIsLive] = React.useState(null);
            const [msId, setMsId] = React.useState('');
            const [student, setStudent] = React.useState(null);
            const [questions, setQuestions] = React.useState([]);
            const [index, setIndex] = React.useState(0);
            const [answers, setAnswers] = React.useState({});
            const [loading, setLoading] = React.useState(false);
            const [finished, setFinished] = React.useState(false);
            const [finalScore, setFinalScore] = React.useState(0);

            React.useEffect(() => {
                return fb.onSnapshot(fb.doc(fb.db, "artifacts/my-project-a6208/settings/examControl"), (doc) => setIsLive(doc.exists() ? doc.data().isLive : false));
            }, []);

            async function finishExam(isAuto = false) {
                if (!isAuto && !confirm("Submit answers?")) return;
                let correctCount = 0;
                questions.forEach((q, i) => { if (answers[i] === q.correctOptionIndex) correctCount++; });
                const pct = Math.round((correctCount / questions.length) * 100);
                setFinalScore(pct);
                try {
                    await fb.addDoc(fb.collection(fb.db, "artifacts/my-project-a6208/scores"), {
                        studentName: student.name, studentId: student.id, gradeLevel: student.gradeLevel,
                        score: pct, correctAnswers: correctCount, totalQuestions: questions.length, date: new Date()
                    });
                    setFinished(true);
                } catch (e) { alert(e.message); }
            }

            // Security: Auto-submit on tab switch
            React.useEffect(() => {
                const handleVisibility = () => { if (document.hidden && student && !finished) { alert("TAB SWITCH DETECTED: Auto-submitting..."); finishExam(true); }};
                document.addEventListener("visibilitychange", handleVisibility);
                return () => document.removeEventListener("visibilitychange", handleVisibility);
            }, [student, finished, questions, answers]);

            const verifyId = async () => {
                setLoading(true);
                const inputId = msId.toUpperCase().trim();
                try {
                    const { data } = await _supabase.from('students').select('*').eq('status', 'Enrolled');
                    const found = data?.find(s => ("MS-" + s.id.substring(0, 5).toUpperCase()) === inputId);
                    if (found) {
                        const scoreSnap = await fb.getDocs(fb.query(fb.collection(fb.db, "artifacts/my-project-a6208/scores"), fb.where("studentId", "==", inputId)));
                        if (!scoreSnap.empty) { alert("Already Submitted."); setLoading(false); return; }
                        
                        const sClass = found.grade_level;
                        setStudent({ name: found.full_name, id: inputId, gradeLevel: sClass });

                        const qSnap = await fb.getDocs(fb.query(fb.collection(fb.db, "artifacts/my-project-a6208/public/data/questions"), fb.where("gradeLevel", "==", sClass)));
                        if(qSnap.empty) alert(`No questions found for ${sClass}`);
                        else setQuestions(qSnap.docs.map(d => ({id: d.id, ...d.data()})));
                    } else alert("Invalid ID");
                } catch (e) { alert(e.message); }
                setLoading(false);
            };

            if (isLive === false) return <div className="flex flex-col items-center justify-center min-h-screen bg-slate-900 text-white"><h1>EXAM CLOSED</h1><button onClick={()=>setPage('home')}>Back</button></div>;
            if (finished) return <div className="flex flex-col items-center justify-center min-h-screen"><h1>Score: {finalScore}%</h1><button onClick={()=>setPage('home')}>Exit</button></div>;

            if (!student) return (
                <div className="flex items-center justify-center min-h-screen">
                    <div className="bg-white p-8 rounded-2xl shadow-xl w-80 border text-center">
                        <h2 className="text-xl font-black mb-6 uppercase">Student Login</h2>
                        <input className="w-full p-4 border rounded-xl mb-4 text-center font-bold uppercase" placeholder="MS-XXXXX" onChange={e => setMsId(e.target.value)} />
                        <button onClick={verifyId} className="w-full py-4 bg-blue-600 text-white rounded-xl font-bold">{loading ? "Verifying..." : "Start"}</button>
                    </div>
                </div>
            );

            if (questions.length === 0) return <div className="p-20 text-center font-black animate-pulse">Loading Questions...</div>;

            return (
                <div className="max-w-2xl mx-auto p-6 pt-12">
                    <div className="flex justify-between items-end mb-8 border-b pb-4">
                        <div><p className="text-[10px] text-gray-400 font-black uppercase">{student.gradeLevel}</p><h2 className="text-xl font-black">{student.name}</h2></div>
                        <div className="bg-blue-600 text-white px-4 py-1 rounded-full font-black">{index + 1} / {questions.length}</div>
                    </div>
                    <div className="bg-white p-8 rounded-2xl shadow-sm border">
                        <p className="text-xl font-bold mb-8">{questions[index].questionText}</p>
                        <div className="space-y-3">
                            {questions[index].options.map((opt, i) => (
                                <button key={i} onClick={() => setAnswers({...answers, [index]: i})} className={`w-full p-5 text-left rounded-xl border-2 transition ${answers[index] === i ? 'bg-blue-600 text-white border-blue-600' : 'bg-white border-gray-100 hover:border-blue-200'}`}>
                                    {optionLetters[i]}. {opt}
                                </button>
                            ))}
                        </div>
                        <div className="mt-10 flex justify-between">
                            <button onClick={() => setIndex(i => i - 1)} disabled={index === 0} className="text-gray-400 font-bold disabled:opacity-0 uppercase text-xs">Back</button>
                            {index === questions.length - 1 ? <button onClick={() => finishExam()} className="bg-green-600 text-white px-10 py-3 rounded-xl font-bold uppercase">Finish</button> : <button onClick={() => setIndex(i => i + 1)} className="bg-blue-600 text-white px-10 py-3 rounded-xl font-bold uppercase">Next</button>}
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [page, setPage] = React.useState('home');
            const [ready, setReady] = React.useState(false);
            React.useEffect(() => { const i = setInterval(() => { if(window.fb) { setReady(true); clearInterval(i); }}, 100); }, []);
            if (!ready) return <div className="p-20 text-center font-black">CONNECTING...</div>;

            return (
                <AppContext.Provider value={{ setPage }}>
                    {page === 'home' && (
                        <div className="flex flex-col items-center justify-center min-h-screen text-center">
                            <img src="https://sunnykeyz123.github.io/mustardseedschl/images/Logo.png" className="w-24 mb-6" />
                            <h1 className="text-5xl font-black mb-10 tracking-tighter">MUSTARD SEED CBT</h1>
                            <div className="space-x-4">
                                <button onClick={() => setPage('exam')} className="bg-blue-600 text-white px-12 py-4 rounded-full font-bold shadow-lg">TAKE EXAM</button>
                                <button onClick={() => setPage('admin')} className="bg-white text-gray-500 px-12 py-4 rounded-full font-bold border">ADMIN</button>
                            </div>
                        </div>
                    )}
                    {page === 'exam' && <StudentExamPage />}
                    {page === 'admin' && <AdminPage />}
                </AppContext.Provider>
            );
        };
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
