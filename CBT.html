            const [index, setIndex] = React.useState(0);
            const [answers, setAnswers] = React.useState({});
            const [timeLeft, setTimeLeft] = React.useState(0);
            const [loading, setLoading] = React.useState(false);
            const [finished, setFinished] = React.useState(false);
            const [hasCheckedQuestions, setHasCheckedQuestions] = React.useState(false);

            React.useEffect(() => {
                window.fb.onSnapshot(window.fb.doc(window.fb.db, "artifacts/my-project-a6208/settings/examControl"), (doc) => {
                    if (doc.exists()) {
                        const data = doc.data(); 
                        const activeControl = {
                            isLive: data.isLive,
                            duration: data.duration || 40,
                            globalObjMark: data.globalObjMark !== undefined ? data.globalObjMark : 2
                        };
                        setSettings(activeControl);
                        if (timeLeft === 0 && !student) setTimeLeft(activeControl.duration * 60);
                    }
                });
            }, []);

            React.useEffect(() => {
                if (student && timeLeft > 0 && !finished && questions.length > 0) {
                    const t = setInterval(() => setTimeLeft(prev => prev - 1), 1000);
                    return () => clearInterval(t);
                } else if (timeLeft === 0 && student && !finished && questions.length > 0) { submit(); }
            }, [timeLeft, student, finished, questions]);

            const verify = async () => {
                setLoading(true); const inputId = msId.toUpperCase().trim();
                setHasCheckedQuestions(false);
                try {
                    const { data } = await _supabase.from('students').select('*').eq('status', 'Enrolled');
                    const found = data?.find(s => ("MS-" + s.id.substring(0, 5).toUpperCase()) === inputId);
                    if (found) {
                        const scoreSnap = await window.fb.getDocs(window.fb.query(window.fb.collection(window.fb.db, "artifacts/my-project-a6208/scores"), window.fb.where("studentId", "==", inputId)));
                        if (!scoreSnap.empty) { alert("Already Submitted."); setLoading(false); return; }
                        const rawClass = found.grade_level || found.class || 'SSS 1';
                        
                        await window.fb.signInAnonymously(window.fb.auth);
                        
                        setStudent({ name: found.full_name, id: inputId, className: rawClass });
                        const snap = await window.fb.getDocs(window.fb.query(window.fb.collection(window.fb.db, "artifacts/my-project-a6208/public/data/questions"), window.fb.where("className", "==", rawClass)));
                        
                        const fetchedQuestions = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.type === 'theory' ? 1 : -1);
                        setQuestions(fetchedQuestions);
                        setHasCheckedQuestions(true);
                    } else alert("Invalid Student ID.");
                } catch (e) { alert("System Error."); }
                setLoading(false);
            };

            const submit = async () => {
                let obj = 0; let thy = 0; let theoryResponses = {};
                const currentMarkPerQuestion = settings.globalObjMark !== undefined ? settings.globalObjMark : 2;
                
                questions.forEach((quest, i) => {
                    const ans = answers[i]; if (ans === undefined || ans === null || ans === '') return;
                    if (quest.type === 'obj' || !quest.type) { 
                        if (ans === quest.correctOptionIndex) obj += currentMarkPerQuestion; 
                    } else { 
                        theoryResponses[quest.questionText] = ans; 
                        const hits = quest.keywords.filter(w => ans.toLowerCase().includes(w)).length; 
                        if (hits >= Math.ceil(quest.keywords.length * 0.5)) thy += (quest.points || 5); 
                    }
                });
                await window.fb.addDoc(window.fb.collection(window.fb.db, "artifacts/my-project-a6208/scores"), { studentName: student.name, studentId: student.id, className: student.className, objScore: obj, theoryScore: thy, totalScore: obj + thy, date: new Date(), theoryResponses });
                setFinished(true);
            };

            if (settings.isLive === false) return e('div', { className: 'h-screen flex items-center justify-center bg-slate-900 text-white font-black uppercase tracking-[0.5em]' }, 'Portal Offline/Exam has not Started!');
            
            if (finished) return e('div', { className: 'flex flex-col items-center justify-center min-h-screen bg-white p-6 text-center text-slate-900' },
                e('img', { src: 'https://sunnykeyz123.github.io/mustardseedschl/images/Logo.png', className: 'w-16 mb-8' }),
                e('h1', { className: 'text-3xl font-black uppercase tracking-tighter text-slate-800 mb-4' }, 'Congratulations 🎉'),
                e('p', { className: 'text-sm font-bold text-slate-500 mb-10 max-w-xs uppercase tracking-tight' }, 'Exam submitted successfully. Go to portal to check results.'),
                e('button', { onClick: () => window.location.reload(), className: 'bg-slate-900 text-white px-12 py-4 rounded-2xl font-black uppercase text-xs' }, 'Logout')
            );

            if (!student) return e('div', { className: 'flex items-center justify-center min-h-screen bg-slate-50 p-4 text-slate-900' },
                e('div', { className: 'bg-white p-10 rounded-[2.5rem] shadow-2xl w-full max-w-sm border text-center' },
                    e('img', { src: 'https://sunnykeyz123.github.io/mustardseedschl/images/Logo.png', className: 'w-20 mx-auto mb-8' }),
                    e('h2', { className: 'text-2xl font-black mb-8 uppercase tracking-tighter text-slate-900' }, 'Student Portal'),
                    e('input', { className: 'w-full p-5 border-2 rounded-2xl mb-4 uppercase text-center font-black bg-slate-50 text-blue-600 outline-none focus:border-blue-400', placeholder: 'MS-XXXXX', onChange: e => setMsId(e.target.value) }),
                    e('button', { onClick: verify, className: 'w-full py-5 bg-blue-600 text-white rounded-2xl font-black uppercase tracking-widest' }, loading ? "Wait..." : "Enter Exam")
                )
            );

            if (hasCheckedQuestions && questions.length === 0) {
                return e('div', { className: 'flex flex-col items-center justify-center min-h-screen bg-white p-6 text-center text-slate-900' },
                    e('div', { className: 'bg-red-50 border border-red-100 p-8 rounded-[2.5rem] max-w-sm w-full shadow-lg' },
                        e('span', { className: 'text-4xl block mb-4' }, '⚠️'),
                        e('h2', { className: 'text-xl font-black uppercase text-red-600 tracking-tight mb-2' }, 'No Questions Available'),
                        e('p', { className: 'text-xs font-bold text-slate-600 uppercase tracking-tight leading-relaxed mb-6' }, `There are no exam questions uploaded yet for ${student.className}.`),
                        e('p', { className: 'text-[10px] font-black text-slate-400 uppercase tracking-widest border-t pt-4' }, 'Please Contact Admin')
                    ),
                    e('button', { onClick: () => window.location.reload(), className: 'mt-8 text-blue-600 text-xs font-black uppercase tracking-wider border-b border-blue-600 pb-1' }, 'Go Back')
                );
            }

            const q = questions[index];
            const formatTime = (s) => `${Math.floor(s / 60)}:${(s % 60).toString().padStart(2, '0')}`;

            return e('div', { className: 'max-w-4xl mx-auto p-4 md:p-8 text-slate-900' },
                e('div', { className: 'flex justify-between items-center mb-6 bg-slate-900 text-white p-4 rounded-2xl shadow-lg' },
                    e('div', { className: 'flex items-center gap-3' },
                        e('span', { className: 'bg-blue-600 px-2 py-1 rounded text-[9px] font-black uppercase tracking-tighter' }, student.className),
                        e('h2', { className: 'text-xs font-black uppercase tracking-tight truncate max-w-[150px] md:max-w-none' }, student.name)
                    ),
                    e('div', { className: `flex items-center gap-2 px-3 py-1 rounded-full border border-white/20 font-black text-xs ${timeLeft < 300 ? 'bg-red-500 text-white animate-pulse' : 'bg-slate-800 text-blue-400'}` },
                        e('span', { className: 'text-[8px] uppercase tracking-tighter opacity-60' }, 'Timer:'),
                        e('span', null, formatTime(timeLeft))
                    )
                ),
                questions.length > 0 ? e('div', { className: 'bg-white p-6 md:p-10 rounded-[2rem] shadow-sm border border-slate-100 min-h-[500px] flex flex-col' },
                    e('div', { className: 'mb-8' },
                        e('p', { className: 'text-[9px] font-black text-blue-500 uppercase mb-2 tracking-[0.2em]' }, q.type === 'theory' ? 'Section B: Theory Writing' : 'Section A: Multiple Choice'),
                        e('p', { className: 'text-xl md:text-2xl font-black text-slate-800 leading-tight' }, q.questionText)
                    ),
                    e('div', { className: 'flex-grow' },
                        q.type === 'theory' ? e('textarea', { className: 'w-full p-6 border-2 rounded-2xl h-[300px] bg-slate-50 outline-none text-base font-medium focus:border-blue-400 transition', placeholder: 'Provide your detailed answer here...', value: answers[index] || '', onChange: evt => setAnswers({ ...answers, [index]: evt.target.value }) }) :
                        e('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-4' },
                            q.options.map((opt, i) => e('button', { key: i, onClick: () => setAnswers({ ...answers, [index]: i }), className: 'p-6 text-left rounded-2xl border-2 transition font-black text-sm uppercase text-slate-600 bg-white border-slate-100 hover:border-blue-200 data-[selected=true]:bg-blue-600 data-[selected=true]:text-white data-[selected=true]:border-blue-600 data-[selected=true]:shadow-xl', 'data-selected': answers[index] === i },
                                e('span', { className: 'mr-3 opacity-30' }, `${String.fromCharCode(65 + i)}.`), opt
                            ))
                        )
                    ),
                    e('div', { className: 'mt-10 flex justify-between items-center border-t pt-6' },
                        e('button', { onClick: () => setIndex(i => i - 1), disabled: index === 0, className: 'text-slate-300 font-black disabled:opacity-0 uppercase text-[10px]' }, 'Back'),
                        e('div', { className: 'text-[10px] font-black text-slate-400 uppercase tracking-widest' }, `${index + 1} / ${questions.length}`),
                        index === questions.length - 1 ? e('button', { onClick: () => confirm("Finish exam?") && submit(), className: 'bg-green-600 text-white px-10 py-4 rounded-2xl font-black uppercase text-[10px] shadow-lg' }, 'Submit Final') :
                        e('button', { onClick: () => setIndex(i => i + 1), className: 'bg-blue-600 text-white px-10 py-4 rounded-2xl font-black uppercase text-[10px] shadow-lg' }, 'Continue')
                    )
                ) : e('div', { className: 'text-center py-20 font-black text-slate-300 uppercase tracking-widest animate-pulse' }, 'Syncing Exam Layout...')
            );
        };

        const App = () => {
            const [page, setPage] = React.useState('home');
            return e(AppContext.Provider, { value: { setPage } },
                page === 'home' && e('div', { className: 'flex flex-col items-center justify-center min-h-screen text-center p-6 bg-slate-50 text-slate-900' },
                    e('img', { src: 'https://sunnykeyz123.github.io/mustardseedschl/images/Logo.png', className: 'w-28 mb-8' }),
                    e('h1', { className: 'text-5xl font-black mb-2 uppercase tracking-tighter text-slate-900' }, 'MUSTARD SEED'),
                    e('p', { className: 'text-slate-400 font-black text-[10px] tracking-[0.4em] uppercase mb-16' }, 'Advanced Computer Assessment Portal'),
                    e('div', { className: 'flex flex-col sm:flex-row gap-6' },
                        e('button', { onClick: () => setPage('exam'), className: 'bg-blue-600 text-white px-16 py-5 rounded-[2rem] font-black uppercase tracking-widest shadow-2xl shadow-blue-200' }, 'Start Exam'),
                        e('button', { onClick: () => setPage('admin'), className: 'bg-white text-slate-400 px-16 py-5 rounded-[2rem] font-black uppercase tracking-widest border' }, 'Admin')
                    )
                ),
                page === 'exam' && e(StudentExamPage),
                page === 'admin' && e(AdminPage)
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(e(App));
    </script>
</body>
</html>
