<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="https://sunnykeyz123.github.io/mustardseedschl/images/Logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mustard Seed CBT - Complete Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, onSnapshot, query, where, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDOO3uHmzOuAxJcdLxu-OImzlH12A6FpeY",
            authDomain: "my-project-a6208.firebaseapp.com",
            projectId: "my-project-a6208",
            storageBucket: "my-project-a6208.firebasestorage.app",
            messagingSenderId: "784486701962",
            appId: "1:784486701962:web:0d3cd002bbfd647e944673"
        };

        const app = initializeApp(firebaseConfig);
        window.fb = {
            db: getFirestore(app),
            auth: getAuth(app),
            collection, addDoc, getDocs, doc, deleteDoc, onSnapshot, query, where, signInAnonymously, onAuthStateChanged, setDoc, updateDoc
        };
    </script>

    <script type="text/babel">
        const { createClient } = window.supabase;
        const SB_URL = 'https://jqrcoqslmylmubxwfgyt.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxcmNvcXNsbXlsmXVieHdmZ3l0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ2ODc2NzgsImV4cCI6MjA4MDI2MzY3OH0.4bXOY35R3eGYZjPxtuJzvwifPEfHXr5UEdzFbB-caKU';
        const _supabase = createClient(SB_URL, SB_KEY);

        const AppContext = React.createContext(null);
        const ADMIN_PASSWORD = 'SUNNYKEYZ2025@';
        const CLASSES = ['SSS 1', 'SSS 2', 'SSS 3'];

        const AdminPage = () => {
            const [auth, setAuth] = React.useState(false);
            const [pass, setPass] = React.useState('');
            const [activeTab, setActiveTab] = React.useState('dashboard'); 
            const [scores, setScores] = React.useState([]);
            const [questions, setQuestions] = React.useState([]);
            const [examLive, setExamLive] = React.useState(false);
            const [newQ, setNewQ] = React.useState({ text: '', options: ['', '', '', ''], correct: 0, className: 'SSS 1', type: 'OBJ', keywords: '', pointsPerKey: 2 });

            React.useEffect(() => {
                if (!auth) return;
                fb.onSnapshot(fb.collection(fb.db, "artifacts/my-project-a6208/scores"), (s) => {
                    setScores(s.docs.map(d => ({id: d.id, ...d.data()})));
                });
                fb.onSnapshot(fb.collection(fb.db, "artifacts/my-project-a6208/public/data/questions"), (s) => {
                    setQuestions(s.docs.map(d => ({id: d.id, ...d.data()})));
                });
                fb.onSnapshot(fb.doc(fb.db, "artifacts/my-project-a6208/settings/examControl"), (doc) => {
                    if (doc.exists()) setExamLive(doc.data().isLive);
                });
            }, [auth]);

            const updateTheoryMark = async (sid, qidx, val) => {
                const docRef = fb.doc(fb.db, "artifacts/my-project-a6208/scores", sid);
                const current = scores.find(s => s.id === sid);
                const updatedMarks = { ...(current.theoryMarks || {}), [qidx]: Number(val) };
                const totalB = Object.values(updatedMarks).reduce((a, b) => a + b, 0);
                await fb.updateDoc(docRef, { theoryMarks: updatedMarks, theoryScore: totalB });
            };

            if (!auth) return (
                <div className="flex items-center justify-center min-h-screen bg-gray-100">
                    <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm text-center border">
                        <img src="https://sunnykeyz123.github.io/mustardseedschl/images/Logo.png" className="w-16 mx-auto mb-4" />
                        <h2 className="text-xl font-black mb-4 uppercase">Admin Login</h2>
                        <input type="password" placeholder="Password" className="w-full p-3 border rounded-lg mb-4 text-center" onChange={e => setPass(e.target.value)} />
                        <button onClick={() => pass === ADMIN_PASSWORD ? setAuth(true) : alert("Wrong Password")} className="w-full bg-blue-600 text-white py-3 rounded-lg font-bold">Access Panel</button>
                    </div>
                </div>
            );

            return (
                <div className="flex min-h-screen bg-gray-50">
                    <aside className="w-64 bg-slate-900 text-white p-6 fixed h-full">
                        <h1 className="text-xl font-black mb-10 text-blue-400">ADMIN PANEL</h1>
                        <nav className="space-y-2">
                            <button onClick={()=>setActiveTab('dashboard')} className={`w-full text-left p-3 rounded-lg font-bold text-xs ${activeTab==='dashboard'?'bg-blue-600':'text-gray-400'}`}>DASHBOARD</button>
                            <button onClick={()=>setActiveTab('questions')} className={`w-full text-left p-3 rounded-lg font-bold text-xs ${activeTab==='questions'?'bg-blue-600':'text-gray-400'}`}>QUESTIONS</button>
                            <button onClick={()=>setActiveTab('review')} className={`w-full text-left p-3 rounded-lg font-bold text-xs ${activeTab==='review'?'bg-blue-600':'text-gray-400'}`}>THEORY MARKING</button>
                            <button onClick={()=>setActiveTab('results')} className={`w-full text-left p-3 rounded-lg font-bold text-xs ${activeTab==='results'?'bg-blue-600':'text-gray-400'}`}>RESULTS</button>
                        </nav>
                    </aside>

                    <main className="ml-64 flex-1 p-10">
                        {activeTab === 'results' && (
                            <div className="bg-white rounded-xl shadow border overflow-hidden">
                                <table className="w-full text-left border-collapse">
                                    <thead className="bg-gray-100 text-[10px] font-black uppercase text-gray-500">
                                        <tr>
                                            <th className="p-4 border">Name</th>
                                            <th className="p-4 border">Class</th>
                                            <th className="p-4 border">Sec A</th>
                                            <th className="p-4 border">Sec B</th>
                                            <th className="p-4 border bg-blue-50">Total</th>
                                            <th className="p-4 border text-center">Action</th>
                                        </tr>
                                    </thead>
                                    <tbody className="text-xs">
                                        {scores.map(s=>(
                                            <tr key={s.id} className="border-b">
                                                <td className="p-4 font-bold uppercase">{s.studentName}</td>
                                                <td className="p-4">{s.className}</td>
                                                <td className="p-4">{s.correctAnswers * 2}</td>
                                                <td className="p-4 text-purple-600 font-bold">{s.theoryScore || 0}</td>
                                                <td className="p-4 font-black text-blue-700">{(s.correctAnswers * 2) + (s.theoryScore || 0)}</td>
                                                <td className="p-4 text-center">
                                                    <button onClick={async()=> {if(confirm("Delete?")) await fb.deleteDoc(fb.doc(fb.db,"artifacts/my-project-a6208/scores",s.id))}} className="text-red-500 font-black">DELETE</button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}

                        {activeTab === 'review' && (
                            <div className="space-y-4">
                                {scores.map(s => (
                                    <div key={s.id} className="bg-white p-4 rounded-xl border shadow-sm">
                                        <h3 className="font-black uppercase text-blue-600 border-b pb-2 mb-4">{s.studentName}</h3>
                                        {Object.entries(s.theoryAnswers || {}).map(([idx, ans]) => (
                                            <div key={idx} className="flex gap-4 mb-4 items-start">
                                                <div className="flex-1 bg-gray-50 p-3 rounded border">
                                                    <p className="text-[10px] font-bold text-gray-400 uppercase">Answer:</p>
                                                    <p className="text-sm italic">"{ans}"</p>
                                                </div>
                                                <div className="w-24 text-center">
                                                    <p className="text-[9px] font-bold mb-1">MARK</p>
                                                    <input type="number" className="w-full p-2 border rounded font-black text-center" value={s.theoryMarks?.[idx] ?? ''} onChange={(e)=>updateTheoryMark(s.id, idx, e.target.value)} />
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                ))}
                            </div>
                        )}

                        {activeTab === 'dashboard' && (
                            <div className="grid grid-cols-3 gap-6">
                                <div className="bg-white p-6 rounded-xl border">
                                    <p className="text-xs font-bold text-gray-400">EXAM LIVE</p>
                                    <h3 className={`text-2xl font-black ${examLive?'text-green-500':'text-red-500'}`}>{examLive?'YES':'NO'}</h3>
                                    <button onClick={async()=>await fb.setDoc(fb.doc(fb.db,"artifacts/my-project-a6208/settings/examControl"),{isLive:!examLive})} className="mt-4 bg-black text-white px-4 py-2 rounded text-[10px] font-bold">TOGGLE</button>
                                </div>
                                <div className="bg-white p-6 rounded-xl border"><p className="text-xs font-bold text-gray-400">QUESTIONS</p><h3 className="text-2xl font-black">{questions.length}</h3></div>
                                <div className="bg-white p-6 rounded-xl border"><p className="text-xs font-bold text-gray-400">SCRIPTS</p><h3 className="text-2xl font-black text-blue-600">{scores.length}</h3></div>
                            </div>
                        )}

                        {activeTab === 'questions' && (
                            <div className="grid grid-cols-2 gap-10">
                                <section className="bg-white p-6 rounded-xl border h-fit">
                                    <div className="flex gap-2 mb-4">
                                        <button onClick={()=>setNewQ({...newQ, type:'OBJ'})} className={`flex-1 py-2 rounded font-black text-[10px] ${newQ.type==='OBJ'?'bg-blue-600 text-white':'bg-gray-100'}`}>SECTION A</button>
                                        <button onClick={()=>setNewQ({...newQ, type:'THEORY'})} className={`flex-1 py-2 rounded font-black text-[10px] ${newQ.type==='THEORY'?'bg-purple-600 text-white':'bg-gray-100'}`}>SECTION B</button>
                                    </div>
                                    <textarea className="w-full p-3 border rounded mb-4 text-sm" placeholder="Question Text" value={newQ.text} onChange={e=>setNewQ({...newQ, text:e.target.value})} />
                                    {newQ.type === 'THEORY' ? (
                                        <div className="bg-purple-50 p-3 rounded mb-4">
                                            <input className="w-full p-2 border rounded mb-2 text-xs" placeholder="Keywords (e.g. data, science)" value={newQ.keywords} onChange={e=>setNewQ({...newQ, keywords: e.target.value})} />
                                            <input type="number" className="w-full p-2 border rounded text-xs" placeholder="Marks per keyword" value={newQ.pointsPerKey} onChange={e=>setNewQ({...newQ, pointsPerKey: e.target.value})} />
                                        </div>
                                    ) : (
                                        <div className="grid grid-cols-2 gap-2 mb-4">
                                            {newQ.options.map((o,i)=>(<input key={i} className="p-2 border rounded text-xs" placeholder={`Opt ${i+1}`} value={o} onChange={e=>{let c=[...newQ.options];c[i]=e.target.value;setNewQ({...newQ,options:c})}} />))}
                                            <select className="col-span-2 p-2 border rounded text-xs font-bold" value={newQ.correct} onChange={e=>setNewQ({...newQ,correct:e.target.value})}>
                                                {[0,1,2,3].map(i=><option key={i} value={i}>Correct: Option {i+1}</option>)}
                                            </select>
                                        </div>
                                    )}
                                    <select className="w-full p-2 border rounded mb-4 text-xs font-bold" value={newQ.className} onChange={e=>setNewQ({...newQ, className: e.target.value})}>
                                        {CLASSES.map(c => <option key={c} value={c}>{c}</option>)}
                                    </select>
                                    <button onClick={async()=>{
                                        await fb.addDoc(fb.collection(fb.db, "artifacts/my-project-a6208/public/data/questions"), {
                                            questionText: newQ.text, options: newQ.type==='OBJ'?newQ.options:[], 
                                            correctOptionIndex: newQ.type==='OBJ'?parseInt(newQ.correct):null, 
                                            className: newQ.className, type: newQ.type,
                                            keywords: newQ.keywords, pointsPerKey: Number(newQ.pointsPerKey)
                                        });
                                        setNewQ({ ...newQ, text: '', keywords: '' });
                                        alert("Saved!");
                                    }} className="w-full bg-blue-600 text-white py-3 rounded font-black text-xs">SAVE QUESTION</button>
                                </section>
                                <section className="space-y-2 max-h-[600px] overflow-y-auto">
                                    {questions.map((q)=>(
                                        <div key={q.id} className="bg-white p-3 rounded border flex justify-between items-center shadow-sm">
                                            <p className="text-[11px] font-bold"><span className="text-blue-500 mr-2">[{q.className}]</span> {q.questionText}</p>
                                            <button onClick={async()=>await fb.deleteDoc(fb.doc(fb.db,"artifacts/my-project-a6208/public/data/questions",q.id))} className="text-red-400 font-bold text-[10px]">DEL</button>
                                        </div>
                                    ))}
                                </section>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const StudentExamPage = () => {
            const { setPage } = React.useContext(AppContext);
            const [student, setStudent] = React.useState(null);
            const [questions, setQuestions] = React.useState([]);
            const [index, setIndex] = React.useState(0);
            const [answers, setAnswers] = React.useState({}); 
            const [theoryAnswers, setTheoryAnswers] = React.useState({}); 
            const [msId, setMsId] = React.useState('');
            const [loading, setLoading] = React.useState(false);
            const [finished, setFinished] = React.useState(false);

            const verifyId = async () => {
                setLoading(true);
                const inputId = msId.toUpperCase().trim();
                const { data } = await _supabase.from('students').select('*').eq('status', 'Enrolled');
                const found = data?.find(s => ("MS-" + s.id.substring(0, 5).toUpperCase()) === inputId);
                if (found) {
                    setStudent({ name: found.full_name, id: inputId, className: found.grade_level || 'SSS 1' });
                    const snap = await fb.getDocs(fb.query(fb.collection(fb.db, "artifacts/my-project-a6208/public/data/questions"), fb.where("className", "==", found.grade_level || 'SSS 1')));
                    setQuestions(snap.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => (a.type==='THEORY' ? 1 : -1)));
                } else alert("Invalid ID");
                setLoading(false);
            };

            async function finishExam() {
                if (!confirm("Submit?")) return;
                let objCorrect = 0, autoScore = 0, marksRecord = {};
                questions.forEach((q, i) => {
                    if (q.type === 'THEORY') {
                        let qm = 0; const ta = (theoryAnswers[i] || "").toLowerCase();
                        if (q.keywords) q.keywords.split(',').forEach(k => { if(ta.includes(k.trim().toLowerCase())) qm += q.pointsPerKey; });
                        autoScore += qm; marksRecord[i] = qm;
                    } else if (answers[i] === q.correctOptionIndex) objCorrect++;
                });
                await fb.addDoc(fb.collection(fb.db, "artifacts/my-project-a6208/scores"), {
                    studentName: student.name, studentId: student.id, className: student.className,
                    correctAnswers: objCorrect, theoryAnswers: theoryAnswers, theoryMarks: marksRecord,
                    theoryScore: autoScore, date: new Date()
                });
                setFinished(true);
            }

            if (finished) return <div className="text-center p-20 font-black">SUBMITTED SUCCESSFULLY! <button onClick={()=>setPage('home')} className="block mx-auto mt-4 underline">Back Home</button></div>;

            if (!student) return (
                <div className="flex items-center justify-center min-h-screen">
                    <div className="bg-white p-8 rounded-2xl shadow-xl border w-80 text-center">
                        <img src="https://sunnykeyz123.github.io/mustardseedschl/images/Logo.png" className="w-12 mx-auto mb-4" />
                        <h2 className="text-lg font-black mb-4">STUDENT LOGIN</h2>
                        <input className="w-full p-3 border rounded-xl mb-4 text-center font-bold uppercase" placeholder="MS-XXXXX" onChange={e => setMsId(e.target.value)} />
                        <button onClick={verifyId} className="w-full py-3 bg-blue-600 text-white rounded-xl font-black">{loading ? "WAIT..." : "START"}</button>
                    </div>
                </div>
            );

            const q = questions[index];
            if (!q) return null;

            return (
                <div className="max-w-xl mx-auto p-6 pt-10">
                    <div className="flex justify-between mb-8 border-b pb-4">
                        <span className="text-[10px] font-black uppercase">{student.name}</span>
                        <span className="text-[10px] font-black text-blue-500">{index + 1} / {questions.length}</span>
                    </div>
                    <div className="bg-white p-6 rounded-2xl shadow-sm border">
                        <p className="font-bold text-lg mb-6 leading-tight">{q.questionText}</p>
                        {q.type === 'THEORY' ? (
                            <textarea className="w-full p-4 border rounded-xl h-40 bg-gray-50 text-sm" placeholder="Type answer here..." value={theoryAnswers[index] || ''} onChange={e=>setTheoryAnswers({...theoryAnswers, [index]: e.target.value})} />
                        ) : (
                            <div className="space-y-2">
                                {q.options.map((opt, i) => (
                                    <button key={i} onClick={() => setAnswers({...answers, [index]: i})} className={`w-full p-4 text-left rounded-xl border text-sm font-bold ${answers[index] === i ? 'bg-blue-600 text-white border-blue-600' : 'bg-white hover:bg-gray-50'}`}>
                                        {opt}
                                    </button>
                                ))}
                            </div>
                        )}
                        <div className="flex justify-between mt-10">
                            <button onClick={()=>setIndex(i=>i-1)} disabled={index===0} className="text-gray-400 font-bold text-xs disabled:opacity-0">BACK</button>
                            {index === questions.length - 1 ? 
                                <button onClick={finishExam} className="bg-green-600 text-white px-8 py-3 rounded-xl font-bold text-xs">SUBMIT</button> :
                                <button onClick={()=>setIndex(i=>i+1)} className="bg-blue-600 text-white px-8 py-3 rounded-xl font-bold text-xs">NEXT</button>
                            }
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [page, setPage] = React.useState('home');
            const [ready, setReady] = React.useState(false);
            React.useEffect(() => { const i = setInterval(() => { if(window.fb) { setReady(true); clearInterval(i); }}, 100); }, []);
            if (!ready) return <div className="p-20 text-center font-black">LOADING...</div>;

            return (
                <AppContext.Provider value={{ setPage }}>
                    {page === 'home' ? (
                        <div className="flex flex-col items-center justify-center min-h-screen text-center">
                            <img src="https://sunnykeyz123.github.io/mustardseedschl/images/Logo.png" className="w-20 mb-6" />
                            <h1 className="text-4xl font-black mb-1">Mustard Seed CBT</h1>
                            <p className="text-gray-400 font-bold text-[10px] tracking-widest uppercase mb-10">Academic Excellence</p>
                            <div className="flex gap-4">
                                <button onClick={()=>setPage('exam')} className="bg-blue-600 text-white px-12 py-4 rounded-full font-black shadow-lg">STUDENT</button>
                                <button onClick={()=>setPage('admin')} className="bg-white text-gray-500 px-12 py-4 rounded-full font-bold border">ADMIN</button>
                            </div>
                        </div>
                    ) : (page === 'exam' ? <StudentExamPage /> : <AdminPage />)}
                </AppContext.Provider>
            );
        };
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
