<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="https://sunnykeyz123.github.io/mustardseedschl/images/Logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mustard Seed CBT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, onSnapshot, query, where } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDOO3uHmzOuAxJcdLxu-OImzlH12A6FpeY",
            authDomain: "my-project-a6208.firebaseapp.com",
            projectId: "my-project-a6208",
            storageBucket: "my-project-a6208.firebasestorage.app",
            messagingSenderId: "784486701962",
            appId: "1:784486701962:web:0d3cd002bbfd647e944673"
        };

        const app = initializeApp(firebaseConfig);
        window.fb = {
            db: getFirestore(app),
            auth: getAuth(app),
            collection, addDoc, getDocs, doc, deleteDoc, onSnapshot, query, where, signInAnonymously, onAuthStateChanged
        };
    </script>

    <script type="text/babel">
        const { createClient } = window.supabase;
        const SB_URL = 'https://jqrcoqslmylmubxwfgyt.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxcmNvcXNsbXlsbXVieHdmZ3l0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ2ODc2NzgsImV4cCI6MjA4MDI2MzY3OH0.4bXOY35R3eGYZjPxtuJzvwifPEfHXr5UEdzFbB-caKU';
        const _supabase = createClient(SB_URL, SB_KEY);

        const AppContext = React.createContext(null);
        const ADMIN_PASSWORD = 'SUNNYKEYZ2025@';
        const optionLetters = ['A', 'B', 'C', 'D'];

        // --- ADMIN PAGE ---
        const AdminPage = () => {
            const { setPage } = React.useContext(AppContext);
            const [auth, setAuth] = React.useState(false);
            const [pass, setPass] = React.useState('');
            const [scores, setScores] = React.useState([]);
            const [questions, setQuestions] = React.useState([]);
            const [newQ, setNewQ] = React.useState({ text: '', options: ['', '', '', ''], correct: 0 });

            React.useEffect(() => {
                if (!auth) return;
                const qScores = fb.query(fb.collection(fb.db, "scores"));
                const qQuest = fb.query(fb.collection(fb.db, "artifacts/my-project-a6208/public/data/questions"));
                
                const unsub1 = fb.onSnapshot(qScores, (s) => setScores(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsub2 = fb.onSnapshot(qQuest, (s) => setQuestions(s.docs.map(d => ({id: d.id, ...d.data()}))));
                return () => { unsub1(); unsub2(); };
            }, [auth]);

            const addQuestion = async () => {
                await fb.addDoc(fb.collection(fb.db, "questions"), {
                    questionText: newQ.text,
                    options: newQ.options,
                    correctOptionIndex: parseInt(newQ.correct)
                });
                setNewQ({ text: '', options: ['', '', '', ''], correct: 0 });
                alert("Question Added!");
            };

            const deleteQuestion = async (id) => {
                await fb.deleteDoc(fb.doc(fb.db, "questions", id));
            };

            if (!auth) return (
                <div className="flex flex-col items-center justify-center min-h-screen">
                    <div className="bg-white p-8 rounded-xl shadow-lg border">
                        <h2 className="text-xl font-bold mb-4">Admin Access</h2>
                        <input type="password" placeholder="Password" className="w-full p-3 border rounded mb-4" onChange={e => setPass(e.target.value)} />
                        <button onClick={() => pass === ADMIN_PASSWORD ? setAuth(true) : alert("Wrong")} className="w-full bg-black text-white py-3 rounded">Login</button>
                    </div>
                </div>
            );

            return (
                <div className="p-8 max-w-4xl mx-auto space-y-12">
                    <button onClick={() => setPage('home')} className="text-blue-600 font-bold">← Back Home</button>
                    
                    <section className="bg-white p-6 rounded-xl shadow border">
                        <h2 className="text-xl font-bold mb-4">Add Question</h2>
                        <textarea className="w-full p-3 border rounded mb-4" placeholder="Question Text" value={newQ.text} onChange={e => setNewQ({...newQ, text: e.target.value})} />
                        <div className="grid grid-cols-2 gap-4 mb-4">
                            {newQ.options.map((o, i) => (
                                <input key={i} className="p-2 border rounded" placeholder={`Option ${optionLetters[i]}`} value={o} 
                                onChange={e => { let n = [...newQ.options]; n[i] = e.target.value; setNewQ({...newQ, options: n}) }} />
                            ))}
                        </div>
                        <select className="w-full p-3 border rounded mb-4" onChange={e => setNewQ({...newQ, correct: e.target.value})}>
                            {optionLetters.map((l, i) => <option key={i} value={i}>Correct: {l}</option>)}
                        </select>
                        <button onClick={addQuestion} className="w-full bg-green-600 text-white py-3 rounded font-bold">Save Question</button>
                    </section>

                    <section className="bg-white p-6 rounded-xl shadow border">
                        <h2 className="text-xl font-bold mb-4">Recent Scores</h2>
                        <table className="w-full text-left">
                            <tr className="border-b text-gray-400"><th>Student</th><th>ID</th><th>Score</th></tr>
                            {scores.map(s => (
                                <tr key={s.id} className="border-b"><td className="py-2">{s.studentName}</td><td>{s.studentId}</td><td className="font-bold text-green-600">{s.score}%</td></tr>
                            ))}
                        </table>
                    </section>
                </div>
            );
        };

        // --- STUDENT EXAM PAGE ---
        const StudentExamPage = () => {
            const { setPage } = React.useContext(AppContext);
            const [msId, setMsId] = React.useState('');
            const [student, setStudent] = React.useState(null);
            const [questions, setQuestions] = React.useState([]);
            const [index, setIndex] = React.useState(0);
            const [answers, setAnswers] = React.useState({});
            const [loading, setLoading] = React.useState(false);
            const [finished, setFinished] = React.useState(false);
            const [finalScore, setFinalScore] = React.useState(0);

            const verifyId = async () => {
                setLoading(true);
                const inputId = msId.toUpperCase().trim();
                const { data, error } = await _supabase.from('students').select('*').eq('status', 'Enrolled');
                
                const found = data?.find(s => ("MS-" + s.id.substring(0, 5).toUpperCase()) === inputId);
                if (found) {
                    setStudent({ name: found.full_name, id: inputId });
                    const snap = await fb.getDocs(fb.collection(fb.db, "artifacts/my-project-a6208/public/data/questions"));
                    setQuestions(snap.docs.map(d => ({id: d.id, ...d.data()})));
                } else { alert("ID Not Found"); }
                setLoading(false);
            };

            const finishExam = async () => {
                let correct = 0;
                questions.forEach((q, i) => { if(answers[i] === q.correctOptionIndex) correct++; });
                const pct = Math.round((correct / questions.length) * 100);
                await fb.addDoc(artifacts/my-project-a6208/public/data/questions"), {
                    studentName: student.name, studentId: student.id, score: pct, date: new Date()
                });
                setFinalScore(pct);
                setFinished(true);
            };

            if (finished) return (
                <div className="flex flex-col items-center justify-center min-h-screen">
                    <h1 className="text-6xl font-black text-blue-600">{finalScore}%</h1>
                    <p className="text-xl mt-4">Great work, {student.name}!</p>
                    <button onClick={() => setPage('home')} className="mt-8 bg-black text-white px-10 py-3 rounded-full">Exit</button>
                </div>
            );

            if (!student) return (
                <div className="flex items-center justify-center min-h-screen">
                    <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm border">
                        <h2 className="text-2xl font-bold mb-6">Student Login</h2>
                        <input className="w-full p-4 border rounded-xl mb-4 uppercase" placeholder="MS-XXXXX" onChange={e => setMsId(e.target.value)} />
                        <button onClick={verifyId} className="w-full py-4 bg-blue-600 text-white rounded-xl font-bold">{loading ? "Wait..." : "Start Exam"}</button>
                        <button onClick={() => setPage('home')} className="w-full mt-4 text-gray-400">Cancel</button>
                    </div>
                </div>
            );

            if (questions.length === 0) return <div className="p-20 text-center font-bold">Getting Questions Ready...</div>;

            return (
                <div className="max-w-2xl mx-auto p-6 pt-12">
                    <div className="flex justify-between mb-8 font-bold text-blue-600">
                        <span>{student.name}</span>
                        <span>{index + 1} / {questions.length}</span>
                    </div>
                    <div className="bg-white p-8 rounded-2xl shadow-sm border">
                        <p className="text-xl font-bold mb-8">{questions[index].questionText}</p>
                        <div className="space-y-3">
                            {questions[index].options.map((opt, i) => (
                                <button key={i} onClick={() => setAnswers({...answers, [index]: i})} 
                                className={`w-full p-5 text-left rounded-xl border-2 transition ${answers[index] === i ? 'bg-blue-600 text-white border-blue-600' : 'bg-white border-gray-100'}`}>
                                    {optionLetters[i]}. {opt}
                                </button>
                            ))}
                        </div>
                        <div className="mt-10 flex justify-between">
                            <button onClick={() => setIndex(i => i - 1)} disabled={index === 0}>Back</button>
                            {index === questions.length - 1 ? 
                                <button onClick={finishExam} className="bg-green-600 text-white px-10 py-3 rounded-xl font-bold">Finish</button> :
                                <button onClick={() => setIndex(i => i + 1)} className="bg-blue-600 text-white px-10 py-3 rounded-xl font-bold">Next</button>
                            }
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [page, setPage] = React.useState('home');
            const [ready, setReady] = React.useState(false);

            React.useEffect(() => {
                const i = setInterval(() => { if(window.fb) { setReady(true); clearInterval(i); }}, 100);
            }, []);

            if (!ready) return <div className="p-20 text-center">Connecting to Server...</div>;

            return (
                <AppContext.Provider value={{ setPage }}>
                    {page === 'home' && (
                        <div className="flex flex-col items-center justify-center min-h-screen text-center">
                            <h1 className="text-5xl font-black mb-10 tracking-tighter">MUSTARD SEED CBT</h1>
                            <div className="space-x-4">
                                <button onClick={() => setPage('exam')} className="bg-blue-600 text-white px-12 py-4 rounded-full font-bold shadow-lg">Login to Exam</button>
                                <button onClick={() => setPage('admin')} className="bg-white text-gray-500 px-12 py-4 rounded-full font-bold border">Admin Panel</button>
                            </div>
                        </div>
                    )}
                    {page === 'exam' && <StudentExamPage />}
                    {page === 'admin' && <AdminPage />}
                </AppContext.Provider>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
