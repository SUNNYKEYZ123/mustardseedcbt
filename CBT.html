<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="https://sunnykeyz123.github.io/mustardseedschl/images/Logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mustard Seed CBT - Unified Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .custom-modal-overlay { background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); }
        .sidebar-active { background: #2563eb; color: white; box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.4); }
    </style>
</head>
<body class="bg-gray-50 text-slate-900">
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, onSnapshot, query, where, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDOO3uHmzOuAxJcdLxu-OImzlH12A6FpeY",
            authDomain: "my-project-a6208.firebaseapp.com",
            projectId: "my-project-a6208",
            storageBucket: "my-project-a6208.firebasestorage.app",
            messagingSenderId: "784486701962",
            appId: "1:784486701962:web:0d3cd002bbfd647e944673"
        };

        const app = initializeApp(firebaseConfig);
        window.fb = {
            db: getFirestore(app),
            auth: getAuth(app),
            collection, addDoc, getDocs, doc, deleteDoc, onSnapshot, query, where, signInAnonymously, setDoc
        };
    </script>

    <script type="text/babel">
        const { createClient } = window.supabase;
        const SB_URL = 'https://jqrcoqslmylmubxwfgyt.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxcmNvcXNsbXlsbXVieHdmZ3l0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ2ODc2NzgsImV4cCI6MjA4MDI2MzY3OH0.4bXOY35R3eGYZjPxtuJzvwifPEfHXr5UEdzFbB-caKU';
        const _supabase = createClient(SB_URL, SB_KEY);

        const AppContext = React.createContext(null);
        const ADMIN_PASS = 'SUNNYKEYZ2025@';
        const CLASSES = ['JSS 1', 'JSS 2', 'JSS 3', 'SSS 1', 'SSS 2', 'SSS 3'];
        const LETTERS = ['A', 'B', 'C', 'D'];

        const Modal = ({ title, message, onConfirm, onCancel, confirmText = "OK" }) => (
            <div className="fixed inset-0 z-[100] flex items-center justify-center custom-modal-overlay p-4">
                <div className="bg-white rounded-[32px] p-8 max-w-sm w-full shadow-2xl text-center border">
                    <h3 className="text-xl font-black mb-2 uppercase tracking-tight">{title}</h3>
                    <p className="text-gray-500 font-medium mb-6 leading-relaxed">{message}</p>
                    <div className="flex gap-3">
                        {onCancel && <button onClick={onCancel} className="flex-1 py-4 font-bold border rounded-2xl hover:bg-gray-50 transition">Cancel</button>}
                        <button onClick={onConfirm} className="flex-1 py-4 font-bold bg-blue-600 text-white rounded-2xl hover:bg-blue-700 shadow-lg shadow-blue-200">{confirmText}</button>
                    </div>
                </div>
            </div>
        );

        const AdminPanel = () => {
            const { setPage } = React.useContext(AppContext);
            const [tab, setTab] = React.useState('dash');
            const [auth, setAuth] = React.useState(false);
            const [passInput, setPassInput] = React.useState('');
            const [scores, setScores] = React.useState([]);
            const [questions, setQuestions] = React.useState([]);
            const [isLive, setIsLive] = React.useState(false);
            const [filter, setFilter] = React.useState('ALL');
            const [modal, setModal] = React.useState(null);
            
            // New Question State
            const [qData, setQData] = React.useState({ text: '', options: ['', '', '', ''], correct: 0, class: 'SSS 1' });

            React.useEffect(() => {
                if (!auth) return;
                const u1 = fb.onSnapshot(fb.collection(fb.db, "artifacts/my-project-a6208/scores"), s => setScores(s.docs.map(d => ({id:d.id, ...d.data()}))));
                const u2 = fb.onSnapshot(fb.collection(fb.db, "artifacts/my-project-a6208/public/data/questions"), s => setQuestions(s.docs.map(d => ({id:d.id, ...d.data()}))));
                const u3 = fb.onSnapshot(fb.doc(fb.db, "artifacts/my-project-a6208/settings/examControl"), d => setIsLive(d.exists() ? d.data().isLive : false));
                return () => { u1(); u2(); u3(); };
            }, [auth]);

            const saveQuestion = async () => {
                if(!qData.text) return;
                await fb.addDoc(fb.collection(fb.db, "artifacts/my-project-a6208/public/data/questions"), {
                    questionText: qData.text, options: qData.options, correctOptionIndex: parseInt(qData.correct), grade_level: qData.class
                });
                setQData({ ...qData, text: '', options: ['', '', '', ''] });
                setModal({ title: "Success", message: "Question added to bank.", onConfirm: () => setModal(null) });
            };

            if (!auth) return (
                <div className="min-h-screen flex items-center justify-center bg-gray-100 p-6">
                    <div className="bg-white p-10 rounded-[40px] shadow-xl w-full max-w-sm text-center border">
                        <img src="https://sunnykeyz123.github.io/mustardseedschl/images/Logo.png" className="w-16 mx-auto mb-6" />
                        <h2 className="text-2xl font-black mb-6 uppercase tracking-tighter">Admin Access</h2>
                        <input type="password" placeholder="Password" className="w-full p-5 border-2 rounded-2xl mb-4 text-center focus:border-blue-500 outline-none" onChange={e => setPassInput(e.target.value)} />
                        <button onClick={() => passInput === ADMIN_PASS ? setAuth(true) : alert("Wrong!")} className="w-full bg-slate-900 text-white py-5 rounded-2xl font-black">LOGIN</button>
                    </div>
                </div>
            );

            return (
                <div className="flex min-h-screen">
                    {modal && <Modal {...modal} />}
                    <aside className="w-72 bg-slate-900 text-white p-8 fixed h-full flex flex-col">
                        <div className="flex items-center gap-4 mb-12">
                            <img src="https://sunnykeyz123.github.io/mustardseedschl/images/Logo.png" className="w-10" />
                            <span className="font-black text-xl tracking-tighter">PORTAL</span>
                        </div>
                        <nav className="space-y-3 flex-1">
                            {[['dash', '📊 Dashboard'], ['bank', '📝 Question Bank'], ['results', '🏆 Exam Results']].map(([id, label]) => (
                                <button key={id} onClick={() => setTab(id)} className={`w-full text-left p-5 rounded-2xl font-bold transition-all ${tab === id ? 'sidebar-active' : 'text-slate-400 hover:text-white'}`}>{label}</button>
                            ))}
                        </nav>
                        <button onClick={() => setPage('home')} className="p-5 text-slate-500 font-bold hover:text-white text-sm uppercase">← Exit Portal</button>
                    </aside>

                    <main className="flex-1 ml-72 p-16">
                        {tab === 'dash' && (
                            <div className="max-w-4xl">
                                <h1 className="text-4xl font-black mb-10 tracking-tight">Overview</h1>
                                <div className="grid grid-cols-3 gap-8 mb-12">
                                    <div className="bg-white p-8 rounded-[32px] border shadow-sm">
                                        <p className="text-xs font-black text-slate-400 uppercase mb-2">Exam Status</p>
                                        <h2 className={`text-2xl font-black mb-6 ${isLive ? 'text-green-500' : 'text-red-500'}`}>{isLive ? 'LIVE' : 'OFFLINE'}</h2>
                                        <button onClick={() => fb.setDoc(fb.doc(fb.db, "artifacts/my-project-a6208/settings/examControl"), { isLive: !isLive })} className="w-full py-3 bg-slate-900 text-white rounded-xl font-bold text-xs">TOGGLE STATUS</button>
                                    </div>
                                    <div className="bg-white p-8 rounded-[32px] border shadow-sm">
                                        <p className="text-xs font-black text-slate-400 uppercase mb-2">Total Questions</p>
                                        <h2 className="text-4xl font-black">{questions.length}</h2>
                                    </div>
                                    <div className="bg-white p-8 rounded-[32px] border shadow-sm">
                                        <p className="text-xs font-black text-slate-400 uppercase mb-2">Submissions</p>
                                        <h2 className="text-4xl font-black text-blue-600">{scores.length}</h2>
                                    </div>
                                </div>
                            </div>
                        )}

                        {tab === 'bank' && (
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-12">
                                <div className="bg-white p-8 rounded-[32px] border shadow-sm h-fit sticky top-8">
                                    <h2 className="text-xl font-black mb-6">Create Question</h2>
                                    <textarea className="w-full p-5 border-2 rounded-2xl mb-4 h-32 outline-none focus:border-blue-500" placeholder="Question Text..." value={qData.text} onChange={e => setQData({...qData, text: e.target.value})} />
                                    <div className="grid grid-cols-2 gap-4 mb-6">
                                        {qData.options.map((o, i) => (
                                            <input key={i} className="p-4 border-2 rounded-xl" placeholder={`Option ${LETTERS[i]}`} value={o} onChange={e => { let n = [...qData.options]; n[i] = e.target.value; setQData({...qData, options: n}) }} />
                                        ))}
                                    </div>
                                    <div className="grid grid-cols-2 gap-4 mb-8">
                                        <select className="p-4 border-2 rounded-xl font-bold" value={qData.correct} onChange={e => setQData({...qData, correct: e.target.value})}>
                                            {LETTERS.map((l, i) => <option key={i} value={i}>Correct: {l}</option>)}
                                        </select>
                                        <select className="p-4 border-2 rounded-xl font-bold text-blue-600" value={qData.class} onChange={e => setQData({...qData, class: e.target.value})}>
                                            {CLASSES.map(c => <option key={c} value={c}>{c}</option>)}
                                        </select>
                                    </div>
                                    <button onClick={saveQuestion} className="w-full bg-blue-600 text-white py-5 rounded-2xl font-black shadow-lg shadow-blue-100">SAVE TO BANK</button>
                                </div>
                                <div className="space-y-4">
                                    <h2 className="text-xl font-black mb-6 flex justify-between items-center">Question Bank <span className="text-xs bg-slate-100 px-3 py-1 rounded-full">{questions.length} total</span></h2>
                                    {questions.map(q => (
                                        <div key={q.id} className="bg-white p-6 rounded-2xl border flex justify-between items-center group">
                                            <div className="text-sm font-bold">
                                                <span className="bg-blue-50 text-blue-600 text-[10px] px-2 py-1 rounded-md mr-3 uppercase">{q.grade_level}</span>
                                                {q.questionText}
                                            </div>
                                            <button onClick={() => fb.deleteDoc(fb.doc(fb.db, "artifacts/my-project-a6208/public/data/questions", q.id))} className="text-red-400 opacity-0 group-hover:opacity-100 transition font-bold text-xs">Delete</button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {tab === 'results' && (
                            <div className="bg-white rounded-[32px] border shadow-sm overflow-hidden">
                                <div className="p-8 border-b flex justify-between items-center bg-slate-50">
                                    <h2 className="text-xl font-black uppercase tracking-tight">Recent Submissions</h2>
                                    <select className="p-3 border rounded-xl font-bold text-xs" onChange={e => setFilter(e.target.value)}>
                                        <option value="ALL">ALL CLASSES</option>
                                        {CLASSES.map(c => <option key={c} value={c}>{c}</option>)}
                                    </select>
                                </div>
                                <table className="w-full text-left">
                                    <thead className="text-[10px] font-black text-slate-400 uppercase tracking-widest bg-white border-b">
                                        <tr><th className="p-6">Student</th><th className="p-6">Class</th><th className="p-6">Result</th><th className="p-6 text-right">Time</th></tr>
                                    </thead>
                                    <tbody className="divide-y">
                                        {scores.filter(s => filter === 'ALL' || s.grade_level === filter).map(s => (
                                            <tr key={s.id} className="font-bold text-sm hover:bg-slate-50 transition">
                                                <td className="p-6">{s.studentName}<br/><span className="text-[10px] text-slate-400 font-mono">{s.studentId}</span></td>
                                                <td className="p-6 text-xs uppercase">{s.grade_level}</td>
                                                <td className="p-6"><span className={`px-3 py-1 rounded-full text-[10px] ${s.score >= 50 ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>{s.score}%</span></td>
                                                <td className="p-6 text-right text-xs text-slate-400">{s.date?.toDate ? s.date.toDate().toLocaleTimeString() : '---'}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const StudentExam = () => {
            const { setPage } = React.useContext(AppContext);
            const [isLive, setIsLive] = React.useState(null);
            const [inputId, setInputId] = React.useState('');
            const [student, setStudent] = React.useState(null);
            const [questions, setQuestions] = React.useState([]);
            const [index, setIndex] = React.useState(0);
            const [answers, setAnswers] = React.useState({});
            const [loading, setLoading] = React.useState(false);
            const [done, setDone] = React.useState(false);
            const [score, setScore] = React.useState(0);
            const [modal, setModal] = React.useState(null);

            React.useEffect(() => {
                return fb.onSnapshot(fb.doc(fb.db, "artifacts/my-project-a6208/settings/examControl"), d => setIsLive(d.exists() ? d.data().isLive : false));
            }, []);

            const login = async () => {
                setLoading(true);
                const cleanId = inputId.toUpperCase().trim();
                try {
                    // Logic from working version: Compare input with MS- + first 5 chars of Supabase ID
                    const { data } = await _supabase.from('students').select('*').eq('status', 'Enrolled');
                    const found = data?.find(s => ("MS-" + s.id.substring(0, 5).toUpperCase()) === cleanId);

                    if (found) {
                        const sSnap = await fb.getDocs(fb.query(fb.collection(fb.db, "artifacts/my-project-a6208/scores"), fb.where("studentId", "==", cleanId)));
                        if (!sSnap.empty) { 
                            setModal({ title: "Already Taken", message: "Your submission for this exam was already recorded.", onConfirm: () => setModal(null) });
                            setLoading(false); return;
                        }

                        // Set Student with their EXACT grade_level from Supabase
                        setStudent({ name: found.full_name, id: cleanId, grade_level: found.grade_level });

                        // Fetch Questions filtered by that specific grade_level
                        const qSnap = await fb.getDocs(fb.collection(fb.db, "artifacts/my-project-a6208/public/data/questions"));
                        const filtered = qSnap.docs
                            .map(d => ({id: d.id, ...d.data()}))
                            .filter(q => q.grade_level === found.grade_level);

                        if(filtered.length === 0) {
                            setModal({ title: "No Questions", message: `The exam for ${found.grade_level} has not been set up yet.`, onConfirm: () => setModal(null) });
                        } else {
                            setQuestions(filtered.sort(() => Math.random() - 0.5));
                        }
                    } else {
                        setModal({ title: "Invalid ID", message: "Check your Student ID and try again.", onConfirm: () => setModal(null) });
                    }
                } catch (e) { alert(e.message); }
                setLoading(false);
            };

            const finish = async () => {
                let corrects = 0;
                questions.forEach((q, i) => { if(answers[i] === q.correctOptionIndex) corrects++; });
                const pct = Math.round((corrects / questions.length) * 100);
                setScore(pct);
                await fb.addDoc(fb.collection(fb.db, "artifacts/my-project-a6208/scores"), {
                    studentName: student.name, studentId: student.id, grade_level: student.grade_level,
                    score: pct, correctAnswers: corrects, totalQuestions: questions.length, date: new Date()
                });
                setDone(true);
                setModal(null);
            };

            if (done) return (
                <div className="min-h-screen flex items-center justify-center p-6 bg-slate-50">
                    <div className="bg-white p-12 rounded-[48px] shadow-2xl text-center border w-full max-w-sm">
                        <img src="https://sunnykeyz123.github.io/mustardseedschl/images/Logo.png" className="w-20 mx-auto mb-10" />
                        <h2 className="text-4xl font-black mb-4 tracking-tighter uppercase">COMPLETED!</h2>
                        <div className="bg-blue-600 text-white p-10 rounded-3xl mb-10 shadow-xl shadow-blue-100">
                            <p className="text-xs font-bold uppercase tracking-widest opacity-70 mb-2">Final Score</p>
                            <h3 className="text-6xl font-black">{score}%</h3>
                        </div>
                        <button onClick={() => setPage('home')} className="w-full py-5 bg-slate-900 text-white rounded-2xl font-black uppercase">LOGOUT</button>
                    </div>
                </div>
            );

            if (!student) return (
                <div className="min-h-screen flex flex-col items-center justify-center p-6 bg-white">
                    {modal && <Modal {...modal} />}
                    <img src="https://sunnykeyz123.github.io/mustardseedschl/images/Logo.png" className="w-24 mb-12 animate-bounce" />
                    <div className="bg-slate-50 p-10 rounded-[40px] w-full max-w-sm border-2 text-center">
                        <h2 className="text-3xl font-black mb-8 tracking-tighter uppercase">EXAM LOGIN</h2>
                        <input className="w-full p-6 border-4 border-white rounded-3xl mb-6 text-center font-black uppercase text-2xl shadow-inner focus:border-blue-500 outline-none transition-all" placeholder="MS-XXXXX" onChange={e => setInputId(e.target.value)} />
                        <button onClick={login} className="w-full py-6 bg-blue-600 text-white rounded-3xl font-black text-xl shadow-xl shadow-blue-200 hover:scale-[1.02] active:scale-95 transition-all">{loading ? '...' : 'START EXAM'}</button>
                    </div>
                </div>
            );

            return (
                <div className="max-w-4xl mx-auto p-8 pt-16">
                    {modal && <Modal {...modal} />}
                    <div className="flex justify-between items-end mb-12">
                        <div>
                            <p className="text-xs font-black text-blue-600 uppercase tracking-widest mb-1">{student.grade_level}</p>
                            <h1 className="text-3xl font-black uppercase tracking-tight">{student.name}</h1>
                        </div>
                        <div className="bg-slate-900 text-white px-8 py-3 rounded-2xl font-black text-sm uppercase">Quest {index + 1} of {questions.length}</div>
                    </div>
                    <div className="bg-white p-12 rounded-[48px] shadow-sm border-2">
                        <p className="text-3xl font-bold mb-12 leading-[1.3] text-slate-800">{questions[index].questionText}</p>
                        <div className="grid grid-cols-1 gap-5">
                            {questions[index].options.map((opt, i) => (
                                <button key={i} onClick={() => setAnswers({...answers, [index]: i})} className={`w-full p-8 text-left rounded-[24px] border-4 transition-all font-bold text-lg ${answers[index] === i ? 'bg-blue-600 text-white border-blue-600 shadow-xl' : 'bg-slate-50 border-transparent hover:border-slate-100'}`}>
                                    <span className="opacity-30 mr-4">{LETTERS[i]}</span> {opt}
                                </button>
                            ))}
                        </div>
                        <div className="mt-16 flex justify-between gap-6">
                            <button onClick={() => setIndex(i => i - 1)} disabled={index === 0} className="px-10 py-4 font-black text-slate-300 disabled:opacity-0 uppercase text-xs">Previous</button>
                            {index === questions.length - 1 
                                ? <button onClick={() => setModal({title: "Finish Exam", message: "Are you sure you want to submit your answers?", confirmText: "Submit", onCancel: () => setModal(null), onConfirm: finish})} className="bg-green-500 text-white px-16 py-5 rounded-3xl font-black text-lg shadow-xl shadow-green-100 uppercase">SUBMIT EXAM</button>
                                : <button onClick={() => setIndex(i => i + 1)} className="bg-blue-600 text-white px-16 py-5 rounded-3xl font-black text-lg shadow-xl shadow-blue-100 uppercase">NEXT QUESTION</button>
                            }
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [page, setPage] = React.useState('home');
            const [ready, setReady] = React.useState(false);
            
            React.useEffect(() => {
                const i = setInterval(() => { if(window.fb) { setReady(true); clearInterval(i); }}, 100);
            }, []);

            if (!ready) return <div className="h-screen flex items-center justify-center font-black text-slate-300 text-xs tracking-widest animate-pulse">SYNCHRONIZING SYSTEM...</div>;

            return (
                <AppContext.Provider value={{ setPage }}>
                    {page === 'home' && (
                        <div className="min-h-screen flex flex-col items-center justify-center text-center p-8">
                            <img src="https://sunnykeyz123.github.io/mustardseedschl/images/Logo.png" className="w-24 mb-12" />
                            <h1 className="text-7xl font-black mb-12 tracking-tighter leading-none">MUSTARD SEED<br/><span className="text-blue-600 italic uppercase">CBT System</span></h1>
                            <div className="flex flex-col sm:flex-row gap-5 w-full max-w-md">
                                <button onClick={() => setPage('exam')} className="flex-1 bg-blue-600 text-white py-6 rounded-[32px] font-black shadow-2xl hover:scale-105 transition-all uppercase tracking-tight">TAKE EXAM</button>
                                <button onClick={() => setPage('admin')} className="flex-1 bg-white text-slate-400 border-2 py-6 rounded-[32px] font-black hover:bg-slate-50 transition-all uppercase tracking-tight">ADMIN PORTAL</button>
                            </div>
                            <p className="mt-16 text-[10px] font-black text-slate-300 uppercase tracking-[0.3em] italic">Built for Excellence by Sunnykeyz</p>
                        </div>
                    )}
                    {page === 'exam' && <StudentExam />}
                    {page === 'admin' && <AdminPanel />}
                </AppContext.Provider>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
