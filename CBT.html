        // --- ADMIN PAGE ---
        const AdminPage = () => {
            const { setPage } = React.useContext(AppContext);
            const [auth, setAuth] = React.useState(false);

            const [newQ, setNewQ] = React.useState({ text: '', options: ['', '', '', ''], correct: 0 });

            React.useEffect(() => {
                if (!auth) return;
                const qScores = fb.query(fb.collection(fb.db, "artifacts/my-project-a6208/scores"));
                const qQuest = fb.query(fb.collection(fb.db, "artifacts/my-project-a6208/public/data/questions"));
                
                const unsub1 = fb.onSnapshot(qScores, (s) => {
                    const data = s.docs.map(d => ({id: d.id, ...d.data()}));
                    data.sort((a, b) => (b.date?.seconds || 0) - (a.date?.seconds || 0));
                    setScores(data);
                });
                const unsub2 = fb.onSnapshot(qQuest, (s) => setQuestions(s.docs.map(d => ({id: d.id, ...d.data()}))));

            const addQuestion = async () => {

                await fb.addDoc(fb.collection(fb.db, "artifacts/my-project-a6208/public/data/questions"), {
                    questionText: newQ.text,
                    options: newQ.options,
                    correctOptionIndex: parseInt(newQ.correct)

            const deleteQuestion = async (id) => {

                    await fb.deleteDoc(fb.doc(fb.db, "artifacts/my-project-a6208/public/data/questions", id));

            };

            const deleteScore = async (id) => {
                if (!confirm("Delete this student's score?")) return;
                await fb.deleteDoc(fb.doc(fb.db, "artifacts/my-project-a6208/scores", id));
            };

            const deleteAllScores = async () => {
                if (!confirm(`Clear ALL ${scores.length} records?`)) return;
                const promises = scores.map(s => fb.deleteDoc(fb.doc(fb.db, "artifacts/my-project-a6208/scores", s.id)));

                        <input type="password" placeholder="Password" className="w-full p-3 border rounded mb-4" onChange={e => setPass(e.target.value)} />

                    </div>
                </div>
            );

            return (
                <div className="p-8 max-w-5xl mx-auto space-y-12">
                    <div className="flex justify-between items-center">
                        <button onClick={() => setPage('home')} className="text-blue-600 font-bold">← Back Home</button>
                        <h1 className="text-2xl font-black text-gray-800 underline decoration-blue-500">ADMIN CONTROL PANEL</h1>
                    </div>

                    {/* ADD QUESTION SECTION */}
                    <section className="bg-white p-6 rounded-xl shadow border">
                        <h2 className="text-xl font-bold mb-6 flex items-center">
                            <span className="bg-blue-600 text-white w-8 h-8 rounded-full flex items-center justify-center mr-2 text-sm">1</span>
                            Add New Question
                        </h2>
                        <div className="space-y-4">
                            <textarea 
                                placeholder="Type the question here..." 
                                className="w-full p-4 border rounded-xl bg-gray-50 focus:bg-white"
                                value={newQ.text}
                                onChange={e => setNewQ({...newQ, text: e.target.value})}
                            ></textarea>
                            <div className="grid grid-cols-2 gap-4">
                                {newQ.options.map((opt, i) => (
                                    <div key={i} className="flex items-center space-x-2">
                                        <span className="font-bold text-gray-400">{optionLetters[i]}</span>
                                        <input 
                                            className="flex-1 p-3 border rounded-lg"
                                            placeholder={`Option ${optionLetters[i]}`}
                                            value={opt}
                                            onChange={e => {
                                                const copy = [...newQ.options];
                                                copy[i] = e.target.value;
                                                setNewQ({...newQ, options: copy});
                                            }}
                                        />
                                    </div>
                                ))}
                            </div>
                            <div className="flex items-center justify-between pt-4 border-t">
                                <div className="flex items-center space-x-3">
                                    <span className="text-sm font-bold text-gray-600">Correct Answer:</span>
                                    <select 
                                        className="p-2 border rounded bg-green-50 font-bold text-green-700"
                                        value={newQ.correct}
                                        onChange={e => setNewQ({...newQ, correct: e.target.value})}
                                    >
                                        {optionLetters.map((l, i) => <option key={i} value={i}>Option {l}</option>)}
                                    </select>
                                </div>
                                <button onClick={addQuestion} className="bg-blue-600 text-white px-10 py-3 rounded-xl font-bold hover:bg-blue-700 shadow-lg transition">Save Question</button>
                            </div>
                        </div>
                    </section>

                    {/* SCORES SECTION */}
                    <section className="bg-white p-6 rounded-xl shadow border">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-xl font-bold flex items-center">
                                <span className="bg-green-600 text-white w-8 h-8 rounded-full flex items-center justify-center mr-2 text-sm">2</span>
                                Student Results ({scores.length})
                            </h2>
                            {scores.length > 0 && (
                                <button onClick={deleteAllScores} className="text-red-600 text-xs font-bold hover:underline">CLEAR ALL RECORDS</button>
                            )}
                        </div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left">
                                <thead className="bg-gray-50 text-gray-500 text-xs uppercase">
                                    <tr>
                                        <th className="p-4">Student</th>

                                        <th className="p-4">Date & Time</th>
                                        <th className="p-4 text-right">Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {scores.map(s => (
                                        <tr key={s.id} className="border-b hover:bg-blue-50/30 transition">
                                            <td className="p-4">
                                                <div className="font-bold">{s.studentName}</div>
                                                <div className="text-xs text-gray-400">{s.studentId}</div>
                                            </td>
                                            <td className="p-4">
                                                <div className="text-blue-600 font-black">{s.correctAnswers}/{s.totalQuestions}</div>
                                                <div className="text-xs font-bold text-green-600">{s.score}%</div>
                                            </td>
                                            <td className="p-4 text-sm">
                                                {s.date?.toDate ? (
                                                    <div>
                                                        <div>{s.date.toDate().toLocaleDateString()}</div>
                                                        <div className="text-xs text-gray-400">{s.date.toDate().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</div>
                                                    </div>
                                                ) : "Just now"}
                                            </td>
                                            <td className="p-4 text-right">
                                                <button onClick={() => deleteScore(s.id)} className="text-red-300 hover:text-red-600">Delete</button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </section>

                    {/* MANAGE QUESTIONS LIST */}
                    <section className="bg-white p-6 rounded-xl shadow border">
                        <h2 className="text-xl font-bold mb-6 flex items-center">
                            <span className="bg-orange-500 text-white w-8 h-8 rounded-full flex items-center justify-center mr-2 text-sm">3</span>
                            Manage Questions ({questions.length})
                        </h2>
                        <div className="space-y-3">
                            {questions.map((q, idx) => (
                                <div key={q.id} className="p-4 border rounded-lg flex justify-between items-center hover:border-blue-300 transition">
                                    <div>
                                        <p className="font-bold text-gray-800">Q{idx+1}: {q.questionText}</p>
                                        <p className="text-xs text-green-600 font-bold uppercase mt-1">Answer: {optionLetters[q.correctOptionIndex]}</p>
                                    </div>
                                    <button onClick={() => deleteQuestion(q.id)} className="text-red-500 bg-red-50 px-3 py-1 rounded hover:bg-red-500 hover:text-white transition text-xs font-bold">REMOVE</button>
                                </div>
                            ))}
                        </div>
                    </section>
                </div>
            );
        };

       const StudentExamPage = () => {
    const { setPage } = React.useContext(AppContext);
    const [msId, setMsId] = React.useState('');
    const [student, setStudent] = React.useState(null);
    const [questions, setQuestions] = React.useState([]);
    const [index, setIndex] = React.useState(0);
    const [answers, setAnswers] = React.useState({});
    const [loading, setLoading] = React.useState(false);
    const [finished, setFinished] = React.useState(false);
    const [finalScore, setFinalScore] = React.useState(0);

    // --- 1. THE FINISH FUNCTION ---
    async function finishExam(isAuto = false) {
        if (!isAuto) {
            if (!confirm("Submit your answers?")) return;
        }

        let correctCount = 0;
        questions.forEach((q, i) => { 
            if (answers[i] === q.correctOptionIndex) correctCount++; 
        });
        
        const pct = Math.round((correctCount / questions.length) * 100);
        setFinalScore(pct);

        try {
            await fb.addDoc(fb.collection(fb.db, "artifacts/my-project-a6208/scores"), {
                studentName: student.name, 
                studentId: student.id,
                score: pct, 
                correctAnswers: correctCount,
                totalQuestions: questions.length, 
                date: new Date()
            });
            setFinished(true);
        } catch (e) { 
            alert("Error saving score: " + e.message); 
        }
    }

    // --- 2. THE TAB-SWITCH GUARD (ONLY ONE!) ---
    React.useEffect(() => {
        const handleVisibilityChange = () => {
            if (document.hidden && student && !finished) {
                alert("SECURITY VIOLATION: Tab switching detected. Your exam is being submitted now.");
                finishExam(true); 
            }
        };
        document.addEventListener("visibilitychange", handleVisibilityChange);
        return () => document.removeEventListener("visibilitychange", handleVisibilityChange);
    }, [student, finished, questions, answers]);

    // --- 3. THE LOGIN FUNCTION (ONLY ONE!) ---
    const verifyId = async () => {
        setLoading(true);
        const inputId = msId.toUpperCase().trim();

        try {
            const { data } = await _supabase.from('students').select('*').eq('status', 'Enrolled');
            const found = data?.find(s => ("MS-" + s.id.substring(0, 5).toUpperCase()) === inputId);

            if (found) {
                const scorePath = "artifacts/my-project-a6208/scores";
                const scoreRef = fb.collection(fb.db, scorePath);
                const q = fb.query(scoreRef, fb.where("studentId", "==", inputId));
                const scoreSnap = await fb.getDocs(q);

                if (!scoreSnap.empty) {
                    alert("ACCESS DENIED: You have already submitted this exam.");
                    setLoading(false);
                    return;
                }

                setStudent({ name: found.full_name, id: inputId });
                const snap = await fb.getDocs(fb.collection(fb.db, "artifacts/my-project-a6208/public/data/questions"));
                setQuestions(snap.docs.map(d => ({id: d.id, ...d.data()})));
            } else {
                alert("ID Not Found or Student not Enrolled.");
            }
        } catch (error) {
            console.error("Login error:", error);
            alert("Login Error: " + error.message);
        }
        setLoading(false);
    };

    // --- 4. YOUR UI (JSX) ---
    // Make sure your return statement follows here...
    if (finished) return <div>Exam Finished! Your score: {finalScore}%</div>;
    
    // ... continue with the rest of your HTML ...
};
           if (finished) return (
    <div className="flex flex-col items-center justify-center min-h-screen p-6 text-center">

            <div className="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-6">
                <svg className="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7" />

            {/* The Raw Score Display */}

                <p className="text-gray-500 uppercase tracking-widest text-xs font-bold mb-1">Your Total Score</p>

        {student.name}
    </h3>
    <p className="text-sm font-mono text-gray-500 bg-gray-100 inline-block px-3 py-1 rounded-md">

    </p>
</div>

            <button 
                onClick={() => setPage('home')}

            >
                Close and Exit
            </button>

);

            if (!student) return (

                </div>
            );

            if (questions.length === 0) return <div className="p-20 text-center font-bold">Pls Wait, Getting Your Question Ready!!.</div>;

            return (
                <div 
                    className="max-w-2xl mx-auto p-6 pt-12"
                    onContextMenu={(e) => e.preventDefault()} // Blocks Right-Click

</div>

                            <p className="text-[10px] text-gray-400 uppercase font-black tracking-tighter">Candidate Name</p>
                            <h2 className="text-xl font-black text-gray-800 uppercase tracking-tight">
                                {student.name}
                            </h2>
                        </div>
                        
                        <div className="text-right">
                            <p className="text-[10px] text-gray-400 uppercase font-black tracking-tighter text-right">Progress</p>
                            <div className="bg-blue-600 text-white px-4 py-1 rounded-full text-lg font-black shadow-md flex items-center gap-1">
                                <span>{index + 1}</span>
                                <span className="text-blue-300 text-xs">/</span>
                                <span className="text-blue-100 text-sm">{questions.length}</span>
                            </div>
                        </div>
                    </div>

                    {/* QUESTION CARD */}
                    <div className="bg-white p-8 rounded-2xl shadow-sm border border-gray-200">
                        <p className="text-xl font-bold mb-8">{questions[index].questionText}</p>
                        <div className="space-y-3">
                            {questions[index].options.map((opt, i) => (
                                <button key={i} onClick={() => setAnswers({...answers, [index]: i})} 
                                className={`w-full p-5 text-left rounded-xl border-2 transition ${answers[index] === i ? 'bg-blue-600 text-white border-blue-600' : 'bg-white border-gray-100 hover:border-blue-200'}`}>
                                    {optionLetters[i]}. {opt}
                                </button>
                            ))}
                        </div>
                        <div className="mt-10 flex justify-between">
                            <button onClick={() => setIndex(i => i - 1)} disabled={index === 0} className="text-gray-400 font-bold">Back</button>
                            {index === questions.length - 1 ? 
                                <button onClick={finishExam} className="bg-green-600 text-white px-10 py-3 rounded-xl font-bold shadow-lg">Submit Exam</button> :
                                <button onClick={() => setIndex(i => i + 1)} className="bg-blue-600 text-white px-10 py-3 rounded-xl font-bold shadow-lg">Next Question</button>
                            }
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [page, setPage] = React.useState('home');
            const [ready, setReady] = React.useState(false);
            React.useEffect(() => {
                const i = setInterval(() => { if(window.fb) { setReady(true); clearInterval(i); }}, 100);
            }, []);
            if (!ready) return <div className="p-20 text-center">Loading Database...</div>;
            return (
                <AppContext.Provider value={{ setPage }}>
                    {page === 'home' && (
                        <div className="flex flex-col items-center justify-center min-h-screen text-center">
                            <h1 className="text-5xl font-black mb-10 tracking-tighter">MUSTARD SEED CBT</h1>
                            <div className="space-x-4">
                                <button onClick={() => setPage('exam')} className="bg-blue-600 text-white px-12 py-4 rounded-full font-bold shadow-lg">Take Exam</button>
                                <button onClick={() => setPage('admin')} className="bg-white text-gray-500 px-12 py-4 rounded-full font-bold border">Admin</button>
                            </div>
                        </div>
                    )}
                    {page === 'exam' && <StudentExamPage />}
                    {page === 'admin' && <AdminPage />}
                </AppContext.Provider>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
