<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="https://sunnykeyz123.github.io/mustardseedschl/images/Logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mustard Seed CBT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, onSnapshot, query, where, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDOO3uHmzOuAxJcdLxu-OImzlH12A6FpeY",
            authDomain: "my-project-a6208.firebaseapp.com",
            projectId: "my-project-a6208",
            storageBucket: "my-project-a6208.firebasestorage.app",
            messagingSenderId: "784486701962",
            appId: "1:784486701962:web:0d3cd002bbfd647e944673"
        };

        const app = initializeApp(firebaseConfig);
        window.fb = {
            db: getFirestore(app),
            auth: getAuth(app),
            collection, addDoc, getDocs, doc, deleteDoc, onSnapshot, query, where, signInAnonymously, onAuthStateChanged, setDoc
        };
    </script>

    <script type="text/babel">
        const { createClient } = window.supabase;
        const SB_URL = 'https://jqrcoqslmylmubxwfgyt.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxcmNvcXNsbXlsbXVieHdmZ3l0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ2ODc2NzgsImV4cCI6MjA4MDI2MzY3OH0.4bXOY35R3eGYZjPxtuJzvwifPEfHXr5UEdzFbB-caKU';
        const _supabase = createClient(SB_URL, SB_KEY);

        const AppContext = React.createContext(null);
        const ADMIN_PASSWORD = 'SUNNYKEYZ2025@';
        const optionLetters = ['A', 'B', 'C', 'D'];

        // --- ADMIN PAGE ---
        const AdminPage = () => {
            const { setPage } = React.useContext(AppContext);
            const [auth, setAuth] = React.useState(false);
            const [pass, setPass] = React.useState('');
            const [scores, setScores] = React.useState([]);
            const [questions, setQuestions] = React.useState([]);
            const [newQ, setNewQ] = React.useState({ text: '', options: ['', '', '', ''], correct: 0 });
            const [examLive, setExamLive] = React.useState(false);

            React.useEffect(() => {
                if (!auth) return;
                const qScores = fb.query(fb.collection(fb.db, "artifacts/my-project-a6208/scores"));
                const qQuest = fb.query(fb.collection(fb.db, "artifacts/my-project-a6208/public/data/questions"));
                const statusRef = fb.doc(fb.db, "artifacts/my-project-a6208/settings/examControl");
                
                const unsub1 = fb.onSnapshot(qScores, (s) => {
                    const data = s.docs.map(d => ({id: d.id, ...d.data()}));
                    data.sort((a, b) => (b.date?.seconds || 0) - (a.date?.seconds || 0));
                    setScores(data);
                });
                const unsub2 = fb.onSnapshot(qQuest, (s) => setQuestions(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsub3 = fb.onSnapshot(statusRef, (doc) => {
                    if (doc.exists()) setExamLive(doc.data().isLive);
                });

                return () => { unsub1(); unsub2(); unsub3(); };
            }, [auth]);

            const toggleExam = async () => {
                const statusRef = fb.doc(fb.db, "artifacts/my-project-a6208/settings/examControl");
                await fb.setDoc(statusRef, { isLive: !examLive });
            };

            const addQuestion = async () => {
                if(!newQ.text) return alert("Please enter question text");
                await fb.addDoc(fb.collection(fb.db, "artifacts/my-project-a6208/public/data/questions"), {
                    questionText: newQ.text,
                    options: newQ.options,
                    correctOptionIndex: parseInt(newQ.correct)
                });
                setNewQ({ text: '', options: ['', '', '', ''], correct: 0 });
                alert("Question Added!");
            };

            const deleteQuestion = async (id) => {
                if(confirm("Delete this question?")) await fb.deleteDoc(fb.doc(fb.db, "artifacts/my-project-a6208/public/data/questions", id));
            };

            const deleteScore = async (id) => {
                if (!confirm("Delete this student's score?")) return;
                await fb.deleteDoc(fb.doc(fb.db, "artifacts/my-project-a6208/scores", id));
            };

            const deleteAllScores = async () => {
                if (!confirm(`Clear ALL ${scores.length} records?`)) return;
                const promises = scores.map(s => fb.deleteDoc(fb.doc(fb.db, "artifacts/my-project-a6208/scores", s.id)));
                await Promise.all(promises);
                alert("All cleared!");
            };

            if (!auth) return (
                <div className="flex flex-col items-center justify-center min-h-screen">
                    <div className="bg-white p-8 rounded-xl shadow-lg border">
                        <h2 className="text-xl font-bold mb-4">Admin Access</h2>
                        <input type="password" placeholder="Password" className="w-full p-3 border rounded mb-4" onChange={e => setPass(e.target.value)} />
                        <button onClick={() => pass === ADMIN_PASSWORD ? setAuth(true) : alert("Wrong")} className="w-full bg-black text-white py-3 rounded">Login</button>
                    </div>
                </div>
            );

            return (
                <div className="p-8 max-w-5xl mx-auto space-y-8">
                    <div className="flex justify-between items-center">
                        <button onClick={() => setPage('home')} className="text-blue-600 font-bold">← Back Home</button>
                        <h1 className="text-2xl font-black text-gray-800 underline decoration-blue-500">ADMIN CONTROL</h1>
                    </div>

                    <section className="bg-white p-6 rounded-xl shadow border border-blue-200 bg-blue-50/30">
                        <div className="flex justify-between items-center">
                            <div>
                                <h2 className="text-xl font-bold">Exam Status Control</h2>
                                <p className="text-sm text-gray-500 font-bold uppercase">Current Status: <span className={examLive ? "text-green-600":"text-red-600"}>{examLive ? "LIVE" : "SHUTDOWN"}</span></p>
                            </div>
                            <button onClick={toggleExam} className={`px-10 py-4 rounded-xl font-black text-white transition-all shadow-lg ${examLive ? 'bg-red-600' : 'bg-green-600'}`}>
                                {examLive ? "SHUTDOWN EXAM" : "LAUNCH EXAM"}
                            </button>
                        </div>
                    </section>

                    <section className="bg-white p-6 rounded-xl shadow border">
                        <h2 className="text-xl font-bold mb-6 flex items-center"><span className="bg-blue-600 text-white w-8 h-8 rounded-full flex items-center justify-center mr-2 text-sm">1</span>Add New Question</h2>
                        <div className="space-y-4">
                            <textarea placeholder="Type question..." className="w-full p-4 border rounded-xl bg-gray-50" value={newQ.text} onChange={e => setNewQ({...newQ, text: e.target.value})}></textarea>
                            <div className="grid grid-cols-2 gap-4">
                                {newQ.options.map((opt, i) => (
                                    <input key={i} className="p-3 border rounded-lg" placeholder={`Option ${optionLetters[i]}`} value={opt} onChange={e => { const copy = [...newQ.options]; copy[i] = e.target.value; setNewQ({...newQ, options: copy}); }} />
                                ))}
                            </div>
                            <div className="flex items-center justify-between pt-4 border-t">
                                <select className="p-2 border rounded bg-green-50 font-bold text-green-700" value={newQ.correct} onChange={e => setNewQ({...newQ, correct: e.target.value})}>
                                    {optionLetters.map((l, i) => <option key={i} value={i}>Correct: {l}</option>)}
                                </select>
                                <button onClick={addQuestion} className="bg-blue-600 text-white px-10 py-3 rounded-xl font-bold shadow-lg">Save Question</button>
                            </div>
                        </div>
                    </section>

                    <section className="bg-white p-6 rounded-xl shadow border">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-xl font-bold flex items-center"><span className="bg-green-600 text-white w-8 h-8 rounded-full flex items-center justify-center mr-2 text-sm">2</span>Student Results ({scores.length})</h2>
                            {scores.length > 0 && <button onClick={deleteAllScores} className="text-red-600 text-xs font-bold hover:underline">CLEAR ALL</button>}
                        </div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left">
                                <thead className="bg-gray-50 text-gray-500 text-xs uppercase">
                                    <tr><th className="p-4">Student</th><th className="p-4">Score</th><th className="p-4">Action</th></tr>
                                </thead>
                                <tbody>
                                    {scores.map(s => (
                                        <tr key={s.id} className="border-b hover:bg-blue-50/30">
                                            <td className="p-4"><div className="font-bold">{s.studentName}</div><div className="text-xs text-gray-400">{s.studentId}</div></td>
                                            <td className="p-4"><div className="text-blue-600 font-black">{s.score}%</div></td>
                                            <td className="p-4"><button onClick={() => deleteScore(s.id)} className="text-red-300 hover:text-red-600">Delete</button></td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </section>
                </div>
            );
        };

        // --- STUDENT PAGE ---
        const StudentExamPage = () => {
            const { setPage } = React.useContext(AppContext);
            const [isLive, setIsLive] = React.useState(null);
            const [msId, setMsId] = React.useState('');
            const [student, setStudent] = React.useState(null);
            const [questions, setQuestions] = React.useState([]);
            const [index, setIndex] = React.useState(0);
            const [answers, setAnswers] = React.useState({});
            const [loading, setLoading] = React.useState(false);
            const [finished, setFinished] = React.useState(false);
            const [finalScore, setFinalScore] = React.useState(0);

            React.useEffect(() => {
                const statusRef = fb.doc(fb.db, "artifacts/my-project-a6208/settings/examControl");
                return fb.onSnapshot(statusRef, (doc) => {
                    setIsLive(doc.exists() ? doc.data().isLive : false);
                });
            }, []);

            async function finishExam(isAuto = false) {
                if (!isAuto && !confirm("Submit your answers?")) return;
                let correctCount = 0;
                questions.forEach((q, i) => { if (answers[i] === q.correctOptionIndex) correctCount++; });
                const pct = Math.round((correctCount / questions.length) * 100);
                setFinalScore(pct);
                try {
                    await fb.addDoc(fb.collection(fb.db, "artifacts/my-project-a6208/scores"), {
                        studentName: student.name, studentId: student.id, score: pct, 
                        correctAnswers: correctCount, totalQuestions: questions.length, date: new Date()
                    });
                    setFinished(true);
                } catch (e) { alert("Error: " + e.message); }
            }

            React.useEffect(() => {
                const handleVisibilityChange = () => {
                    if (document.hidden && student && !finished) {
                        alert("SECURITY VIOLATION: Tab switching detected. Immediate submission triggered.");
                        finishExam(true); 
                    }
                };
                document.addEventListener("visibilitychange", handleVisibilityChange);
                return () => document.removeEventListener("visibilitychange", handleVisibilityChange);
            }, [student, finished, questions, answers]);

            const verifyId = async () => {
                setLoading(true);
                const inputId = msId.toUpperCase().trim();
                try {
                    const { data } = await _supabase.from('students').select('*').eq('status', 'Enrolled');
                    const found = data?.find(s => ("MS-" + s.id.substring(0, 5).toUpperCase()) === inputId);
                    if (found) {
                        const scoreSnap = await fb.getDocs(fb.query(fb.collection(fb.db, "artifacts/my-project-a6208/scores"), fb.where("studentId", "==", inputId)));
                        if (!scoreSnap.empty) { alert("Already Submitted."); setLoading(false); return; }
                        setStudent({ name: found.full_name, id: inputId });
                        const snap = await fb.getDocs(fb.collection(fb.db, "artifacts/my-project-a6208/public/data/questions"));
                        setQuestions(snap.docs.map(d => ({id: d.id, ...d.data()})));
                    } else alert("ID Not Found. Ensure student is 'Enrolled' and RLS is OFF in Supabase.");
                } catch (e) { alert(e.message); }
                setLoading(false);
            };

            if (isLive === false) return (
                <div className="flex flex-col items-center justify-center min-h-screen text-center p-6 bg-slate-900">
                    <div className="bg-white p-12 rounded-[2.5rem] shadow-2xl max-w-md">
                        <div className="text-6xl mb-6">🔒</div>
                        <h1 className="text-2xl font-black mb-4">EXAM SESSION CLOSED</h1>
                        <p className="text-gray-500 font-bold">The administrator has not started this session. Please wait for further instructions.</p>
                        <button onClick={() => setPage('home')} className="mt-8 bg-black text-white px-8 py-3 rounded-xl font-bold w-full">Go Back</button>
                    </div>
                </div>
            );

            if (finished) return (
                <div className="flex flex-col items-center justify-center min-h-screen p-6 text-center">
                    <div className="bg-white p-10 rounded-3xl shadow-2xl border w-full max-w-md">
                        <h1 className="text-3xl font-black text-gray-800 mb-6">Completed!</h1>
                        <div className="bg-blue-50 p-6 rounded-2xl my-6">
                            <h2 className="text-4xl font-black text-blue-600">{finalScore}%</h2>
                        </div>
                        <p className="font-black uppercase">{student.name}</p>
                        <button onClick={() => setPage('home')} className="mt-8 w-full bg-black text-white py-4 rounded-xl font-bold">Exit</button>
                    </div>
                </div>
            );

            if (!student) return (
                <div className="flex items-center justify-center min-h-screen">
                    <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm border">
                        <h2 className="text-2xl font-bold mb-6">Student Login</h2>
                        <input className="w-full p-4 border rounded-xl mb-4 uppercase" placeholder="MS-XXXXX" onChange={e => setMsId(e.target.value)} />
                        <button onClick={verifyId} className="w-full py-4 bg-blue-600 text-white rounded-xl font-bold">{loading ? "Wait..." : "Start Exam"}</button>
                    </div>
                </div>
            );

            if (questions.length === 0) return <div className="p-20 text-center font-bold">Preparing questions...</div>;

            return (
                <div className="max-w-2xl mx-auto p-6 pt-12">
                    <div className="fixed top-0 left-0 w-full h-1.5 bg-gray-200"><div className="h-full bg-blue-600 transition-all" style={{ width: `${((index + 1) / questions.length) * 100}%` }}></div></div>
                    <div className="flex justify-between items-end mb-8 border-b pb-4">
                        <div><p className="text-[10px] text-gray-400 font-black uppercase">Candidate</p><h2 className="text-xl font-black uppercase">{student.name}</h2></div>
                        <div className="bg-blue-600 text-white px-4 py-1 rounded-full font-black">{index + 1} / {questions.length}</div>
                    </div>
                    <div className="bg-white p-8 rounded-2xl shadow-sm border">
                        <p className="text-xl font-bold mb-8">{questions[index].questionText}</p>
                        <div className="space-y-3">
                            {questions[index].options.map((opt, i) => (
                                <button key={i} onClick={() => setAnswers({...answers, [index]: i})} className={`w-full p-5 text-left rounded-xl border-2 transition ${answers[index] === i ? 'bg-blue-600 text-white border-blue-600' : 'bg-white border-gray-100 hover:border-blue-200'}`}>
                                    {optionLetters[i]}. {opt}
                                </button>
                            ))}
                        </div>
                        <div className="mt-10 flex justify-between">
                            <button onClick={() => setIndex(i => i - 1)} disabled={index === 0} className="text-gray-400 font-bold disabled:opacity-0">Back</button>
                            {index === questions.length - 1 ? <button onClick={() => finishExam()} className="bg-green-600 text-white px-10 py-3 rounded-xl font-bold shadow-lg">Submit Exam</button> : <button onClick={() => setIndex(i => i + 1)} className="bg-blue-600 text-white px-10 py-3 rounded-xl font-bold shadow-lg">Next</button>}
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [page, setPage] = React.useState('home');
            const [ready, setReady] = React.useState(false);
            const [showWarning, setShowWarning] = React.useState(true); 

            React.useEffect(() => {
                const i = setInterval(() => { if(window.fb) { setReady(true); clearInterval(i); }}, 100);
            }, []);

            if (!ready) return <div className="p-20 text-center font-black">CONNECTING DATABASE...</div>;

            return (
                <AppContext.Provider value={{ setPage }}>
                    {showWarning && (
                        <div className="fixed inset-0 z-[999] flex items-center justify-center bg-black/80 backdrop-blur-md p-4">
                            <div className="bg-white rounded-3xl shadow-2xl max-w-lg w-full overflow-hidden border">
                                <div className="bg-red-600 p-8 text-white text-center">
                                    <h2 className="text-3xl font-black uppercase tracking-tighter">Security Alert</h2>
                                </div>
                                <div className="p-8">
                                    <p className="text-gray-600 mb-6 font-bold">Anti-Cheat is ACTIVE. Any tab switching will submit your exam automatically.</p>
                                    <button onClick={() => setShowWarning(false)} className="w-full py-5 bg-black text-white rounded-2xl font-black text-lg">I UNDERSTAND</button>
                                </div>
                            </div>
                        </div>
                    )}
                    {page === 'home' && (
                        <div className="flex flex-col items-center justify-center min-h-screen text-center">
                            <h1 className="text-5xl font-black mb-10 tracking-tighter">MUSTARD SEED CBT</h1>
                            <div className="space-x-4">
                                <button onClick={() => setPage('exam')} className="bg-blue-600 text-white px-12 py-4 rounded-full font-bold shadow-lg">GO TO EXAM</button>
                                <button onClick={() => setPage('admin')} className="bg-white text-gray-500 px-12 py-4 rounded-full font-bold border">ADMIN</button>
                            </div>
                        </div>
                    )}
                    {page === 'exam' && <StudentExamPage />}
                    {page === 'admin' && <AdminPage />}
                </AppContext.Provider>
            );
        };
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
