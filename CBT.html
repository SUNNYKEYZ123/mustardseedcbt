<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="https://sunnykeyz123.github.io/mustardseedschl/images/Logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mustard Seed CBT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .custom-modal-overlay { background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, onSnapshot, query, where, setDoc, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDOO3uHmzOuAxJcdLxu-OImzlH12A6FpeY",
            authDomain: "my-project-a6208.firebaseapp.com",
            projectId: "my-project-a6208",
            storageBucket: "my-project-a6208.firebasestorage.app",
            messagingSenderId: "784486701962",
            appId: "1:784486701962:web:0d3cd002bbfd647e944673"
        };

        const app = initializeApp(firebaseConfig);
        window.fb = {
            db: getFirestore(app),
            auth: getAuth(app),
            collection, addDoc, getDocs, doc, deleteDoc, onSnapshot, query, where, signInAnonymously, onAuthStateChanged, setDoc, writeBatch
        };
    </script>

    <script type="text/babel">
        const { createClient } = window.supabase;
        const SB_URL = 'https://jqrcoqslmylmubxwfgyt.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxcmNvcXNsbXlsbXVieHdmZ3l0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ2ODc2NzgsImV4cCI6MjA4MDI2MzY3OH0.4bXOY35R3eGYZjPxtuJzvwifPEfHXr5UEdzFbB-caKU';
        const _supabase = createClient(SB_URL, SB_KEY);

        const AppContext = React.createContext(null);
        const ADMIN_PASSWORD = 'SUNNYKEYZ2025@';
        const optionLetters = ['A', 'B', 'C', 'D'];
        const GRADE_LEVELS = ['JSS 1', 'JSS 2', 'JSS 3', 'SSS 1', 'SSS 2', 'SSS 3'];

        // --- CUSTOM MODAL HELPER ---
        const CustomModal = ({ title, message, onConfirm, onCancel, confirmText = "Confirm" }) => (
            <div className="fixed inset-0 z-50 flex items-center justify-center custom-modal-overlay p-4">
                <div className="bg-white rounded-3xl p-8 max-w-sm w-full shadow-2xl text-center">
                    <h3 className="text-xl font-black mb-2 uppercase">{title}</h3>
                    <p className="text-gray-500 font-medium mb-6">{message}</p>
                    <div className="flex gap-3">
                        {onCancel && <button onClick={onCancel} className="flex-1 py-3 font-bold border rounded-xl hover:bg-gray-50">Cancel</button>}
                        <button onClick={onConfirm} className="flex-1 py-3 font-bold bg-blue-600 text-white rounded-xl hover:bg-blue-700">{confirmText}</button>
                    </div>
                </div>
            </div>
        );

        // --- ADMIN PAGE COMPONENT ---
        const AdminPage = () => {
            const { setPage } = React.useContext(AppContext);
            const [auth, setAuth] = React.useState(false);
            const [pass, setPass] = React.useState('');
            const [activeTab, setActiveTab] = React.useState('dashboard'); 
            const [modal, setModal] = React.useState(null);
            
            const [scores, setScores] = React.useState([]);
            const [questions, setQuestions] = React.useState([]);
            const [examLive, setExamLive] = React.useState(false);
            const [newQ, setNewQ] = React.useState({ text: '', options: ['', '', '', ''], correct: 0, grade_level: 'SSS 1' });
            
            const [classFilter, setClassFilter] = React.useState('ALL');
            const [qFilter, setQFilter] = React.useState('ALL');

            React.useEffect(() => {
                if (!auth) return;
                const unsub1 = fb.onSnapshot(fb.collection(fb.db, "artifacts/my-project-a6208/scores"), (s) => {
                    setScores(s.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => (b.date?.seconds || 0) - (a.date?.seconds || 0)));
                });
                const unsub2 = fb.onSnapshot(fb.collection(fb.db, "artifacts/my-project-a6208/public/data/questions"), (s) => {
                    setQuestions(s.docs.map(d => ({id: d.id, ...d.data()})));
                });
                const unsub3 = fb.onSnapshot(fb.doc(fb.db, "artifacts/my-project-a6208/settings/examControl"), (doc) => {
                    if (doc.exists()) setExamLive(doc.data().isLive);
                });
                return () => { unsub1(); unsub2(); unsub3(); };
            }, [auth]);

            const handleAddQuestion = async () => {
                if(!newQ.text) return setModal({ title: "Error", message: "Enter question text!", onConfirm: () => setModal(null) });
                // FIXED: Changed gradeLevel to grade_level to match student component
                await fb.addDoc(fb.collection(fb.db, "artifacts/my-project-a6208/public/data/questions"), {
                    questionText: newQ.text, options: newQ.options, correctOptionIndex: parseInt(newQ.correct), grade_level: newQ.grade_level
                });
                setNewQ({ ...newQ, text: '', options: ['', '', '', ''], correct: 0 });
                setModal({ title: "Success", message: "Question saved to bank.", onConfirm: () => setModal(null) });
            };

            const filteredScores = classFilter === 'ALL' ? scores : scores.filter(s => s.grade_level === classFilter);
            const filteredQuestions = qFilter === 'ALL' ? questions : questions.filter(q => q.grade_level === qFilter);

            if (!auth) return (
                <div className="flex items-center justify-center min-h-screen bg-gray-100 p-6">
                    <div className="bg-white p-10 rounded-3xl shadow-2xl border w-full max-w-sm text-center">
                        <img src="https://sunnykeyz123.github.io/mustardseedschl/images/Logo.png" className="w-16 mx-auto mb-6" alt="logo" />
                        <h2 className="text-2xl font-black mb-6 tracking-tighter uppercase">Admin Panel</h2>
                        <input type="password" placeholder="••••••••" className="w-full p-4 border rounded-xl mb-4 text-center outline-none focus:border-blue-500" onChange={e => setPass(e.target.value)} />
                        <button onClick={() => pass === ADMIN_PASSWORD ? setAuth(true) : alert("Wrong Password")} className="w-full bg-blue-600 text-white py-4 rounded-xl font-bold">LOGIN</button>
                    </div>
                </div>
            );

            return (
                <div className="flex min-h-screen bg-gray-50">
                    {modal && <CustomModal {...modal} />}
                    <aside className="w-64 bg-slate-900 text-white flex flex-col p-6 fixed h-full">
                        <div className="flex items-center gap-3 mb-10">
                            <img src="https://sunnykeyz123.github.io/mustardseedschl/images/Logo.png" className="w-8" alt="logo" />
                            <h1 className="text-lg font-black text-blue-400">ADMIN</h1>
                        </div>
                        <nav className="space-y-2 flex-1">
                            <button onClick={()=>setActiveTab('dashboard')} className={`w-full text-left p-4 rounded-xl font-bold transition ${activeTab==='dashboard'?'bg-blue-600 shadow-lg shadow-blue-900/50':'text-gray-400 hover:bg-slate-800'}`}>📊 Dashboard</button>
                            <button onClick={()=>setActiveTab('questions')} className={`w-full text-left p-4 rounded-xl font-bold transition ${activeTab==='questions'?'bg-blue-600 shadow-lg shadow-blue-900/50':'text-gray-400 hover:bg-slate-800'}`}>📝 Question Bank</button>
                            <button onClick={()=>setActiveTab('results')} className={`w-full text-left p-4 rounded-xl font-bold transition ${activeTab==='results'?'bg-blue-600 shadow-lg shadow-blue-900/50':'text-gray-400 hover:bg-slate-800'}`}>🏆 Results</button>
                        </nav>
                        <button onClick={()=>setPage('home')} className="mt-10 text-gray-500 text-xs font-bold hover:text-white transition uppercase">← Logout</button>
                    </aside>

                    <main className="flex-1 ml-64 p-12">
                        {activeTab === 'results' && (
                            <div className="space-y-6">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-3xl font-black tracking-tighter">Student Results</h2>
                                    <div className="flex gap-3">
                                        <select className="p-3 border rounded-xl font-bold text-xs bg-white" value={classFilter} onChange={e => setClassFilter(e.target.value)}>
                                            <option value="ALL">ALL CLASSES</option>
                                            {GRADE_LEVELS.map(g => <option key={g} value={g}>{g}</option>)}
                                        </select>
                                    </div>
                                </div>
                                <div className="bg-white rounded-3xl shadow-sm border overflow-hidden">
                                    <table className="w-full text-left border-collapse">
                                        <thead className="bg-slate-50 border-b">
                                            <tr>
                                                <th className="p-5 text-[10px] font-black uppercase text-gray-400">Student</th>
                                                <th className="p-5 text-[10px] font-black uppercase text-gray-400">Class</th>
                                                <th className="p-5 text-[10px] font-black uppercase text-gray-400">Score</th>
                                                <th className="p-5 text-[10px] font-black uppercase text-gray-400">Time Submitted</th>
                                                <th className="p-5 text-[10px] font-black uppercase text-gray-400 text-right">Action</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {filteredScores.map(s => (
                                                <tr key={s.id} className="border-b hover:bg-gray-50 transition font-bold text-sm">
                                                    <td className="p-5">{s.studentName}<br/><span className="text-[10px] text-gray-400 font-mono uppercase">{s.studentId}</span></td>
                                                    <td className="p-5 text-xs">{s.grade_level}</td>
                                                    <td className="p-5"><span className={`px-3 py-1 rounded-full text-[10px] font-black ${s.score >= 50 ? 'bg-green-100 text-green-700':'bg-red-100 text-red-700'}`}>{s.score}% ({s.correctAnswers}/{s.totalQuestions})</span></td>
                                                    <td className="p-5 text-[11px] text-gray-500">{s.date?.toDate ? s.date.toDate().toLocaleString() : 'N/A'}</td>
                                                    <td className="p-5 text-right">
                                                        <button onClick={() => setModal({ title: "Delete Result", message: "Remove score for " + s.studentName + "?", onCancel: () => setModal(null), onConfirm: async () => { await fb.deleteDoc(fb.doc(fb.db, "artifacts/my-project-a6208/scores", s.id)); setModal(null); }})} className="text-red-400 hover:text-red-600 transition">Delete</button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {activeTab === 'questions' && (
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-10">
                                <section className="bg-white p-8 rounded-3xl shadow-sm border h-fit sticky top-10">
                                    <h2 className="text-2xl font-black mb-6">New Question</h2>
                                    <textarea className="w-full p-4 border rounded-2xl mb-4 bg-gray-50 focus:bg-white transition h-32" placeholder="Question Text..." value={newQ.text} onChange={e=>setNewQ({...newQ, text:e.target.value})} />
                                    <div className="grid grid-cols-2 gap-3 mb-6">
                                        {newQ.options.map((o,i)=>(<input key={i} className="p-3 border rounded-xl" placeholder={`Option ${optionLetters[i]}`} value={o} onChange={e=>{let c=[...newQ.options];c[i]=e.target.value;setNewQ({...newQ,options:c})}} />))}
                                    </div>
                                    <div className="grid grid-cols-2 gap-3 mb-6">
                                        <select className="p-3 border rounded-xl font-bold bg-gray-50" value={newQ.correct} onChange={e=>setNewQ({...newQ,correct:e.target.value})}>{optionLetters.map((l,i)=><option key={i} value={i}>Correct: {l}</option>)}</select>
                                        <select className="p-3 border rounded-xl font-bold bg-blue-50 text-blue-600" value={newQ.grade_level} onChange={e=>setNewQ({...newQ, grade_level: e.target.value})}>{GRADE_LEVELS.map(g => <option key={g} value={g}>{g}</option>)}</select>
                                    </div>
                                    <button onClick={handleAddQuestion} className="w-full bg-blue-600 text-white py-4 rounded-2xl font-black shadow-lg shadow-blue-200 hover:bg-blue-700">SAVE QUESTION</button>
                                </section>

                                <section className="space-y-4">
                                    <div className="flex justify-between items-center mb-4">
                                        <h2 className="text-2xl font-black">Bank</h2>
                                        <select className="p-2 border rounded-xl text-xs font-black uppercase" value={qFilter} onChange={e=>setQFilter(e.target.value)}>
                                            <option value="ALL">ALL</option>
                                            {GRADE_LEVELS.map(g => <option key={g} value={g}>{g}</option>)}
                                        </select>
                                    </div>
                                    {filteredQuestions.map((q,i)=>(
                                        <div key={q.id} className="bg-white p-5 rounded-2xl border flex justify-between items-center shadow-sm">
                                            <div className="text-sm font-bold">
                                                <span className="bg-blue-100 text-blue-600 px-2 py-0.5 rounded text-[10px] uppercase font-black mr-3">{q.grade_level}</span>
                                                {q.questionText}
                                            </div>
                                            <button onClick={() => setModal({ title: "Delete Question", message: "Are you sure you want to delete this question?", onCancel: () => setModal(null), onConfirm: async () => { await fb.deleteDoc(fb.doc(fb.db,"artifacts/my-project-a6208/public/data/questions",q.id)); setModal(null); }})} className="text-red-400 font-bold ml-4">Del</button>
                                        </div>
                                    ))}
                                </section>
                            </div>
                        )}
                        
                        {activeTab === 'dashboard' && (
                             <div className="space-y-8">
                                <h2 className="text-4xl font-black tracking-tighter">System Overview</h2>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                                    <div className="bg-white p-8 rounded-3xl shadow-sm border text-center">
                                        <p className="text-gray-400 font-black text-xs uppercase mb-2">Exam Control</p>
                                        <h3 className={`text-3xl font-black mb-6 ${examLive?'text-green-500':'text-red-500'}`}>{examLive?'LIVE':'OFFLINE'}</h3>
                                        <button onClick={async () => await fb.setDoc(fb.doc(fb.db, "artifacts/my-project-a6208/settings/examControl"), { isLive: !examLive })} className="w-full py-4 bg-slate-900 text-white rounded-2xl font-bold">{examLive?'STOP EXAM':'START EXAM'}</button>
                                    </div>
                                    <div className="bg-white p-8 rounded-3xl shadow-sm border text-center">
                                        <p className="text-gray-400 font-black text-xs uppercase mb-2">Questions</p>
                                        <h3 className="text-4xl font-black">{questions.length}</h3>
                                    </div>
                                    <div className="bg-white p-8 rounded-3xl shadow-sm border text-center">
                                        <p className="text-gray-400 font-black text-xs uppercase mb-2">Submissions</p>
                                        <h3 className="text-4xl font-black text-blue-600">{scores.length}</h3>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        // --- STUDENT PAGE COMPONENT ---
        const StudentExamPage = () => {
            const { setPage } = React.useContext(AppContext);
            const [isLive, setIsLive] = React.useState(null);
            const [msId, setMsId] = React.useState('');
            const [student, setStudent] = React.useState(null);
            const [questions, setQuestions] = React.useState([]);
            const [index, setIndex] = React.useState(0);
            const [answers, setAnswers] = React.useState({});
            const [loading, setLoading] = React.useState(false);
            const [finished, setFinished] = React.useState(false);
            const [finalScore, setFinalScore] = React.useState(0);
            const [modal, setModal] = React.useState(null);

            React.useEffect(() => {
                return fb.onSnapshot(fb.doc(fb.db, "artifacts/my-project-a6208/settings/examControl"), (doc) => setIsLive(doc.exists() ? doc.data().isLive : false));
            }, []);

            const verifyId = async () => {
                setLoading(true);
                const inputId = msId.toUpperCase().trim();
                try {
                    // 1. Get all enrolled students
                    const { data, error } = await _supabase.from('students').select('*').eq('status', 'Enrolled');
                    
                    // 2. Find student by matching the suffix of the ID (more reliable)
                    const found = data?.find(s => {
                        const studentIdFull = "MS-" + s.id.toString().toUpperCase();
                        return studentIdFull.includes(inputId.replace("MS-", ""));
                    });

                    if (found) {
                        // 3. Check if they already submitted
                        const scoreSnap = await fb.getDocs(fb.query(fb.collection(fb.db, "artifacts/my-project-a6208/scores"), fb.where("studentId", "==", inputId)));
                        if (!scoreSnap.empty) { 
                            setModal({title: "Already Taken", message: "You have already submitted this exam.", onConfirm: () => setModal(null)}); 
                            setLoading(false); 
                            return; 
                        }
                        
                        // 4. Use the correct column name from your Supabase
                        const studentClass = found.grade_level || found.class; 
                        setStudent({ name: found.full_name, id: inputId, grade_level: studentClass });

                        // 5. Fetch questions matching that exact class name
                        const qSnap = await fb.getDocs(fb.query(
                            fb.collection(fb.db, "artifacts/my-project-a6208/public/data/questions"), 
                            fb.where("grade_level", "==", studentClass)
                        ));
                        
                        if(qSnap.empty) {
                            setModal({title: "No Questions", message: `No questions found for ${studentClass}. Please check Admin Bank.`, onConfirm: () => setModal(null)});
                        } else {
                            setQuestions(qSnap.docs.map(d => ({id: d.id, ...d.data()})));
                        }
                    } else {
                        setModal({title: "Invalid ID", message: "Student ID not found. Check your ID card.", onConfirm: () => setModal(null)});
                    }
                } catch (e) { 
                    setModal({title: "System Error", message: e.message, onConfirm: () => setModal(null)});
                }
                setLoading(false);
            };

            const handleSubmit = async (isAuto = false) => {
                let correctCount = 0;
                questions.forEach((q, i) => { if (answers[i] === q.correctOptionIndex) correctCount++; });
                const pct = questions.length > 0 ? Math.round((correctCount / questions.length) * 100) : 0;
                setFinalScore(pct);
                await fb.addDoc(fb.collection(fb.db, "artifacts/my-project-a6208/scores"), {
                    studentName: student.name, studentId: student.id, grade_level: student.grade_level,
                    score: pct, correctAnswers: correctCount, totalQuestions: questions.length, date: new Date()
                });
                setFinished(true);
                setModal(null);
            };

            // ... (rest of your design code for finished and student exam screens stays the same)
            if (finished) return (
                <div className="flex flex-col items-center justify-center min-h-screen text-center p-6 bg-slate-50">
                    <div className="bg-white p-12 rounded-3xl shadow-2xl border w-full max-w-sm">
                        <img src="https://sunnykeyz123.github.io/mustardseedschl/images/Logo.png" className="w-20 mx-auto mb-8" alt="logo" />
                        <h2 className="text-3xl font-black mb-2">WELL DONE!</h2>
                        <p className="text-gray-400 font-bold mb-8 uppercase text-xs tracking-widest">Exam Submitted Successfully</p>
                        <div className="bg-blue-600 text-white p-8 rounded-2xl mb-8">
                            <h3 className="text-5xl font-black">{finalScore}%</h3>
                        </div>
                        <button onClick={() => setPage('home')} className="w-full py-4 bg-black text-white rounded-xl font-bold">LOGOUT SYSTEM</button>
                    </div>
                </div>
            );

            if (!student) return (
                <div className="flex flex-col items-center justify-center min-h-screen bg-white">
                    {modal && <CustomModal {...modal} />}
                    <img src="https://sunnykeyz123.github.io/mustardseedschl/images/Logo.png" className="w-20 mb-10" alt="logo" />
                    <div className="bg-gray-50 p-10 rounded-3xl w-full max-w-sm border text-center">
                        <h2 className="text-2xl font-black mb-6 uppercase tracking-tighter">Student Login</h2>
                        <input className="w-full p-5 border-2 rounded-2xl mb-5 text-center font-bold uppercase text-lg focus:border-blue-600 outline-none" placeholder="MS-XXXXX" onChange={e => setMsId(e.target.value)} />
                        <button onClick={verifyId} className="w-full py-5 bg-blue-600 text-white rounded-2xl font-black shadow-lg shadow-blue-200 uppercase">{loading ? "Processing..." : "Take Exam"}</button>
                    </div>
                </div>
            );

            return (
                <div className="max-w-3xl mx-auto p-6 pt-12">
                    {modal && <CustomModal {...modal} />}
                    <div className="flex justify-between items-center mb-10">
                        <div className="flex items-center gap-4">
                            <img src="https://sunnykeyz123.github.io/mustardseedschl/images/Logo.png" className="w-12" alt="logo" />
                            <div><p className="text-[10px] text-blue-600 font-black uppercase tracking-widest">{student.grade_level}</p><h2 className="text-xl font-black uppercase">{student.name}</h2></div>
                        </div>
                        <div className="bg-slate-900 text-white px-6 py-2 rounded-full font-black text-sm">Question {index + 1} of {questions.length}</div>
                    </div>
                    
                    <div className="bg-white p-10 rounded-[40px] shadow-sm border">
                        <p className="text-2xl font-bold mb-10 leading-tight">{questions[index].questionText}</p>
                        <div className="space-y-4">
                            {questions[index].options.map((opt, i) => (
                                <button key={i} onClick={() => setAnswers({...answers, [index]: i})} className={`w-full p-6 text-left rounded-2xl border-2 transition-all font-bold ${answers[index] === i ? 'bg-blue-600 text-white border-blue-600 shadow-xl shadow-blue-100' : 'bg-gray-50 border-transparent hover:bg-gray-100'}`}>
                                    <span className="mr-4 opacity-50">{optionLetters[i]}</span> {opt}
                                </button>
                            ))}
                        </div>
                        <div className="mt-12 flex justify-between gap-4">
                            <button onClick={() => setIndex(i => i - 1)} disabled={index === 0} className="px-8 py-3 font-black text-gray-300 disabled:opacity-0 uppercase text-xs">Previous</button>
                            {index === questions.length - 1 
                                ? <button onClick={() => setModal({title: "Finish Exam?", message: "You are about to submit your final answers. Proceed?", confirmText: "Submit", onCancel: () => setModal(null), onConfirm: () => handleSubmit()})} className="bg-green-600 text-white px-12 py-4 rounded-2xl font-black shadow-lg shadow-green-100">SUBMIT EXAM</button> 
                                : <button onClick={() => setIndex(i => i + 1)} className="bg-blue-600 text-white px-12 py-4 rounded-2xl font-black shadow-lg shadow-blue-100">NEXT QUESTION</button>}
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [page, setPage] = React.useState('home');
            const [ready, setReady] = React.useState(false);
            React.useEffect(() => { const i = setInterval(() => { if(window.fb) { setReady(true); clearInterval(i); }}, 100); }, []);
            if (!ready) return <div className="flex flex-col items-center justify-center min-h-screen font-black text-gray-400 animate-pulse tracking-widest">CONNECTING DATABASE...</div>;
            return (
                <AppContext.Provider value={{ setPage }}>
                    {page === 'home' && (
                        <div className="flex flex-col items-center justify-center min-h-screen text-center p-6">
                            <img src="https://sunnykeyz123.github.io/mustardseedschl/images/Logo.png" className="w-24 mb-10" alt="logo" />
                            <h1 className="text-6xl font-black mb-10 tracking-tighter text-slate-900 leading-none">MUSTARD SEED<br/><span className="text-blue-600">CBT SYSTEM</span></h1>
                            <div className="flex flex-col sm:flex-row gap-4 w-full max-w-sm">
                                <button onClick={() => setPage('exam')} className="flex-1 bg-blue-600 text-white py-5 rounded-3xl font-black shadow-2xl shadow-blue-200 hover:scale-105 transition-all">TAKE EXAM</button>
                                <button onClick={() => setPage('admin')} className="flex-1 bg-white text-gray-400 border py-5 rounded-3xl font-black hover:bg-gray-50 transition-all">ADMIN PANEL</button>
                            </div>
                            <p className="mt-12 text-gray-300 font-black text-[10px] tracking-widest uppercase italic">Empowered by Sunnykeyz</p>
                        </div>
                    )}
                    {page === 'exam' && <StudentExamPage />}
                    {page === 'admin' && <AdminPage />}
                </AppContext.Provider>
            );
        };
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
