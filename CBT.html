<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="https://sunnykeyz123.github.io/mustardseedschl/images/Logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mustard Seed CBT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, onSnapshot, query, where, setDoc, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDOO3uHmzOuAxJcdLxu-OImzlH12A6FpeY",
            authDomain: "my-project-a6208.firebaseapp.com",
            projectId: "my-project-a6208",
            storageBucket: "my-project-a6208.firebasestorage.app",
            messagingSenderId: "784486701962",
            appId: "1:784486701962:web:0d3cd002bbfd647e944673"
        };

        const app = initializeApp(firebaseConfig);
        window.fb = {
            db: getFirestore(app),
            auth: getAuth(app),
            collection, addDoc, getDocs, doc, deleteDoc, onSnapshot, query, where, signInAnonymously, onAuthStateChanged, setDoc, writeBatch
        };
    </script>

    <script type="text/babel">
        const { createClient } = window.supabase;
        const SB_URL = 'https://jqrcoqslmylmubxwfgyt.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxcmNvcXNsbXlsbXVieHdmZ3l0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ2ODc2NzgsImV4cCI6MjA4MDI2MzY3OH0.4bXOY35R3eGYZjPxtuJzvwifPEfHXr5UEdzFbB-caKU';
        const _supabase = createClient(SB_URL, SB_KEY);

        const AppContext = React.createContext(null);
        const ADMIN_PASSWORD = 'SUNNYKEYZ2025@';
        const optionLetters = ['A', 'B', 'C', 'D'];
        const GRADE_LEVELS = ['JSS 1', 'JSS 2', 'JSS 3', 'SSS 1', 'SSS 2', 'SSS 3'];

        const AdminPage = () => {
            const { setPage } = React.useContext(AppContext);
            const [auth, setAuth] = React.useState(false);
            const [pass, setPass] = React.useState('');
            const [activeTab, setActiveTab] = React.useState('dashboard'); 
            const [scores, setScores] = React.useState([]);
            const [questions, setQuestions] = React.useState([]);
            const [examLive, setExamLive] = React.useState(false);
            const [newQ, setNewQ] = React.useState({ text: '', options: ['', '', '', ''], correct: 0, gradeLevel: 'SSS 1' });

            React.useEffect(() => {
                if (!auth) return;
                const unsub1 = fb.onSnapshot(fb.collection(fb.db, "artifacts/my-project-a6208/scores"), (s) => {
                    setScores(s.docs.map(d => ({id: d.id, ...d.data()})));
                });
                const unsub2 = fb.onSnapshot(fb.collection(fb.db, "artifacts/my-project-a6208/public/data/questions"), (s) => {
                    setQuestions(s.docs.map(d => ({id: d.id, ...d.data()})));
                });
                const unsub3 = fb.onSnapshot(fb.doc(fb.db, "artifacts/my-project-a6208/settings/examControl"), (doc) => {
                    if (doc.exists()) setExamLive(doc.data().isLive);
                });
                return () => { unsub1(); unsub2(); unsub3(); };
            }, [auth]);

            const addQuestion = async () => {
                if(!newQ.text) return alert("Enter Question!");
                await fb.addDoc(fb.collection(fb.db, "artifacts/my-project-a6208/public/data/questions"), {
                    questionText: newQ.text,
                    options: newQ.options,
                    correctOptionIndex: parseInt(newQ.correct),
                    gradeLevel: newQ.gradeLevel
                });
                setNewQ({ ...newQ, text: '', options: ['', '', '', ''] });
                alert("Saved!");
            };

            if (!auth) return (
                <div className="flex items-center justify-center min-h-screen bg-gray-100">
                    <div className="bg-white p-8 rounded-2xl shadow-xl border w-80 text-center">
                        <h2 className="text-xl font-black mb-4">ADMIN LOGIN</h2>
                        <input type="password" placeholder="Password" className="w-full p-3 border rounded-lg mb-4 text-center" onChange={e => setPass(e.target.value)} />
                        <button onClick={() => pass === ADMIN_PASSWORD ? setAuth(true) : alert("Wrong Password")} className="w-full bg-blue-600 text-white py-3 rounded-lg font-bold">Access</button>
                    </div>
                </div>
            );

            return (
                <div className="flex min-h-screen bg-gray-50">
                    <aside className="w-64 bg-slate-900 text-white p-6 fixed h-full">
                        <h1 className="text-xl font-black mb-10 text-blue-400">ADMIN PANEL</h1>
                        <nav className="space-y-2">
                            <button onClick={()=>setActiveTab('dashboard')} className="w-full text-left p-3 rounded font-bold hover:bg-slate-800">Dashboard</button>
                            <button onClick={()=>setActiveTab('questions')} className="w-full text-left p-3 rounded font-bold hover:bg-slate-800">Questions</button>
                            <button onClick={()=>setActiveTab('results')} className="w-full text-left p-3 rounded font-bold hover:bg-slate-800">Results</button>
                        </nav>
                        <button onClick={()=>setPage('home')} className="mt-20 text-gray-400 text-sm">Logout</button>
                    </aside>
                    <main className="flex-1 ml-64 p-10">
                        {activeTab === 'questions' && (
                            <div className="grid grid-cols-2 gap-10">
                                <section className="bg-white p-6 rounded-2xl shadow border">
                                    <h2 className="text-xl font-black mb-4 uppercase">Add Question</h2>
                                    <textarea className="w-full p-4 border rounded-xl mb-4 bg-gray-50" placeholder="Question Text" value={newQ.text} onChange={e=>setNewQ({...newQ, text:e.target.value})} />
                                    <div className="grid grid-cols-2 gap-2 mb-4">
                                        {newQ.options.map((o,i)=>(<input key={i} className="p-2 border rounded" placeholder={`Option ${optionLetters[i]}`} value={o} onChange={e=>{let c=[...newQ.options];c[i]=e.target.value;setNewQ({...newQ,options:c})}} />))}
                                    </div>
                                    <div className="flex gap-2 mb-4">
                                        <select className="flex-1 p-2 border rounded font-bold" value={newQ.correct} onChange={e=>setNewQ({...newQ,correct:e.target.value})}>{optionLetters.map((l,i)=><option key={i} value={i}>Ans: {l}</option>)}</select>
                                        <select className="flex-1 p-2 border rounded font-bold bg-blue-50" value={newQ.gradeLevel} onChange={e=>setNewQ({...newQ, gradeLevel: e.target.value})}>{GRADE_LEVELS.map(g => <option key={g} value={g}>{g}</option>)}</select>
                                    </div>
                                    <button onClick={addQuestion} className="w-full bg-blue-600 text-white py-3 rounded-xl font-bold uppercase">Save Question</button>
                                </section>
                                <section className="space-y-3">
                                    {questions.map(q=>(<div key={q.id} className="bg-white p-4 rounded-xl border flex justify-between items-center text-xs font-bold"><div><b>[{q.gradeLevel}]</b> {q.questionText}</div><button onClick={async()=>await fb.deleteDoc(fb.doc(fb.db,"artifacts/my-project-a6208/public/data/questions",q.id))} className="text-red-400">Del</button></div>))}
                                </section>
                            </div>
                        )}
                        {activeTab === 'results' && (
                            <div className="bg-white rounded-2xl shadow border overflow-hidden">
                                <table className="w-full text-left">
                                    <thead className="bg-gray-50 border-b font-black text-[10px] uppercase"><tr><th className="p-4">Student</th><th>Score</th><th>Class</th></tr></thead>
                                    <tbody>{scores.map(s => (<tr key={s.id} className="border-b text-sm font-bold"><td className="p-4">{s.studentName}<br/><span className="text-gray-400 font-normal text-[10px]">{s.studentId}</span></td><td className="text-blue-600">{s.score}%</td><td>{s.gradeLevel}</td></tr>))}</tbody>
                                </table>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const StudentExamPage = () => {
            const { setPage } = React.useContext(AppContext);
            const [isLive, setIsLive] = React.useState(null);
            const [msId, setMsId] = React.useState('');
            const [student, setStudent] = React.useState(null);
            const [questions, setQuestions] = React.useState([]);
            const [index, setIndex] = React.useState(0);
            const [answers, setAnswers] = React.useState({});
            const [loading, setLoading] = React.useState(false);
            const [finished, setFinished] = React.useState(false);
            const [finalScore, setFinalScore] = React.useState(0);

            React.useEffect(() => {
                const statusRef = fb.doc(fb.db, "artifacts/my-project-a6208/settings/examControl");
                return fb.onSnapshot(statusRef, (doc) => setIsLive(doc.exists() ? doc.data().isLive : false));
            }, []);

            const verifyId = async () => {
                setLoading(true);
                const inputId = msId.toUpperCase().trim();
                try {
                    const { data } = await _supabase.from('students').select('*').eq('status', 'Enrolled');
                    const found = data?.find(s => ("MS-" + s.id.substring(0, 5).toUpperCase()) === inputId);
                    if (found) {
                        const scoreSnap = await fb.getDocs(fb.query(fb.collection(fb.db, "artifacts/my-project-a6208/scores"), fb.where("studentId", "==", inputId)));
                        if (!scoreSnap.empty) { alert("Already Submitted."); setLoading(false); return; }

                        const sClass = found.grade_level; // Getting class from Supabase
                        setStudent({ name: found.full_name, id: inputId, gradeLevel: sClass });

                        // FETCH ONLY QUESTIONS FOR THIS CLASS
                        const qQuery = fb.query(fb.collection(fb.db, "artifacts/my-project-a6208/public/data/questions"), fb.where("gradeLevel", "==", sClass));
                        const snap = await fb.getDocs(qQuery);
                        
                        if(snap.empty) alert(`No questions found for your class: ${sClass}`);
                        else setQuestions(snap.docs.map(d => ({id: d.id, ...d.data()})));
                    } else alert("Invalid ID.");
                } catch (e) { alert(e.message); }
                setLoading(false);
            };

            async function submitExam() {
                if (!confirm("Submit?")) return;
                let correct = 0;
                questions.forEach((q, i) => { if (answers[i] === q.correctOptionIndex) correct++; });
                const pct = Math.round((correct / questions.length) * 100);
                setFinalScore(pct);
                try {
                    await fb.addDoc(fb.collection(fb.db, "artifacts/my-project-a6208/scores"), {
                        studentName: student.name, studentId: student.id, gradeLevel: student.gradeLevel, score: pct, date: new Date()
                    });
                    setFinished(true);
                } catch (e) { alert(e.message); }
            }

            if (finished) return (
                <div className="flex flex-col items-center justify-center min-h-screen p-6 text-center">
                    <div className="bg-white p-10 rounded-3xl shadow-xl border w-full max-w-sm">
                        <h1 className="text-3xl font-black mb-6">Score: {finalScore}%</h1>
                        <p className="font-bold uppercase text-gray-400">{student.name}</p>
                        <button onClick={() => setPage('home')} className="mt-8 w-full bg-black text-white py-4 rounded-xl font-bold">Logout</button>
                    </div>
                </div>
            );

            if (!student) return (
                <div className="flex items-center justify-center min-h-screen">
                    <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm border text-center">
                        <h2 className="text-2xl font-black mb-6">STUDENT LOGIN</h2>
                        <input className="w-full p-4 border rounded-xl mb-4 text-center font-bold uppercase" placeholder="MS-XXXXX" onChange={e => setMsId(e.target.value)} />
                        <button onClick={verifyId} className="w-full py-4 bg-blue-600 text-white rounded-xl font-bold">{loading ? "Verifying..." : "Start Exam"}</button>
                    </div>
                </div>
            );

            if (questions.length === 0) return <div className="p-20 text-center font-black animate-pulse">Fetching Questions...</div>;

            return (
                <div className="max-w-2xl mx-auto p-6 pt-12">
                    <div className="flex justify-between items-end mb-8 border-b pb-4">
                        <div><p className="text-[10px] text-gray-400 font-black uppercase">{student.gradeLevel}</p><h2 className="text-xl font-black uppercase">{student.name}</h2></div>
                        <div className="bg-blue-600 text-white px-4 py-1 rounded-full font-black text-xs">{index + 1} / {questions.length}</div>
                    </div>
                    <div className="bg-white p-8 rounded-2xl shadow-sm border">
                        <p className="text-xl font-bold mb-8 text-slate-800">{questions[index].questionText}</p>
                        <div className="space-y-3">
                            {questions[index].options.map((opt, i) => (
                                <button key={i} onClick={() => setAnswers({...answers, [index]: i})} className={`w-full p-5 text-left rounded-xl border-2 transition ${answers[index] === i ? 'bg-blue-600 text-white border-blue-600' : 'bg-white border-gray-100 hover:border-blue-200 text-slate-600'}`}>
                                    <span className="font-black mr-3">{optionLetters[i]}.</span> {opt}
                                </button>
                            ))}
                        </div>
                        <div className="mt-10 flex justify-between items-center">
                            <button onClick={() => setIndex(i => i - 1)} disabled={index === 0} className="text-gray-400 font-bold disabled:opacity-0 uppercase text-xs">Prev</button>
                            {index === questions.length - 1 ? <button onClick={submitExam} className="bg-green-600 text-white px-10 py-3 rounded-xl font-bold uppercase shadow-lg">Submit</button> : <button onClick={() => setIndex(i => i + 1)} className="bg-blue-600 text-white px-10 py-3 rounded-xl font-bold uppercase shadow-lg">Next</button>}
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [page, setPage] = React.useState('home');
            const [ready, setReady] = React.useState(false);
            React.useEffect(() => { const i = setInterval(() => { if(window.fb) { setReady(true); clearInterval(i); }}, 100); }, []);
            if (!ready) return <div className="p-20 text-center font-black text-blue-600 animate-pulse">CONNECTING...</div>;

            return (
                <AppContext.Provider value={{ setPage }}>
                    {page === 'home' && (
                        <div className="flex flex-col items-center justify-center min-h-screen text-center">
                            <img src="https://sunnykeyz123.github.io/mustardseedschl/images/Logo.png" className="w-24 mb-6" />
                            <h1 className="text-5xl font-black mb-10 tracking-tighter">MUSTARD SEED CBT</h1>
                            <div className="space-x-4">
                                <button onClick={() => setPage('exam')} className="bg-blue-600 text-white px-12 py-4 rounded-full font-bold shadow-lg hover:scale-105 transition">TAKE EXAM</button>
                                <button onClick={() => setPage('admin')} className="bg-white text-gray-500 px-12 py-4 rounded-full font-bold border hover:bg-gray-50 transition">ADMIN</button>
                            </div>
                        </div>
                    )}
                    {page === 'exam' && <StudentExamPage />}
                    {page === 'admin' && <AdminPage />}
                </AppContext.Provider>
            );
        };
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
