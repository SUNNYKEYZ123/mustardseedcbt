<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="https://sunnykeyz123.github.io/mustardseedschl/images/Logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mustard Seed CBT - Pro Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, onSnapshot, query, where, setDoc, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDOO3uHmzOuAxJcdLxu-OImzlH12A6FpeY",
            authDomain: "my-project-a6208.firebaseapp.com",
            projectId: "my-project-a6208",
            storageBucket: "my-project-a6208.firebasestorage.app",
            messagingSenderId: "784486701962",
            appId: "1:784486701962:web:0d3cd002bbfd647e944673"
        };

        const app = initializeApp(firebaseConfig);
        window.fb = {
            db: getFirestore(app),
            auth: getAuth(app),
            collection, addDoc, getDocs, doc, deleteDoc, onSnapshot, query, where, signInAnonymously, onAuthStateChanged, setDoc, writeBatch
        };
    </script>

    <script type="text/babel">
        const { createClient } = window.supabase;
        const SB_URL = 'https://jqrcoqslmylmubxwfgyt.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxcmNvcXNsbXlsbXVieHdmZ3l0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ2ODc2NzgsImV4cCI6MjA4MDI2MzY3OH0.4bXOY35R3eGYZjPxtuJzvwifPEfHXr5UEdzFbB-caKU';
        const _supabase = createClient(SB_URL, SB_KEY);

        const AppContext = React.createContext(null);
        const ADMIN_PASSWORD = 'SUNNYKEYZ2025@';
        const optionLetters = ['A', 'B', 'C', 'D'];
        
        // Ensure these match the exact text in your Supabase 'grade_level' column
        const CLASSES = ['SSS 1', 'SSS 2', 'SSS 3', 'JSS 1', 'JSS 2', 'JSS 3'];

        // --- ADMIN PAGE COMPONENT ---
        const AdminPage = () => {
            const { setPage } = React.useContext(AppContext);
            const [auth, setAuth] = React.useState(false);
            const [pass, setPass] = React.useState('');
            const [activeTab, setActiveTab] = React.useState('dashboard'); 
            
            const [scores, setScores] = React.useState([]);
            const [questions, setQuestions] = React.useState([]);
            const [examLive, setExamLive] = React.useState(false);
            const [newQ, setNewQ] = React.useState({ text: '', options: ['', '', '', ''], correct: 0, className: 'SSS 1' });
            const [resFilter, setResFilter] = React.useState('ALL');

            React.useEffect(() => {
                if (!auth) return;
                const unsub1 = fb.onSnapshot(fb.collection(fb.db, "artifacts/my-project-a6208/scores"), (s) => {
                    const data = s.docs.map(d => ({id: d.id, ...d.data()}));
                    setScores(data.sort((a, b) => (b.date?.seconds || 0) - (a.date?.seconds || 0)));
                });
                const unsub2 = fb.onSnapshot(fb.collection(fb.db, "artifacts/my-project-a6208/public/data/questions"), (s) => {
                    setQuestions(s.docs.map(d => ({id: d.id, ...d.data()})));
                });
                const unsub3 = fb.onSnapshot(fb.doc(fb.db, "artifacts/my-project-a6208/settings/examControl"), (doc) => {
                    if (doc.exists()) setExamLive(doc.data().isLive);
                });
                return () => { unsub1(); unsub2(); unsub3(); };
            }, [auth]);

            const toggleExam = async () => {
                await fb.setDoc(fb.doc(fb.db, "artifacts/my-project-a6208/settings/examControl"), { isLive: !examLive });
            };

            const addQuestion = async () => {
                if(!newQ.text) return alert("Enter Question!");
                await fb.addDoc(fb.collection(fb.db, "artifacts/my-project-a6208/public/data/questions"), {
                    questionText: newQ.text,
                    options: newQ.options,
                    correctOptionIndex: parseInt(newQ.correct),
                    className: newQ.className
                });
                setNewQ({ ...newQ, text: '', options: ['', '', '', ''], correct: 0 });
                alert(`Saved for ${newQ.className}`);
            };

            const deleteAllResults = async () => {
                if(confirm("Permanently delete ALL scores?")) {
                    const batch = fb.writeBatch(fb.db);
                    scores.forEach(s => batch.delete(fb.doc(fb.db, "artifacts/my-project-a6208/scores", s.id)));
                    await batch.commit();
                }
            };

            if (!auth) return (
                <div className="flex items-center justify-center min-h-screen bg-gray-100">
                    <div className="bg-white p-8 rounded-2xl shadow-xl border w-80 text-center">
                        <img src="https://sunnykeyz123.github.io/mustardseedschl/images/Logo.png" className="w-16 mx-auto mb-4" />
                        <h2 className="text-xl font-black mb-4 tracking-tighter uppercase text-slate-800">Admin Login</h2>
                        <input type="password" placeholder="••••••••" className="w-full p-3 border rounded-lg mb-4 text-center outline-none focus:border-blue-500" onChange={e => setPass(e.target.value)} />
                        <button onClick={() => pass === ADMIN_PASSWORD ? setAuth(true) : alert("Wrong Password")} className="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 transition">Access Panel</button>
                    </div>
                </div>
            );

            return (
                <div className="flex min-h-screen bg-gray-50">
                    <aside className="w-64 bg-slate-900 text-white flex flex-col p-6 fixed h-full">
                        <h1 className="text-xl font-black mb-10 text-blue-400">MUSTARD ADMIN</h1>
                        <nav className="space-y-2 flex-1">
                            <button onClick={()=>setActiveTab('dashboard')} className={`w-full text-left p-3 rounded-lg font-bold transition ${activeTab==='dashboard'?'bg-blue-600':'hover:bg-slate-800 text-gray-400'}`}>📊 Dashboard</button>
                            <button onClick={()=>setActiveTab('questions')} className={`w-full text-left p-3 rounded-lg font-bold transition ${activeTab==='questions'?'bg-blue-600':'hover:bg-slate-800 text-gray-400'}`}>📝 Question Bank</button>
                            <button onClick={()=>setActiveTab('results')} className={`w-full text-left p-3 rounded-lg font-bold transition ${activeTab==='results'?'bg-blue-600':'hover:bg-slate-800 text-gray-400'}`}>🏆 Exam Results</button>
                        </nav>
                        <button onClick={()=>setPage('home')} className="mt-10 text-gray-400 text-sm hover:text-white">← Logout to Home</button>
                    </aside>

                    <main className="flex-1 ml-64 p-10">
                        {activeTab === 'dashboard' && (
                            <div className="space-y-6">
                                <h2 className="text-3xl font-black tracking-tighter text-slate-800">System Overview</h2>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <div className="bg-white p-6 rounded-2xl shadow-sm border">
                                        <p className="text-gray-400 font-bold text-xs uppercase">Exam Status</p>
                                        <h3 className={`text-2xl font-black ${examLive?'text-green-500':'text-red-500'}`}>{examLive?'LIVE':'OFFLINE'}</h3>
                                        <button onClick={toggleExam} className="mt-4 w-full py-2 bg-slate-900 text-white rounded-lg text-sm font-bold">{examLive?'Stop Exam':'Start Exam'}</button>
                                    </div>
                                    <div className="bg-white p-6 rounded-2xl shadow-sm border">
                                        <p className="text-gray-400 font-bold text-xs uppercase">Total Questions</p>
                                        <h3 className="text-2xl font-black text-slate-800">{questions.length}</h3>
                                    </div>
                                    <div className="bg-white p-6 rounded-2xl shadow-sm border">
                                        <p className="text-gray-400 font-bold text-xs uppercase">Total Submissions</p>
                                        <h3 className="text-2xl font-black text-blue-600">{scores.length}</h3>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'questions' && (
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-10">
                                <section className="bg-white p-6 rounded-2xl shadow border h-fit sticky top-10">
                                    <h2 className="text-xl font-black mb-4">Add New Question</h2>
                                    <textarea className="w-full p-4 border rounded-xl mb-4 bg-gray-50 focus:bg-white transition" placeholder="Enter Question..." value={newQ.text} onChange={e=>setNewQ({...newQ, text:e.target.value})} />
                                    <div className="grid grid-cols-2 gap-2 mb-4">
                                        {newQ.options.map((o,i)=>(
                                            <input key={i} className="p-2 border rounded" placeholder={`Option ${optionLetters[i]}`} value={o} onChange={e=>{let c=[...newQ.options];c[i]=e.target.value;setNewQ({...newQ,options:c})}} />
                                        ))}
                                    </div>
                                    <div className="flex gap-2 mb-4">
                                        <select className="flex-1 p-2 border rounded font-bold" value={newQ.correct} onChange={e=>setNewQ({...newQ,correct:e.target.value})}>
                                            {optionLetters.map((l,i)=><option key={i} value={i}>Answer: {l}</option>)}
                                        </select>
                                        <select className="flex-1 p-2 border rounded font-bold bg-blue-50" value={newQ.className} onChange={e=>setNewQ({...newQ, className: e.target.value})}>
                                            {CLASSES.map(c => <option key={c} value={c}>{c}</option>)}
                                        </select>
                                    </div>
                                    <button onClick={addQuestion} className="w-full bg-blue-600 text-white py-3 rounded-xl font-bold shadow-lg hover:bg-blue-700">Save Question</button>
                                </section>

                                <section className="space-y-4">
                                    <h2 className="text-xl font-black">Question Bank</h2>
                                    {questions.map((q,i)=>(
                                        <div key={q.id} className="bg-white p-4 rounded-xl border flex justify-between items-center shadow-sm">
                                            <div>
                                                <span className="text-[9px] bg-blue-600 text-white px-2 py-0.5 rounded font-black uppercase mb-1 inline-block">{q.className}</span>
                                                <p className="font-bold text-sm text-slate-800">{q.questionText}</p>
                                                <span className="text-green-600 text-[10px] font-black uppercase">Ans: {optionLetters[q.correctOptionIndex]}</span>
                                            </div>
                                            <button onClick={async()=>await fb.deleteDoc(fb.doc(fb.db,"artifacts/my-project-a6208/public/data/questions",q.id))} className="text-red-400 font-bold text-xs uppercase underline">Delete</button>
                                        </div>
                                    ))}
                                </section>
                            </div>
                        )}

                        {activeTab === 'results' && (
                            <div className="space-y-4">
                                <div className="flex justify-between items-center">
                                    <div className="flex items-center gap-4">
                                        <h2 className="text-2xl font-black tracking-tighter text-slate-800">Results</h2>
                                        <select value={resFilter} onChange={e=>setResFilter(e.target.value)} className="p-1.5 border rounded-lg text-xs font-bold bg-white">
                                            <option value="ALL">All Classes</option>
                                            {CLASSES.map(c => <option key={c} value={c}>{c}</option>)}
                                        </select>
                                    </div>
                                    <button onClick={deleteAllResults} className="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-xs font-bold transition uppercase">Clear All</button>
                                </div>
                                <div className="bg-white rounded-2xl shadow border overflow-hidden">
                                    <table className="w-full text-left border-collapse">
                                        <thead className="bg-slate-50 border-b text-[10px] font-black uppercase text-gray-400">
                                            <tr>
                                                <th className="p-4">Student & Class</th>
                                                <th className="p-4">Raw Score</th>
                                                <th className="p-4">Percentage</th>
                                                <th className="p-4">Time</th>
                                                <th className="p-4">Action</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {scores.filter(s => resFilter === 'ALL' || s.className === resFilter).map(s => (
                                                <tr key={s.id} className="border-b hover:bg-blue-50/50 transition">
                                                    <td className="p-4 font-bold text-slate-700">
                                                        {s.studentName} <span className="text-blue-500 text-[10px]">[{s.className || 'N/A'}]</span>
                                                        <br/><span className="text-[10px] text-gray-400 font-mono">{s.studentId}</span>
                                                    </td>
                                                    <td className="p-4 font-black text-slate-700">{s.correctAnswers} / {s.totalQuestions}</td>
                                                    <td className="p-4"><span className={`px-2 py-1 rounded text-xs font-black ${s.score >= 50 ? 'bg-green-100 text-green-700':'bg-red-100 text-red-700'}`}>{s.score}%</span></td>
                                                    <td className="p-4 text-[10px] font-medium text-gray-500">
                                                        {s.date?.toDate ? s.date.toDate().toLocaleString() : 'Recent'}
                                                    </td>
                                                    <td className="p-4">
                                                        <button onClick={async()=>await fb.deleteDoc(fb.doc(fb.db,"artifacts/my-project-a6208/scores",s.id))} className="text-red-400 font-black text-[10px] uppercase underline">Delete</button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        // --- STUDENT PAGE COMPONENT ---
        const StudentExamPage = () => {
            const { setPage } = React.useContext(AppContext);
            const [isLive, setIsLive] = React.useState(null);
            const [msId, setMsId] = React.useState('');
            const [student, setStudent] = React.useState(null);
            const [questions, setQuestions] = React.useState([]);
            const [index, setIndex] = React.useState(0);
            const [answers, setAnswers] = React.useState({});
            const [loading, setLoading] = React.useState(false);
            const [finished, setFinished] = React.useState(false);
            const [finalScore, setFinalScore] = React.useState(0);

            React.useEffect(() => {
                const statusRef = fb.doc(fb.db, "artifacts/my-project-a6208/settings/examControl");
                return fb.onSnapshot(statusRef, (doc) => setIsLive(doc.exists() ? doc.data().isLive : false));
            }, []);

            async function finishExam(isAuto = false) {
                if (!isAuto && !confirm("Submit Exam?")) return;
                let correctCount = 0;
                questions.forEach((q, i) => { if (answers[i] === q.correctOptionIndex) correctCount++; });
                const pct = Math.round((correctCount / questions.length) * 100);
                setFinalScore(pct);
                try {
                    await fb.addDoc(fb.collection(fb.db, "artifacts/my-project-a6208/scores"), {
                        studentName: student.name, studentId: student.id, className: student.className,
                        score: pct, correctAnswers: correctCount, totalQuestions: questions.length, date: new Date()
                    });
                    setFinished(true);
                } catch (e) { alert(e.message); }
            }

            const verifyId = async () => {
                setLoading(true);
                const inputId = msId.toUpperCase().trim();
                const numericId = inputId.replace("MS-", ""); 

                try {
                    // Fetch student targeting 'grade_level'
                    const { data, error } = await _supabase
                        .from('students')
                        .select('*')
                        .eq('id', numericId)
                        .eq('status', 'Enrolled')
                        .single();

                    if (data) {
                        const scoreSnap = await fb.getDocs(fb.query(fb.collection(fb.db, "artifacts/my-project-a6208/scores"), fb.where("studentId", "==", inputId)));
                        if (!scoreSnap.empty) { alert("Exam Already Submitted."); setLoading(false); return; }
                        
                        // Extract grade level
                        const studentClass = String(data.grade_level || '').trim();
                        if(!studentClass) { alert("Error: Student has no grade_level assigned in Supabase."); setLoading(false); return; }

                        setStudent({ name: data.full_name, id: inputId, className: studentClass });
                        
                        // Fetch class-specific questions
                        const qQuery = fb.query(fb.collection(fb.db, "artifacts/my-project-a6208/public/data/questions"), fb.where("className", "==", studentClass));
                        const snap = await fb.getDocs(qQuery);
                        
                        if(snap.empty) alert(`Notice: No questions found for class [${studentClass}]`);
                        else setQuestions(snap.docs.map(d => ({id: d.id, ...d.data()})));
                    } else alert("ID Not Found or Student not Enrolled.");
                } catch (e) { alert(e.message); }
                setLoading(false);
            };

            if (isLive === false) return (
                <div className="flex flex-col items-center justify-center min-h-screen text-center p-6 bg-slate-900 text-white">
                    <h1 className="text-4xl font-black mb-4 uppercase tracking-tighter">Exam Session Offline</h1>
                    <button onClick={() => setPage('home')} className="bg-blue-600 px-8 py-3 rounded-xl font-bold">Return Home</button>
                </div>
            );

            if (finished) return (
                <div className="flex flex-col items-center justify-center min-h-screen p-6 text-center">
                    <div className="bg-white p-10 rounded-3xl shadow-2xl border w-full max-w-md">
                        <img src="https://sunnykeyz123.github.io/mustardseedschl/images/Logo.png" className="w-16 mx-auto mb-4" />
                        <h1 className="text-2xl font-black mb-6 text-slate-800">Exam Completed!</h1>
                        <div className="bg-blue-50 p-6 rounded-2xl mb-6"><h2 className="text-5xl font-black text-blue-600">{finalScore}%</h2></div>
                        <p className="font-bold uppercase text-xs text-gray-400 tracking-widest">{student.name} • {student.className}</p>
                        <button onClick={() => setPage('home')} className="mt-8 w-full bg-black text-white py-4 rounded-xl font-bold uppercase">Logout</button>
                    </div>
                </div>
            );

            if (!student) return (
                <div className="flex items-center justify-center min-h-screen bg-gray-50">
                    <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm border text-center">
                        <img src="https://sunnykeyz123.github.io/mustardseedschl/images/Logo.png" className="w-16 mx-auto mb-6" />
                        <h2 className="text-2xl font-black mb-6 tracking-tighter uppercase text-slate-800">Candidate Login</h2>
                        <input className="w-full p-4 border rounded-xl mb-4 uppercase outline-none focus:border-blue-600 font-bold text-center" placeholder="MS-XXXXX" onChange={e => setMsId(e.target.value)} />
                        <button onClick={verifyId} className="w-full py-4 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 transition uppercase">{loading ? "Validating..." : "Start Exam"}</button>
                    </div>
                </div>
            );

            if (questions.length === 0) return <div className="p-20 text-center font-black animate-pulse text-blue-600 tracking-widest uppercase">Fetching Questions...</div>;

            return (
                <div className="max-w-2xl mx-auto p-6 pt-12">
                    <div className="flex justify-between items-end mb-8 border-b pb-4">
                        <div>
                            <p className="text-[10px] text-gray-400 font-black uppercase tracking-widest">{student.className} Candidate</p>
                            <h2 className="text-xl font-black uppercase text-slate-800">{student.name}</h2>
                        </div>
                        <div className="bg-blue-600 text-white px-4 py-1 rounded-full font-black text-xs">{index + 1} / {questions.length}</div>
                    </div>
                    <div className="bg-white p-8 rounded-2xl shadow-sm border">
                        <p className="text-xl font-bold mb-8 text-slate-800">{questions[index].questionText}</p>
                        <div className="space-y-3">
                            {questions[index].options.map((opt, i) => (
                                <button key={i} onClick={() => setAnswers({...answers, [index]: i})} className={`w-full p-5 text-left rounded-xl border-2 transition font-medium ${answers[index] === i ? 'bg-blue-600 text-white border-blue-600' : 'bg-white border-gray-100 hover:border-blue-200 text-slate-600'}`}>
                                    <span className="font-black mr-3">{optionLetters[i]}.</span> {opt}
                                </button>
                            ))}
                        </div>
                        <div className="mt-10 flex justify-between items-center">
                            <button onClick={() => setIndex(i => i - 1)} disabled={index === 0} className="text-gray-400 font-black text-xs disabled:opacity-0 uppercase">Prev</button>
                            {index === questions.length - 1 ? 
                                <button onClick={() => finishExam()} className="bg-green-600 text-white px-10 py-3 rounded-xl font-bold shadow-lg uppercase">Submit</button> : 
                                <button onClick={() => setIndex(i => i + 1)} className="bg-blue-600 text-white px-10 py-3 rounded-xl font-bold shadow-lg uppercase">Next</button>
                            }
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [page, setPage] = React.useState('home');
            const [ready, setReady] = React.useState(false);

            React.useEffect(() => {
                const i = setInterval(() => { if(window.fb) { setReady(true); clearInterval(i); }}, 100);
            }, []);

            if (!ready) return <div className="p-20 text-center font-black tracking-widest text-blue-600 uppercase">Connecting Engine...</div>;

            return (
                <AppContext.Provider value={{ setPage }}>
                    {page === 'home' && (
                        <div className="flex flex-col items-center justify-center min-h-screen text-center p-6">
                            <img src="https://sunnykeyz123.github.io/mustardseedschl/images/Logo.png" className="w-24 mb-6" />
                            <h1 className="text-5xl font-black mb-2 tracking-tighter uppercase text-slate-900">Mustard Seed CBT</h1>
                            <p className="text-gray-400 font-bold text-sm mb-10 tracking-widest uppercase italic">Academic Excellence Redefined</p>
                            <div className="flex flex-col sm:flex-row gap-4">
                                <button onClick={() => setPage('exam')} className="bg-blue-600 text-white px-16 py-4 rounded-full font-black shadow-xl hover:scale-105 transition uppercase">Start Exam</button>
                                <button onClick={() => setPage('admin')} className="bg-white text-gray-500 px-16 py-4 rounded-full font-bold border shadow-sm hover:bg-gray-50 transition uppercase">Admin Panel</button>
                            </div>
                        </div>
                    )}
                    {page === 'exam' && <StudentExamPage />}
                    {page === 'admin' && <AdminPage />}
                </AppContext.Provider>
            );
        };
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
