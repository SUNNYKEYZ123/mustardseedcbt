<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="https://sunnykeyz123.github.io/mustardseedschl/images/Logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mustard Seed CBT - Master Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, onSnapshot, query, where, setDoc, updateDoc, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDOO3uHmzOuAxJcdLxu-OImzlH12A6FpeY",
            authDomain: "my-project-a6208.firebaseapp.com",
            projectId: "my-project-a6208",
            storageBucket: "my-project-a6208.firebasestorage.app",
            messagingSenderId: "784486701962",
            appId: "1:784486701962:web:0d3cd002bbfd647e944673"
        };

        const app = initializeApp(firebaseConfig);
        window.fb = {
            db: getFirestore(app),
            collection, addDoc, getDocs, doc, deleteDoc, onSnapshot, query, where, setDoc, updateDoc, writeBatch
        };
    </script>

    <script type="text/babel">
        const { createClient } = window.supabase;
        const SB_URL = 'https://jqrcoqslmylmubxwfgyt.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxcmNvcXNsbXlsbXVieHdmZ3l0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ2ODc2NzgsImV4cCI6MjA4MDI2MzY3OH0.4bXOY35R3eGYZjPxtuJzvwifPEfHXr5UEdzFbB-caKU';
        const _supabase = createClient(SB_URL, SB_KEY);

        const ADMIN_PASSWORD = 'SUNNYKEYZ2025@';
        const CLASSES = ['SSS 1', 'SSS 2', 'SSS 3'];
        const optionLetters = ['A', 'B', 'C', 'D'];

        const AppContext = React.createContext(null);

        const AdminPage = () => {
            const { setPage } = React.useContext(AppContext);
            const [auth, setAuth] = React.useState(false);
            const [pass, setPass] = React.useState('');
            const [activeTab, setActiveTab] = React.useState('dashboard'); 
            const [scores, setScores] = React.useState([]);
            const [questions, setQuestions] = React.useState([]);
            const [examLive, setExamLive] = React.useState(false);
            const [resFilter, setResFilter] = React.useState('ALL');
            const [qFilter, setQFilter] = React.useState('ALL');
            
            const [newQ, setNewQ] = React.useState({ 
                text: '', options: ['', '', '', ''], correct: 0, 
                className: 'SSS 1', type: 'objective', keywords: '', maxMarks: 10 
            });

            React.useEffect(() => {
                if (!auth) return;
                fb.onSnapshot(fb.collection(fb.db, "artifacts/my-project-a6208/scores"), (s) => {
                    setScores(s.docs.map(d => ({id: d.id, ...d.data()})));
                });
                fb.onSnapshot(fb.collection(fb.db, "artifacts/my-project-a6208/public/data/questions"), (s) => {
                    setQuestions(s.docs.map(d => ({id: d.id, ...d.data()})));
                });
                fb.onSnapshot(fb.doc(fb.db, "artifacts/my-project-a6208/settings/examControl"), (doc) => {
                    if (doc.exists()) setExamLive(doc.data().isLive);
                });
            }, [auth]);

            const deleteItem = async (id, type) => {
                if (confirm(`Permanent Action: Are you sure you want to delete this ${type}?`)) {
                    const collectionName = type === 'result' ? "scores" : "public/data/questions";
                    await fb.deleteDoc(fb.doc(fb.db, `artifacts/my-project-a6208/${collectionName}`, id));
                }
            };

            const updateManualScore = async (id, val) => {
                const s = scores.find(x => x.id === id);
                const scoreB = parseInt(val) || 0;
                await fb.updateDoc(fb.doc(fb.db, "artifacts/my-project-a6208/scores", id), {
                    scoreB: scoreB, 
                    percentage: Math.round(((s.scoreA + scoreB) / 70) * 100), 
                    isReviewed: true
                });
                alert("Grading complete.");
            };

            const wipeAllResults = async () => {
                if(confirm("DANGER: This will delete ALL student results. Proceed?")) {
                    const b = fb.writeBatch(fb.db);
                    scores.forEach(s => b.delete(fb.doc(fb.db, "artifacts/my-project-a6208/scores", s.id)));
                    await b.commit();
                }
            };

            if (!auth) return (
                <div className="flex items-center justify-center min-h-screen bg-slate-900">
                    <div className="bg-white p-10 rounded-[2.5rem] w-full max-w-sm text-center shadow-2xl">
                        <img src="https://sunnykeyz123.github.io/mustardseedschl/images/Logo.png" className="w-16 mx-auto mb-6" />
                        <h2 className="text-xl font-black mb-6 uppercase tracking-tight text-slate-800">Admin Portal</h2>
                        <input type="password" placeholder="Enter Password" className="w-full p-4 border-none bg-slate-100 rounded-2xl mb-4 text-center outline-none focus:ring-2 focus:ring-blue-600 font-bold" onChange={e => setPass(e.target.value)} />
                        <button onClick={() => pass === ADMIN_PASSWORD ? setAuth(true) : alert("Access Denied")} className="w-full bg-blue-600 text-white py-4 rounded-2xl font-black shadow-lg shadow-blue-200">LOGIN</button>
                    </div>
                </div>
            );

            return (
                <div className="flex min-h-screen bg-gray-50">
                    <aside className="w-64 bg-slate-900 text-white p-6 fixed h-full shadow-2xl z-50">
                        <div className="mb-10 text-center">
                            <img src="https://sunnykeyz123.github.io/mustardseedschl/images/Logo.png" className="w-12 mx-auto mb-2" />
                            <h1 className="text-[10px] font-black text-blue-400 tracking-[0.3em] uppercase">Mustard Seed</h1>
                        </div>
                        <nav className="space-y-1">
                            {['dashboard', 'questions', 'bank', 'review', 'results'].map(tab => (
                                <button key={tab} onClick={()=>setActiveTab(tab)} className={`w-full text-left px-5 py-4 rounded-2xl font-black text-[11px] uppercase tracking-tighter transition-all ${activeTab===tab?'bg-blue-600 shadow-xl shadow-blue-900/40 text-white':'text-slate-400 hover:bg-slate-800'}`}>
                                    {tab}
                                </button>
                            ))}
                        </nav>
                        <button onClick={()=>setPage('home')} className="mt-20 block w-full text-center text-slate-600 text-[10px] font-black uppercase hover:text-white transition">← Log Out</button>
                    </aside>

                    <main className="flex-1 ml-64 p-10">
                        {activeTab === 'dashboard' && (
                            <div className="grid grid-cols-3 gap-8">
                                <div className="bg-white p-8 rounded-[2rem] border shadow-sm">
                                    <p className="text-[10px] font-black text-slate-400 uppercase mb-2">Portal Status</p>
                                    <h3 className={`text-3xl font-black ${examLive?'text-green-500':'text-red-500'}`}>{examLive?'LIVE':'CLOSED'}</h3>
                                    <button onClick={async()=>await fb.setDoc(fb.doc(fb.db,"artifacts/my-project-a6208/settings/examControl"),{isLive:!examLive})} className="mt-4 w-full bg-slate-900 text-white py-3 rounded-xl text-[10px] font-black uppercase tracking-widest">Toggle Exam</button>
                                </div>
                                <div className="bg-white p-8 rounded-[2rem] border shadow-sm text-center">
                                    <p className="text-[10px] font-black text-slate-400 uppercase mb-2">Student Entries</p>
                                    <h3 className="text-4xl font-black">{scores.length}</h3>
                                </div>
                                <div className="bg-white p-8 rounded-[2rem] border shadow-sm text-center">
                                    <p className="text-[10px] font-black text-slate-400 uppercase mb-2">Total Questions</p>
                                    <h3 className="text-4xl font-black text-blue-600">{questions.length}</h3>
                                </div>
                            </div>
                        )}

                        {activeTab === 'questions' && (
                            <div className="max-w-xl mx-auto bg-white p-10 rounded-[2.5rem] shadow-xl border">
                                <div className="flex gap-2 mb-8 bg-slate-100 p-1.5 rounded-2xl">
                                    <button onClick={()=>setNewQ({...newQ, type: 'objective'})} className={`flex-1 py-3 rounded-xl font-black text-[10px] ${newQ.type === 'objective' ? 'bg-white shadow-sm text-blue-600':'text-slate-400'}`}>SECTION A (OBJ)</button>
                                    <button onClick={()=>setNewQ({...newQ, type: 'theory'})} className={`flex-1 py-3 rounded-xl font-black text-[10px] ${newQ.type === 'theory' ? 'bg-white shadow-sm text-blue-600':'text-slate-400'}`}>SECTION B (THEORY)</button>
                                </div>
                                <textarea className="w-full p-6 border-none rounded-3xl mb-4 bg-slate-50 font-bold h-32 outline-none focus:ring-2 focus:ring-blue-100" placeholder="Type question here..." value={newQ.text} onChange={e=>setNewQ({...newQ, text:e.target.value})} />
                                {newQ.type === 'objective' ? (
                                    <div className="space-y-3 mb-6">
                                        {newQ.options.map((o,i)=>(
                                            <div key={i} className="flex items-center gap-3">
                                                <span className="font-black text-blue-600 w-5">{optionLetters[i]}</span>
                                                <input className="flex-1 p-3 border rounded-xl bg-slate-50 font-bold outline-none" placeholder={`Option ${optionLetters[i]}`} value={o} onChange={e=>{let c=[...newQ.options];c[i]=e.target.value;setNewQ({...newQ,options:c})}} />
                                            </div>
                                        ))}
                                        <select className="w-full mt-6 p-4 border-none rounded-2xl font-black text-green-600 bg-green-50 outline-none ring-2 ring-green-100" value={newQ.correct} onChange={e=>setNewQ({...newQ,correct:parseInt(e.target.value)})}>
                                            {optionLetters.map((l,i)=><option key={i} value={i}>Mark Correct: {l}</option>)}
                                        </select>
                                    </div>
                                ) : (
                                    <div className="flex gap-4 mb-8">
                                        <div className="flex-[3]">
                                            <p className="text-[10px] font-black text-slate-400 uppercase mb-2 ml-2">Keywords (Auto-Grading)</p>
                                            <input className="w-full p-4 border rounded-2xl bg-blue-50 font-bold text-sm outline-none" placeholder="Separate with commas..." value={newQ.keywords} onChange={e=>setNewQ({...newQ, keywords: e.target.value})} />
                                        </div>
                                        <div className="flex-1 text-center">
                                            <p className="text-[10px] font-black text-slate-400 uppercase mb-2">Mark</p>
                                            <input type="number" className="w-full p-4 border-2 border-blue-600 rounded-2xl bg-white font-black text-center text-blue-600" value={newQ.maxMarks} onChange={e=>setNewQ({...newQ, maxMarks: parseInt(e.target.value) || 0})} />
                                        </div>
                                    </div>
                                )}
                                <select className="w-full p-4 border-none rounded-2xl font-black mb-10 bg-slate-900 text-white text-xs uppercase outline-none" value={newQ.className} onChange={e=>setNewQ({...newQ, className: e.target.value})}>
                                    {CLASSES.map(c => <option key={c} value={c}>{c}</option>)}
                                </select>
                                <button onClick={async()=>{
                                    if(!newQ.text) return alert("Empty fields!");
                                    await fb.addDoc(fb.collection(fb.db, "artifacts/my-project-a6208/public/data/questions"), { ...newQ, correctOptionIndex: parseInt(newQ.correct), date: new Date() });
                                    setNewQ({ ...newQ, text: '', options: ['', '', '', ''], keywords: '', maxMarks: 10 });
                                    alert("Added to Bank.");
                                }} className="w-full bg-blue-600 text-white py-5 rounded-3xl font-black shadow-xl">SAVE QUESTION</button>
                            </div>
                        )}

                        {activeTab === 'bank' && (
                            <div>
                                <select value={qFilter} onChange={e=>setQFilter(e.target.value)} className="p-3 border rounded-xl font-black text-xs uppercase bg-white mb-8 outline-none">
                                    <option value="ALL">Show All Classes</option>
                                    {CLASSES.map(c => <option key={c} value={c}>{c}</option>)}
                                </select>
                                <div className="grid grid-cols-2 gap-6">
                                    {questions.filter(q => qFilter === 'ALL' || q.className === qFilter).map(q => (
                                        <div key={q.id} className="bg-white p-8 rounded-[2rem] border shadow-sm relative group">
                                            <button onClick={()=>deleteItem(q.id, 'question')} className="absolute top-6 right-6 text-red-100 group-hover:text-red-500 transition-all font-black text-[9px] uppercase border border-transparent group-hover:border-red-500 px-3 py-1 rounded-full">Delete Question</button>
                                            <div className="flex gap-2 mb-4">
                                                <span className="bg-slate-100 text-[9px] font-black px-3 py-1 rounded-full text-slate-600 uppercase">{q.className}</span>
                                                <span className="bg-blue-50 text-blue-500 text-[9px] font-black px-3 py-1 rounded-full uppercase">{q.type}</span>
                                            </div>
                                            <p className="font-bold text-slate-800 leading-snug">{q.text}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'review' && (
                            <div className="space-y-6">
                                {scores.filter(s => !s.isReviewed && s.theoryAnswers?.length > 0).map(s => (
                                    <div key={s.id} className="bg-white p-10 rounded-[2.5rem] border shadow-sm">
                                        <h3 className="font-black text-2xl uppercase mb-1">{s.studentName}</h3>
                                        <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-8 border-b pb-4">{s.className} | OBJ: {s.scoreA}/30</p>
                                        <div className="space-y-4 mb-8">
                                            {s.theoryAnswers.map((ans, i) => (
                                                <div key={i} className="bg-slate-50 p-6 rounded-3xl border-l-4 border-blue-500">
                                                    <p className="text-[10px] font-black text-slate-400 uppercase mb-2">Answer Provided:</p>
                                                    <p className="font-bold text-slate-700 italic">"{ans.studentText || 'Empty'}"</p>
                                                    <div className="mt-4 flex gap-2">
                                                        <span className="text-[9px] font-black bg-green-100 text-green-600 px-3 py-1 rounded-full">Suggested Mark: {ans.autoMark}</span>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                        <div className="flex items-center gap-4 bg-slate-900 p-6 rounded-3xl">
                                            <p className="text-white font-black uppercase text-[10px] flex-1">Final Theory Total (Max 40):</p>
                                            <input type="number" className="w-24 p-3 rounded-xl bg-white/10 text-white font-black text-center text-xl outline-none" onBlur={(e)=>updateManualScore(s.id, e.target.value)} />
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {activeTab === 'results' && (
                            <div className="space-y-6">
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-xl font-black uppercase tracking-tight">Student Performance</h2>
                                    <div className="flex gap-4">
                                        <select value={resFilter} onChange={e=>setResFilter(e.target.value)} className="p-3 border rounded-xl font-black text-xs uppercase bg-white">
                                            <option value="ALL">Filter Class</option>
                                            {CLASSES.map(c => <option key={c} value={c}>{c}</option>)}
                                        </select>
                                        <button onClick={wipeAllResults} className="bg-red-600 text-white px-6 py-3 rounded-xl font-black text-[10px] uppercase shadow-lg shadow-red-100">Wipe Database</button>
                                    </div>
                                </div>
                                <div className="bg-white rounded-[2.5rem] shadow-sm border overflow-hidden">
                                    <table className="w-full text-left">
                                        <thead className="bg-slate-900 text-white text-[10px] font-black uppercase tracking-widest">
                                            <tr>
                                                <th className="p-6">ID</th>
                                                <th>Name</th>
                                                <th>Class</th>
                                                <th>OBJ</th>
                                                <th>Theory</th>
                                                <th>Total</th>
                                                <th className="p-6 text-center">Action</th>
                                            </tr>
                                        </thead>
                                        <tbody className="text-sm font-bold">
                                            {scores.filter(s => resFilter === 'ALL' || s.className === resFilter).map(s => (
                                                <tr key={s.id} className="border-b hover:bg-slate-50 transition">
                                                    <td className="p-6 font-mono text-blue-500 text-xs">{s.studentId}</td>
                                                    <td className="uppercase">{s.studentName}</td>
                                                    <td className="text-slate-400">{s.className}</td>
                                                    <td className="text-blue-600">{s.scoreA}</td>
                                                    <td className="text-green-600">{s.scoreB}</td>
                                                    <td className="font-black">{s.percentage}%</td>
                                                    <td className="p-6 text-center">
                                                        <button onClick={()=>deleteItem(s.id, 'result')} className="bg-red-50 text-red-500 text-[10px] font-black px-4 py-2 rounded-full hover:bg-red-500 hover:text-white transition">Delete</button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const StudentExamPage = () => {
            const { setPage } = React.useContext(AppContext);
            const [student, setStudent] = React.useState(null);
            const [questions, setQuestions] = React.useState([]);
            const [index, setIndex] = React.useState(0);
            const [answers, setAnswers] = React.useState({});
            const [finished, setFinished] = React.useState(false);

            const verifyId = async (id) => {
                const inputId = id.toUpperCase().trim();
                const { data } = await _supabase.from('students').select('*').eq('status', 'Enrolled');
                const found = data?.find(s => ("MS-" + s.id.substring(0, 5).toUpperCase()) === inputId);
                if (found) {
                    setStudent({ name: found.full_name, id: inputId, className: found.grade_level });
                    const qSnap = await fb.getDocs(fb.query(fb.collection(fb.db, "artifacts/my-project-a6208/public/data/questions"), fb.where("className", "==", found.grade_level)));
                    setQuestions(qSnap.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => a.type === 'theory' ? 1 : -1));
                } else alert("Invalid Exam ID");
            };

            const finishExam = async () => {
                if (!confirm("Are you sure you want to submit?")) return;
                let objRaw = 0, objTotal = 0;
                const theoryData = [];

                questions.forEach((q, i) => {
                    const ans = answers[i];
                    if (q.type === 'theory') {
                        const keys = q.keywords?.split(',').map(k => k.trim().toLowerCase()) || [];
                        const match = ans ? keys.filter(k => ans.toLowerCase().includes(k)).length : 0;
                        const mark = keys.length > 0 ? Math.round((q.maxMarks || 10) * (match / keys.length)) : 0;
                        theoryData.push({ studentText: ans || '', autoMark: mark, maxMarks: q.maxMarks });
                    } else {
                        objTotal++;
                        if (ans === q.correctOptionIndex) objRaw++;
                    }
                });

                await fb.addDoc(fb.collection(fb.db, "artifacts/my-project-a6208/scores"), {
                    studentName: student.name, studentId: student.id, className: student.className,
                    scoreA: objTotal > 0 ? Math.round((objRaw/objTotal)*30) : 0, scoreB: 0, 
                    percentage: 0, isReviewed: false, theoryAnswers: theoryData, date: new Date()
                });
                setFinished(true);
            };

            if (finished) return <div className="flex items-center justify-center min-h-screen font-black text-3xl text-green-600 bg-white">EXAM SUBMITTED!</div>;
            if (!student) return (
                <div className="flex items-center justify-center min-h-screen bg-gray-50 p-6">
                    <div className="bg-white p-10 rounded-[2.5rem] shadow-xl w-full max-w-sm text-center border">
                        <img src="https://sunnykeyz123.github.io/mustardseedschl/images/Logo.png" className="w-16 mx-auto mb-8" />
                        <h2 className="text-2xl font-black mb-8 uppercase tracking-tighter">Exam Entry</h2>
                        <input className="w-full p-5 border-none bg-slate-100 rounded-2xl mb-6 uppercase text-center font-black text-xl outline-none focus:ring-2 focus:ring-blue-600" placeholder="MS-XXXXX" onBlur={e => verifyId(e.target.value)} />
                        <p className="text-[10px] font-bold text-slate-400">Enter your ID exactly as shown on your portal</p>
                    </div>
                </div>
            );

            const q = questions[index];
            if (!q) return <div className="p-20 text-center font-black">QUESTIONS NOT LOADED</div>;

            return (
                <div className="max-w-2xl mx-auto p-6 pt-12">
                    <div className="flex justify-between items-end mb-8 border-b pb-4">
                        <h2 className="text-xl font-black uppercase text-slate-800">{student.name}</h2>
                        <div className="bg-blue-600 text-white px-5 py-1.5 rounded-full font-black text-sm">{index + 1} / {questions.length}</div>
                    </div>
                    <div className="bg-white p-10 rounded-[2.5rem] shadow-sm border">
                        <p className="text-[10px] font-black text-blue-500 uppercase mb-4 tracking-widest">{q.type === 'theory' ? 'Theory Section' : 'Objective Section'}</p>
                        <p className="text-xl font-bold mb-10 text-slate-800 leading-relaxed">{q.text}</p>
                        <div className="space-y-3">
                            {q.type === 'theory' ? (
                                <textarea className="w-full p-8 bg-slate-50 border-2 border-slate-100 rounded-3xl h-56 outline-none focus:border-blue-600 font-bold transition-all text-lg" placeholder="Start typing..." value={answers[index] || ''} onChange={e => setAnswers({...answers, [index]: e.target.value})} />
                            ) : (
                                q.options.map((opt, i) => (
                                    <button key={i} onClick={() => setAnswers({...answers, [index]: i})} 
                                        className={`w-full p-6 text-left rounded-2xl border-2 transition-all font-bold flex items-center ${answers[index] === i ? 'bg-blue-600 text-white border-blue-600 shadow-xl' : 'bg-white border-slate-100 text-slate-600 hover:border-blue-200'}`}>
                                        <span className={`w-8 h-8 flex items-center justify-center rounded-full mr-5 text-xs font-black ${answers[index] === i ? 'bg-white/20 text-white' : 'bg-slate-100 text-slate-400'}`}>{optionLetters[i]}</span>
                                        {opt}
                                    </button>
                                ))
                            )}
                        </div>
                        <div className="mt-16 flex justify-between items-center">
                            <button onClick={() => setIndex(i => i - 1)} disabled={index === 0} className="text-slate-400 font-black uppercase text-xs disabled:opacity-0">Back</button>
                            {index === questions.length - 1 ? (
                                <button onClick={finishExam} className="bg-green-600 text-white px-16 py-5 rounded-2xl font-black shadow-xl shadow-green-100 uppercase text-xs">Finish</button>
                            ) : (
                                <button onClick={() => setIndex(i => i + 1)} className="bg-blue-600 text-white px-16 py-5 rounded-2xl font-black shadow-xl uppercase text-xs">Next</button>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [page, setPage] = React.useState('home');
            return (
                <AppContext.Provider value={{ setPage }}>
                    {page === 'home' && (
                        <div className="flex flex-col items-center justify-center min-h-screen text-center bg-white p-6">
                            <img src="https://sunnykeyz123.github.io/mustardseedschl/images/Logo.png" className="w-24 mb-10" />
                            <h1 className="text-6xl font-black mb-2 tracking-tighter uppercase text-slate-900">Mustard Seed</h1>
                            <p className="text-slate-400 font-bold text-sm tracking-[0.5em] uppercase mb-20">Advanced CBT Portal</p>
                            <div className="flex flex-col sm:flex-row gap-4 w-full max-w-md">
                                <button onClick={() => setPage('exam')} className="flex-1 bg-blue-600 text-white py-6 rounded-full font-black shadow-2xl shadow-blue-100 uppercase tracking-widest text-xs">Start Exam</button>
                                <button onClick={() => setPage('admin')} className="flex-1 bg-white text-slate-400 py-6 rounded-full font-black border-2 hover:bg-slate-50 uppercase tracking-widest text-xs">Admin</button>
                            </div>
                        </div>
                    )}
                    {page === 'exam' && <StudentExamPage />}
                    {page === 'admin' && <AdminPage />}
                </AppContext.Provider>
            );
        };
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
