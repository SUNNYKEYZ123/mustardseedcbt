<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="https://sunnykeyz123.github.io/mustardseedschl/images/Logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mustard Seed CBT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .custom-modal-overlay { background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, onSnapshot, query, where, setDoc, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDOO3uHmzOuAxJcdLxu-OImzlH12A6FpeY",
            authDomain: "my-project-a6208.firebaseapp.com",
            projectId: "my-project-a6208",
            storageBucket: "my-project-a6208.firebasestorage.app",
            messagingSenderId: "784486701962",
            appId: "1:784486701962:web:0d3cd002bbfd647e944673"
        };

        const app = initializeApp(firebaseConfig);
        window.fb = {
            db: getFirestore(app),
            auth: getAuth(app),
            collection, addDoc, getDocs, doc, deleteDoc, onSnapshot, query, where, signInAnonymously, onAuthStateChanged, setDoc, writeBatch
        };
    </script>

    <script type="text/babel">
        const { createClient } = window.supabase;
        const SB_URL = 'https://jqrcoqslmylmubxwfgyt.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxcmNvcXNsbXlsbXVieHdmZ3l0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ2ODc2NzgsImV4cCI6MjA4MDI2MzY3OH0.4bXOY35R3eGYZjPxtuJzvwifPEfHXr5UEdzFbB-caKU';
        const _supabase = createClient(SB_URL, SB_KEY);

        const AppContext = React.createContext(null);
        const ADMIN_PASSWORD = 'SUNNYKEYZ2025@';
        const optionLetters = ['A', 'B', 'C', 'D'];
        const GRADE_LEVELS = ['JSS 1', 'JSS 2', 'JSS 3', 'SSS 1', 'SSS 2', 'SSS 3'];

        const CustomModal = ({ title, message, onConfirm, onCancel, confirmText = "Confirm" }) => (
            <div className="fixed inset-0 z-50 flex items-center justify-center custom-modal-overlay p-4">
                <div className="bg-white rounded-3xl p-8 max-w-sm w-full shadow-2xl text-center">
                    <h3 className="text-xl font-black mb-2 uppercase">{title}</h3>
                    <p className="text-gray-500 font-medium mb-6">{message}</p>
                    <div className="flex gap-3">
                        {onCancel && <button onClick={onCancel} className="flex-1 py-3 font-bold border rounded-xl hover:bg-gray-50">Cancel</button>}
                        <button onClick={onConfirm} className="flex-1 py-3 font-bold bg-blue-600 text-white rounded-xl hover:bg-blue-700">{confirmText}</button>
                    </div>
                </div>
            </div>
        );

        // --- ADMIN PAGE (No Changes Needed) ---
        const AdminPage = () => {
            const { setPage } = React.useContext(AppContext);
            const [auth, setAuth] = React.useState(false);
            const [pass, setPass] = React.useState('');
            const [activeTab, setActiveTab] = React.useState('dashboard'); 
            const [modal, setModal] = React.useState(null);
            const [scores, setScores] = React.useState([]);
            const [questions, setQuestions] = React.useState([]);
            const [examLive, setExamLive] = React.useState(false);
            const [newQ, setNewQ] = React.useState({ text: '', options: ['', '', '', ''], correct: 0, grade_level: 'SSS 1' });
            const [classFilter, setClassFilter] = React.useState('ALL');
            const [qFilter, setQFilter] = React.useState('ALL');

            React.useEffect(() => {
                if (!auth) return;
                const unsub1 = fb.onSnapshot(fb.collection(fb.db, "artifacts/my-project-a6208/scores"), (s) => {
                    setScores(s.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => (b.date?.seconds || 0) - (a.date?.seconds || 0)));
                });
                const unsub2 = fb.onSnapshot(fb.collection(fb.db, "artifacts/my-project-a6208/public/data/questions"), (s) => {
                    setQuestions(s.docs.map(d => ({id: d.id, ...d.data()})));
                });
                const unsub3 = fb.onSnapshot(fb.doc(fb.db, "artifacts/my-project-a6208/settings/examControl"), (doc) => {
                    if (doc.exists()) setExamLive(doc.data().isLive);
                });
                return () => { unsub1(); unsub2(); unsub3(); };
            }, [auth]);

            const handleAddQuestion = async () => {
                if(!newQ.text) return setModal({ title: "Error", message: "Enter question text!", onConfirm: () => setModal(null) });
                await fb.addDoc(fb.collection(fb.db, "artifacts/my-project-a6208/public/data/questions"), {
                    questionText: newQ.text, options: newQ.options, correctOptionIndex: parseInt(newQ.correct), grade_level: newQ.grade_level
                });
                setNewQ({ ...newQ, text: '', options: ['', '', '', ''], correct: 0 });
                setModal({ title: "Success", message: "Question saved.", onConfirm: () => setModal(null) });
            };

            const filteredScores = classFilter === 'ALL' ? scores : scores.filter(s => s.grade_level === classFilter);
            const filteredQuestions = qFilter === 'ALL' ? questions : questions.filter(q => q.grade_level === qFilter);

            if (!auth) return (
                <div className="flex items-center justify-center min-h-screen bg-gray-100 p-6">
                    <div className="bg-white p-10 rounded-3xl shadow-2xl border w-full max-sm text-center">
                        <img src="https://sunnykeyz123.github.io/mustardseedschl/images/Logo.png" className="w-16 mx-auto mb-6" alt="logo" />
                        <h2 className="text-2xl font-black mb-6 uppercase">Admin Panel</h2>
                        <input type="password" placeholder="••••••••" className="w-full p-4 border rounded-xl mb-4 text-center" onChange={e => setPass(e.target.value)} />
                        <button onClick={() => pass === ADMIN_PASSWORD ? setAuth(true) : alert("Wrong Password")} className="w-full bg-blue-600 text-white py-4 rounded-xl font-bold">LOGIN</button>
                    </div>
                </div>
            );

            return (
                <div className="flex min-h-screen bg-gray-50">
                    {modal && <CustomModal {...modal} />}
                    <aside className="w-64 bg-slate-900 text-white flex flex-col p-6 fixed h-full">
                        <div className="flex items-center gap-3 mb-10"><img src="https://sunnykeyz123.github.io/mustardseedschl/images/Logo.png" className="w-8" /><h1 className="text-lg font-black text-blue-400">ADMIN</h1></div>
                        <nav className="space-y-2 flex-1">
                            <button onClick={()=>setActiveTab('dashboard')} className={`w-full text-left p-4 rounded-xl font-bold ${activeTab==='dashboard'?'bg-blue-600':'text-gray-400'}`}>📊 Dashboard</button>
                            <button onClick={()=>setActiveTab('questions')} className={`w-full text-left p-4 rounded-xl font-bold ${activeTab==='questions'?'bg-blue-600':'text-gray-400'}`}>📝 Question Bank</button>
                            <button onClick={()=>setActiveTab('results')} className={`w-full text-left p-4 rounded-xl font-bold ${activeTab==='results'?'bg-blue-600':'text-gray-400'}`}>🏆 Results</button>
                        </nav>
                        <button onClick={()=>setPage('home')} className="mt-10 text-gray-500 text-xs font-bold">← Logout</button>
                    </aside>
                    <main className="flex-1 ml-64 p-12">
                        {activeTab === 'results' && (
                            <div className="bg-white rounded-3xl shadow-sm border overflow-hidden">
                                <table className="w-full text-left">
                                    <thead className="bg-slate-50 border-b"><tr><th className="p-5 text-xs font-black uppercase text-gray-400">Student</th><th className="p-5 text-xs font-black uppercase text-gray-400">Class</th><th className="p-5 text-xs font-black uppercase text-gray-400">Score</th><th className="p-5 text-right">Action</th></tr></thead>
                                    <tbody>{filteredScores.map(s => (<tr key={s.id} className="border-b font-bold text-sm"><td className="p-5">{s.studentName}<br/><span className="text-[10px] text-gray-400 font-mono">{s.studentId}</span></td><td className="p-5">{s.grade_level}</td><td className="p-5">{s.score}%</td><td className="p-5 text-right"><button onClick={() => fb.deleteDoc(fb.doc(fb.db, "artifacts/my-project-a6208/scores", s.id))} className="text-red-400">Del</button></td></tr>))}</tbody>
                                </table>
                            </div>
                        )}
                        {activeTab === 'questions' && (
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-10">
                                <section className="bg-white p-8 rounded-3xl border h-fit sticky top-10">
                                    <textarea className="w-full p-4 border rounded-2xl mb-4 bg-gray-50 h-32" placeholder="Question Text..." value={newQ.text} onChange={e=>setNewQ({...newQ, text:e.target.value})} />
                                    <div className="grid grid-cols-2 gap-3 mb-6">{newQ.options.map((o,i)=>(<input key={i} className="p-3 border rounded-xl" placeholder={`Option ${optionLetters[i]}`} value={o} onChange={e=>{let c=[...newQ.options];c[i]=e.target.value;setNewQ({...newQ,options:c})}} />))}</div>
                                    <div className="grid grid-cols-2 gap-3 mb-6">
                                        <select className="p-3 border rounded-xl font-bold" value={newQ.correct} onChange={e=>setNewQ({...newQ,correct:e.target.value})}>{optionLetters.map((l,i)=><option key={i} value={i}>Correct: {l}</option>)}</select>
                                        <select className="p-3 border rounded-xl font-bold" value={newQ.grade_level} onChange={e=>setNewQ({...newQ, grade_level: e.target.value})}>{GRADE_LEVELS.map(g => <option key={g} value={g}>{g}</option>)}</select>
                                    </div>
                                    <button onClick={handleAddQuestion} className="w-full bg-blue-600 text-white py-4 rounded-2xl font-black">SAVE QUESTION</button>
                                </section>
                                <section className="space-y-4">
                                    {filteredQuestions.map((q)=>(<div key={q.id} className="bg-white p-5 rounded-2xl border flex justify-between shadow-sm"><div className="text-sm font-bold"><span className="bg-blue-100 text-blue-600 px-2 py-0.5 rounded text-[10px] mr-3">{q.grade_level}</span>{q.questionText}</div><button onClick={() => fb.deleteDoc(fb.doc(fb.db,"artifacts/my-project-a6208/public/data/questions",q.id))} className="text-red-400">Del</button></div>))}
                                </section>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        // --- STUDENT PAGE (The Fix is here!) ---
        const StudentExamPage = () => {
            const { setPage } = React.useContext(AppContext);
            const [isLive, setIsLive] = React.useState(null);
            const [msId, setMsId] = React.useState('');
            const [student, setStudent] = React.useState(null);
            const [questions, setQuestions] = React.useState([]);
            const [index, setIndex] = React.useState(0);
            const [answers, setAnswers] = React.useState({});
            const [loading, setLoading] = React.useState(false);
            const [finished, setFinished] = React.useState(false);
            const [finalScore, setFinalScore] = React.useState(0);
            const [modal, setModal] = React.useState(null);

            React.useEffect(() => {
                return fb.onSnapshot(fb.doc(fb.db, "artifacts/my-project-a6208/settings/examControl"), (doc) => setIsLive(doc.exists() ? doc.data().isLive : false));
            }, []);

            const verifyId = async () => {
                setLoading(true);
                const inputId = msId.toUpperCase().trim();
                try {
                    // 1. Find the student in Supabase
                    const { data } = await _supabase.from('students').select('*').eq('status', 'Enrolled');
                    const found = data?.find(s => ("MS-" + s.id.substring(0, 5).toUpperCase()) === inputId);
                    
                    if (found) {
                        // 2. Check if already submitted in Firebase
                        const scoreSnap = await fb.getDocs(fb.query(fb.collection(fb.db, "artifacts/my-project-a6208/scores"), fb.where("studentId", "==", inputId)));
                        if (!scoreSnap.empty) { 
                            setModal({title: "Already Taken", message: "You have already submitted this exam.", onConfirm: () => setModal(null)}); 
                            setLoading(false); return; 
                        }
                        
                        setStudent({ name: found.full_name, id: inputId, grade_level: found.grade_level });
                        
                        // 3. HYBRID QUESTION FETCHING (Fixed)
                        const qSnap = await fb.getDocs(fb.collection(fb.db, "artifacts/my-project-a6208/public/data/questions"));
                        const allQuestions = qSnap.docs.map(d => ({id: d.id, ...d.data()}));
                        
                        // Filter questions for this student's class, or show all if no class is set
                        const classQuestions = allQuestions.filter(q => !q.grade_level || q.grade_level === found.grade_level);
                        
                        if(classQuestions.length === 0) {
                            setModal({title: "No Exam", message: "No questions available for " + found.grade_level + ".", onConfirm: () => setModal(null)});
                        } else {
                            setQuestions(classQuestions);
                        }
                    } else {
                        setModal({title: "Invalid ID", message: "Student ID not found.", onConfirm: () => setModal(null)});
                    }
                } catch (e) { alert(e.message); }
                setLoading(false);
            };

            const handleSubmit = async () => {
                let correctCount = 0;
                questions.forEach((q, i) => { if (answers[i] === q.correctOptionIndex) correctCount++; });
                const pct = Math.round((correctCount / questions.length) * 100);
                setFinalScore(pct);
                await fb.addDoc(fb.collection(fb.db, "artifacts/my-project-a6208/scores"), {
                    studentName: student.name, studentId: student.id, grade_level: student.grade_level,
                    score: pct, correctAnswers: correctCount, totalQuestions: questions.length, date: new Date()
                });
                setFinished(true);
            };

            if (finished) return (
                <div className="flex flex-col items-center justify-center min-h-screen p-6 bg-slate-50">
                    <div className="bg-white p-12 rounded-3xl shadow-2xl border w-full max-w-sm text-center">
                        <h2 className="text-3xl font-black mb-8">SCORE: {finalScore}%</h2>
                        <button onClick={() => setPage('home')} className="w-full py-4 bg-black text-white rounded-xl font-bold">LOGOUT</button>
                    </div>
                </div>
            );

            if (!student) return (
                <div className="flex flex-col items-center justify-center min-h-screen bg-white">
                    {modal && <CustomModal {...modal} />}
                    <img src="https://sunnykeyz123.github.io/mustardseedschl/images/Logo.png" className="w-20 mb-10" />
                    <div className="bg-gray-50 p-10 rounded-3xl w-full max-w-sm border text-center">
                        <h2 className="text-2xl font-black mb-6 uppercase">Student Login</h2>
                        <input className="w-full p-5 border-2 rounded-2xl mb-5 text-center font-bold uppercase text-lg" placeholder="MS-XXXXX" onChange={e => setMsId(e.target.value)} />
                        <button onClick={verifyId} className="w-full py-5 bg-blue-600 text-white rounded-2xl font-black uppercase">{loading ? "Wait..." : "Login"}</button>
                    </div>
                </div>
            );

            return (
                <div className="max-w-3xl mx-auto p-6 pt-12">
                    <div className="flex justify-between items-center mb-10">
                        <div><p className="text-xs font-black text-blue-600 uppercase">{student.grade_level}</p><h2 className="text-xl font-black uppercase">{student.name}</h2></div>
                        <div className="bg-slate-900 text-white px-6 py-2 rounded-full font-black">Q {index + 1} / {questions.length}</div>
                    </div>
                    <div className="bg-white p-10 rounded-[40px] shadow-sm border">
                        <p className="text-2xl font-bold mb-10 leading-tight">{questions[index].questionText}</p>
                        <div className="space-y-4">
                            {questions[index].options.map((opt, i) => (
                                <button key={i} onClick={() => setAnswers({...answers, [index]: i})} className={`w-full p-6 text-left rounded-2xl border-2 font-bold ${answers[index] === i ? 'bg-blue-600 text-white' : 'bg-gray-50 hover:bg-gray-100'}`}>
                                    {optionLetters[i]}. {opt}
                                </button>
                            ))}
                        </div>
                        <div className="mt-12 flex justify-between">
                            <button onClick={() => setIndex(i => i - 1)} disabled={index === 0} className="px-8 font-black text-gray-300 disabled:opacity-0">BACK</button>
                            {index === questions.length - 1 
                                ? <button onClick={handleSubmit} className="bg-green-600 text-white px-12 py-4 rounded-2xl font-black">SUBMIT</button> 
                                : <button onClick={() => setIndex(i => i + 1)} className="bg-blue-600 text-white px-12 py-4 rounded-2xl font-black">NEXT</button>}
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [page, setPage] = React.useState('home');
            const [ready, setReady] = React.useState(false);
            React.useEffect(() => { const i = setInterval(() => { if(window.fb) { setReady(true); clearInterval(i); }}, 100); }, []);
            if (!ready) return <div className="flex items-center justify-center min-h-screen font-black text-gray-400">CONNECTING...</div>;
            return (
                <AppContext.Provider value={{ setPage }}>
                    {page === 'home' && (
                        <div className="flex flex-col items-center justify-center min-h-screen text-center">
                            <img src="https://sunnykeyz123.github.io/mustardseedschl/images/Logo.png" className="w-24 mb-10" />
                            <h1 className="text-5xl font-black mb-10">MUSTARD SEED CBT</h1>
                            <div className="flex gap-4 w-full max-w-sm">
                                <button onClick={() => setPage('exam')} className="flex-1 bg-blue-600 text-white py-5 rounded-3xl font-black shadow-2xl">TAKE EXAM</button>
                                <button onClick={() => setPage('admin')} className="flex-1 bg-white text-gray-400 border py-5 rounded-3xl font-black">ADMIN</button>
                            </div>
                        </div>
                    )}
                    {page === 'exam' && <StudentExamPage />}
                    {page === 'admin' && <AdminPage />}
                </AppContext.Provider>
            );
        };
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
