        const StudentExamPage = () => {
            const { setPage } = React.useContext(AppContext);
            const [student, setStudent] = React.useState(null);
            const [questions, setQuestions] = React.useState([]);
            const [index, setIndex] = React.useState(0);
            const [answers, setAnswers] = React.useState({});
            const [finished, setFinished] = React.useState(false);
            const [msId, setMsId] = React.useState('');
            const [loading, setLoading] = React.useState(false);

            const verifyId = async () => {
                if (!msId) return alert("Please enter your Student ID");
                setLoading(true);
                const inputId = msId.toUpperCase().trim();
                
                try {
                    const { data, error } = await _supabase.from('students').select('*').eq('status', 'Enrolled');
                    if (error) throw error;

                    const found = data?.find(s => {
                        const dbId = s.id.toString().toUpperCase();
                        return ("MS-" + dbId.substring(0, 5)) === inputId || ("MS-" + dbId) === inputId;
                    });

                    if (found) {
                        const scoreCheck = await fb.getDocs(fb.query(fb.collection(fb.db, "artifacts/my-project-a6208/scores"), fb.where("studentId", "==", inputId)));
                        if (!scoreCheck.empty) { alert("Already submitted."); setLoading(false); return; }

                        const sClass = found.grade_level || found.class || 'SSS 1';
                        setStudent({ name: found.full_name, id: inputId, className: sClass });

                        const qSnap = await fb.getDocs(fb.query(fb.collection(fb.db, "artifacts/my-project-a6208/public/data/questions"), fb.where("className", "==", sClass)));
                        setQuestions(qSnap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (a.type === 'theory' ? 1 : -1)));
                    } else {
                        alert("Student ID Not Recognized.");
                    }
                } catch (e) { alert("Connection Error."); }
                setLoading(false);
            };

            async function finish() {
                if (!confirm("Confirm submission?")) return;
                let objRaw = 0, objTotal = 0, thyRaw = 0;
                const theoryData = [];

                questions.forEach((q, i) => {
                    const ans = answers[i];
                    if (q.type === 'theory') {
                        const max = q.maxMarks || 10;
                        const keys = q.keywords?.split(',').map(k => k.trim().toLowerCase()) || [];
                        const match = ans ? keys.filter(k => ans.toLowerCase().includes(k)).length : 0;
                        const mark = ans && keys.length > 0 ? Math.round(max * (match / keys.length)) : 0;
                        thyRaw += mark;
                        theoryData.push({ studentText: ans || '', keywords: q.keywords, autoMark: mark, maxMarks: max });
                    } else {
                        objTotal++;
                        if (ans === q.correctOptionIndex) objRaw++;
                    }
                });

                const scoreA = objTotal > 0 ? Math.round((objRaw / objTotal) * 30) : 0;
                const totalPct = Math.round(((scoreA + thyRaw) / 70) * 100);

                await fb.addDoc(fb.collection(fb.db, "artifacts/my-project-a6208/scores"), {
                    studentName: student.name, studentId: student.id, className: student.className,
                    scoreA, scoreB: thyRaw, percentage: totalPct, theoryAnswers: theoryData, isReviewed: false, date: new Date()
                });
                setFinished(true);
            }

            if (finished) return (
                <div className="flex items-center justify-center min-h-screen bg-slate-50 p-6">
                    <div className="bg-white p-12 rounded-[3rem] shadow-2xl text-center w-full max-w-sm border">
                        <img src="https://sunnykeyz123.github.io/mustardseedschl/images/Logo.png" className="w-16 mx-auto mb-6" />
                        <h2 className="text-green-600 font-black text-xl mb-4">SUCCESS!</h2>
                        <div className="bg-blue-600 p-8 rounded-[2rem] text-white mb-8">
                            <h3 className="text-xl font-black">Submitted Successfully</h3>
                        </div>
                        <button onClick={() => window.location.reload()} className="w-full bg-slate-900 text-white py-4 rounded-2xl font-black text-sm">EXIT PORTAL</button>
                    </div>
                </div>
            );

            if (!student) return (
                <div className="flex items-center justify-center min-h-screen p-4 bg-blue-600">
                    <div className="bg-white p-10 rounded-[3rem] shadow-2xl w-full max-w-sm text-center">
                        <img src="https://sunnykeyz123.github.io/mustardseedschl/images/Logo.png" className="w-16 mx-auto mb-8" />
                        <h2 className="text-xl font-black mb-8 uppercase text-slate-800">CBT Login</h2>
                        <input className="w-full p-5 border-2 border-slate-100 rounded-3xl mb-4 text-center font-black uppercase text-blue-600" placeholder="MS-XXXXX" onChange={e => setMsId(e.target.value)} />
                        <button onClick={verifyId} className="w-full py-5 bg-blue-600 text-white rounded-[2rem] font-black shadow-xl shadow-blue-100">BEGIN TEST</button>
                    </div>
                </div>
            );

            const q = questions[index];
            if (!q) return <div className="p-20 text-center font-black animate-pulse uppercase tracking-widest text-blue-500">Loading Exam...</div>;

            return (
                <div className="max-w-2xl mx-auto p-6 pt-16">
                    <div className="flex justify-between items-center mb-10">
                        <div className="font-black text-[10px] bg-white border px-4 py-2 rounded-full uppercase text-slate-400">
                            {q.type === 'theory' ? 'Sec B: Theory' : 'Sec A: Objective'}
                        </div>
                        <div className="font-black text-blue-600 text-lg">{index + 1} <span className="text-slate-300 text-xs">/ {questions.length}</span></div>
                    </div>
                    <div className="bg-white p-10 rounded-[2.5rem] shadow-2xl border-t-8 border-blue-600">
                        <h3 className="text-xl font-black mb-10 text-slate-800 leading-snug">{q.text}</h3>
                        {q.type === 'theory' ? (
                            <textarea className="w-full p-6 bg-slate-50 border-2 rounded-[2rem] h-56 outline-none focus:border-blue-600 font-bold transition" placeholder="Answer here..." value={answers[index] || ''} onChange={e => setAnswers({...answers, [index]: e.target.value})} />
                        ) : (
                            <div className="space-y-3">
                                {q.options.map((opt, i) => (
                                    <button key={i} onClick={() => setAnswers({...answers, [index]: i})} className={`w-full p-5 text-left rounded-2xl border-2 transition font-black ${answers[index] === i ? 'bg-blue-600 text-white border-blue-600 shadow-lg shadow-blue-100' : 'bg-white border-slate-50 hover:border-slate-200 text-slate-500'}`}>
                                        <span className="opacity-40 mr-4">{optionLetters[i]}</span> {opt}
                                    </button>
                                ))}
                            </div>
                        )}
                        <div className="mt-12 flex justify-between items-center">
                            <button onClick={()=>setIndex(i=>i-1)} disabled={index===0} className="font-black text-slate-300 uppercase text-[10px] disabled:opacity-0 transition">Previous</button>
                            {index === questions.length-1 ? 
                                <button onClick={finish} className="bg-green-600 text-white px-12 py-4 rounded-2xl font-black shadow-lg shadow-green-100 uppercase text-xs">Finish Test</button> : 
                                <button onClick={()=>setIndex(i=>i+1)} className="bg-blue-600 text-white px-12 py-4 rounded-2xl font-black shadow-lg shadow-blue-100 uppercase text-xs">Next Question</button>
                            }
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [page, setPage] = React.useState('home');
            const [ready, setReady] = React.useState(false);
            React.useEffect(() => { const i = setInterval(() => { if(window.fb) { setReady(true); clearInterval(i); }}, 100); }, []);
            if (!ready) return <div className="p-20 text-center font-black text-blue-600 uppercase tracking-widest text-sm">System Handshake...</div>;

            return (
                <AppContext.Provider value={{ setPage }}>
                    {page === 'home' && (
                        <div className="flex flex-col items-center justify-center min-h-screen text-center p-6 bg-white">
                            <img src="https://sunnykeyz123.github.io/mustardseedschl/images/Logo.png" className="w-24 mb-6" />
                            <h1 className="text-5xl font-black mb-2 tracking-tighter uppercase text-slate-900">Mustard Seed</h1>
                            <p className="text-gray-400 font-bold text-sm tracking-[0.4em] uppercase mb-16">Advanced CBT Portal</p>
                            <div className="flex flex-col sm:flex-row gap-4">
                                <button onClick={() => setPage('exam')} className="bg-blue-600 text-white px-16 py-5 rounded-full font-black shadow-2xl shadow-blue-100 transform transition hover:scale-105 active:scale-95">START EXAM</button>
                                <button onClick={() => setPage('admin')} className="bg-white text-slate-400 px-16 py-5 rounded-full font-black border-2 hover:bg-slate-50 transition text-sm">ADMIN PANEL</button>
                            </div>
                        </div>
                    )}
                    {page === 'exam' && <StudentExamPage />}
                    {page === 'admin' && <AdminPage />}
                </AppContext.Provider>
            );
        };

        const AppContext = React.createContext(null);
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
