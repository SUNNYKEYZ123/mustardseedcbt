<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBT Exam Application</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- React and ReactDOM CDNs -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel CDN for JSX transformation in browser (NOT for production) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Firebase CDNs -->
    <div id="root"></div>
    <script type="text/babel">
    const { createClient } = window.supabase;
    const SB_URL = 'https://jqrcoqslmylmubxwfgyt.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxcmNvcXNsbXlsbXVieHdmZ3l0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ2ODc2NzgsImV4cCI6MjA4MDI2MzY3OH0.4bXOY35R3eGYZjPxtuJzvwifPEfHXr5UEdzFbB-caKU';
    const _supabase = createClient(SB_URL, SB_KEY);

    const AppContext = React.createContext(null);
    const ADMIN_PASSWORD = 'SUNNYKEYZ2025@';

    // --- STUDENT EXAM PAGE ---
    const StudentExamPage = () => {
        const { appId, setPage } = React.useContext(AppContext);
        const [msId, setMsId] = React.useState('');
        const [student, setStudent] = React.useState(null);
        const [questions, setQuestions] = React.useState([]);
        const [index, setIndex] = React.useState(0);
        const [answers, setAnswers] = React.useState({});
        const [loading, setLoading] = React.useState(false);
        const [finished, setFinished] = React.useState(false);
        const [finalScore, setFinalScore] = React.useState(0);

        // FIX: Matches your Admission Form ID logic
        const verifyAndStart = async () => {
            if (!msId.trim()) return alert("Enter MS-ID");
            setLoading(true);
            const inputId = msId.toUpperCase().trim();

            try {
                const { data: students, error } = await _supabase
                    .from('students')
                    .select('id, full_name')
                    .eq('status', 'Enrolled');

                if (error) throw error;

                const found = students.find(s => {
                    const calculatedID = "MS-" + s.id.substring(0, 5).toUpperCase();
                    return calculatedID === inputId;
                });

                if (found) {
                    setStudent({ full_name: found.full_name, username: inputId });
                    fetchQuestions();
                } else {
                    alert("ID not found. Ensure you submitted the Admission Form.");
                }
            } catch (e) { alert("Connection Error"); }
            setLoading(false);
        };

        const fetchQuestions = async () => {
            const qRef = fb.collection(fb.db, `artifacts/${appId}/public/data/questions`);
            const snap = await fb.getDocs(qRef);
            setQuestions(snap.docs.map(d => ({ id: d.id, ...d.data() })));
        };

        const submitExam = async () => {
            let score = 0;
            questions.forEach((q, i) => { if(answers[i] === q.correctOptionIndex) score++; });
            const pct = Math.round((score / questions.length) * 100);
            
            await fb.addDoc(fb.collection(fb.db, `artifacts/${appId}/scores`), {
                studentName: student.full_name,
                studentId: student.username,
                score: pct,
                timestamp: new Date()
            });
            setFinalScore(pct);
            setFinished(true);
        };

        if (finished) return (
            <div className="flex flex-col items-center justify-center min-h-screen text-center p-4">
                <h1 className="text-5xl font-bold text-blue-600 mb-4">{finalScore}%</h1>
                <p className="text-gray-600 mb-8">Well done, {student.full_name}!</p>
                <button onClick={() => setPage('home')} className="bg-gray-900 text-white px-10 py-3 rounded-full">Exit Portal</button>
            </div>
        );

        if (!student) return (
            <div className="flex items-center justify-center min-h-screen bg-blue-50">
                <div className="bg-white p-8 rounded-2xl shadow-xl max-w-sm w-full">
                    <h2 className="text-2xl font-bold mb-2">CBT Login</h2>
                    <p className="text-gray-500 text-sm mb-6">Enter the MS-ID from your profile.</p>
                    <input className="w-full p-4 border rounded-xl mb-4 font-mono text-xl uppercase" placeholder="MS-XXXXX" value={msId} onChange={e => setMsId(e.target.value)} />
                    <button onClick={verifyAndStart} className="w-full py-4 bg-blue-600 text-white rounded-xl font-bold text-lg">
                        {loading ? "Verifying..." : "Start Exam"}
                    </button>
                    <button onClick={() => setPage('home')} className="w-full mt-4 text-gray-400 text-sm font-medium">Back to Home</button>
                </div>
            </div>
        );

        return (
            <div className="max-w-2xl mx-auto p-6 pt-12">
                <div className="flex justify-between items-center mb-8 pb-4 border-b">
                    <div>
                        <p className="text-xs font-bold text-gray-400 uppercase tracking-widest">Student</p>
                        <h3 className="font-bold text-gray-800">{student.full_name}</h3>
                    </div>
                    <div className="text-right">
                        <p className="text-xs font-bold text-gray-400 uppercase tracking-widest">Progress</p>
                        <h3 className="font-bold text-blue-600">{index + 1} / {questions.length}</h3>
                    </div>
                </div>
                {questions.length > 0 && (
                    <div className="bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
                        <p className="text-xl font-medium mb-8 text-gray-800 leading-relaxed">{questions[index].questionText}</p>
                        <div className="space-y-3">
                            {questions[index].options.map((opt, i) => (
                                <button key={i} onClick={() => setAnswers({...answers, [index]: i})} 
                                    className={`w-full p-5 text-left rounded-xl border-2 transition-all ${answers[index] === i ? 'bg-blue-50 border-blue-600 text-blue-700' : 'border-gray-50 hover:border-gray-200 text-gray-600'}`}>
                                    <span className="font-bold mr-3 opacity-30">{String.fromCharCode(65 + i)}.</span> {opt}
                                </button>
                            ))}
                        </div>
                        <div className="mt-10 flex justify-between">
                            <button className="text-gray-400 font-bold px-4" onClick={() => setIndex(i => i - 1)} disabled={index === 0}>Previous</button>
                            {index === questions.length - 1 ? 
                                <button onClick={submitExam} className="bg-green-600 text-white px-10 py-3 rounded-xl font-bold shadow-lg">Submit Exam</button> :
                                <button onClick={() => setIndex(i => i + 1)} className="bg-blue-600 text-white px-10 py-3 rounded-xl font-bold shadow-lg">Next Question</button>
                            }
                        </div>
                    </div>
                )}
            </div>
        );
    };

    // --- ADMIN PAGE ---
    const AdminPage = () => {
        const { appId, setPage } = React.useContext(AppContext);
        const [auth, setAuth] = React.useState(false);
        const [pass, setPass] = React.useState('');
        const [scores, setScores] = React.useState([]);

        const checkPass = () => {
            if (pass === ADMIN_PASSWORD) setAuth(true);
            else alert("Wrong password");
        };

        React.useEffect(() => {
            if (!auth) return;
            const q = fb.query(fb.collection(fb.db, `artifacts/${appId}/scores`));
            return fb.onSnapshot(q, (snap) => {
                setScores(snap.docs.map(d => ({ id: d.id, ...d.data() })));
            });
        }, [auth]);

        if (!auth) return (
            <div className="flex flex-col items-center justify-center min-h-screen">
                <input type="password" placeholder="Admin Password" className="p-3 border rounded mb-4" value={pass} onChange={e => setPass(e.target.value)} />
                <button onClick={checkPass} className="bg-gray-800 text-white px-8 py-2 rounded">Login Admin</button>
            </div>
        );

        return (
            <div className="p-8 max-w-4xl mx-auto">
                <div className="flex justify-between mb-8">
                    <h1 className="text-2xl font-bold">Exam Scores</h1>
                    <button onClick={() => setPage('home')} className="text-blue-600">Home</button>
                </div>
                <div className="bg-white rounded-xl shadow overflow-hidden">
                    <table className="w-full text-left">
                        <thead className="bg-gray-50 border-b">
                            <tr>
                                <th className="p-4">Student Name</th>
                                <th className="p-4">MS-ID</th>
                                <th className="p-4">Score</th>
                            </tr>
                        </thead>
                        <tbody>
                            {scores.map(s => (
                                <tr key={s.id} className="border-b">
                                    <td className="p-4">{s.studentName}</td>
                                    <td className="p-4 font-mono">{s.studentId}</td>
                                    <td className="p-4 font-bold text-blue-600">{s.score}%</td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            </div>
        );
    };

    // --- MAIN APP ---
    const App = () => {
        const [page, setPage] = React.useState('home');
        const [ready, setReady] = React.useState(false);
        
        React.useEffect(() => {
            const check = setInterval(() => {
                if (window.fb) { setReady(true); clearInterval(check); }
            }, 100);
            return () => clearInterval(check);
        }, []);

        if (!ready) return <div className="p-10 text-center text-gray-400">Connecting to Mustard Seed Systems...</div>;

        return (
            <AppContext.Provider value={{ appId: 'mustard-seed-cbt', setPage }}>
                {page === 'home' && (
                    <div className="flex flex-col items-center justify-center min-h-screen bg-slate-50">
                        <img src="https://sunnykeyz123.github.io/mustardseedschl/images/Logo.png" className="h-24 mb-6" />
                        <h1 className="text-3xl font-black text-slate-800 mb-8">MUSTARD SEED CBT</h1>
                        <div className="space-x-4">
                            <button onClick={() => setPage('exam')} className="bg-blue-600 text-white px-10 py-4 rounded-full font-bold shadow-lg">Take Exam</button>
                            <button onClick={() => setPage('admin')} className="bg-white text-slate-600 px-10 py-4 rounded-full font-bold border shadow-sm">Admin</button>
                        </div>
                    </div>
                )}
                {page === 'exam' && <StudentExamPage />}
                {page === 'admin' && <AdminPage />}
            </AppContext.Provider>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>

<div id="root"></div>
</body>

</html>
